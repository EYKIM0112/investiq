name: Update KIS Master

# 주 1회 자동 실행 + 수동 실행(버튼) 지원
on:
  schedule:
    # 매주 일요일 18:00 UTC = 월요일 03:00 KST (주말 사이 상장/상폐 반영, 장 시작 전)
    - cron: "0 18 * * 0"
  workflow_dispatch: {}   # Actions 탭에서 "Run workflow" 버튼으로 수동 실행

permissions:
  contents: write         # 갱신된 JSON을 커밋/푸시하기 위해 필요

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build KIS master JSON
        env:
          KIS_WORK_DIR: ${{ runner.temp }}   # .mst/.zip 임시파일은 repo 밖에 둠
          KIS_OUT_DIR: public                # 산출물은 public/ 에 (CRA 정적 배포 경로)
        run: python scripts/build_kis_master.py

      - name: Show diff summary
        run: |
          echo "== git status =="
          git status --short public/kis_master.json public/kis_master_us.json || true
          echo "== 종목 수 =="
          python - <<'PY'
          import json
          for f in ("public/kis_master.json","public/kis_master_us.json"):
              d=json.load(open(f,encoding="utf-8"))
              m=d.get("_meta",{})
              print(f, "→", {k:v for k,v in m.items()})
          PY

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/kis_master.json public/kis_master_us.json; then
            echo "변경 없음 — 커밋 생략"
          else
            git add public/kis_master.json public/kis_master_us.json
            git commit -m "chore: KIS 마스터 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
            echo "갱신 커밋 완료 → Vercel 자동 배포됨"
          fi
