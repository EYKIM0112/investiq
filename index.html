          const market = item[2] === "2" ? "KOSDAQ" : "KOSPI";
          const isETF  = ETF_BRANDS.some(b => name.toUpperCase().startsWith(b));
          return { symbol: code + (market === "KOSDAQ" ? ".KQ" : ".KS"), longname: name, shortname: name, quoteType: isETF ? "ETF" : "EQUITY", exchDisp: market };
        }).filter(x => x.symbol.length > 3);

        const naverAcUrl = `https://ac.finance.naver.com/ac?q=${encodeURIComponent(qTrimmed)}&q_enc=UTF-8&t_koreng=1&st=111&r_lt=111&r_format=json`;

        // 1차: CORS 프록시 → Naver AC (allorigins / corsproxy 병렬)
        if (results.length === 0) {
          const proxies = [
            `https://api.allorigins.win/raw?url=${encodeURIComponent(naverAcUrl)}`,
            `https://corsproxy.io/?${encodeURIComponent(naverAcUrl)}`,
          ];
          const fetched = await Promise.any(proxies.map(async (pUrl) => {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), 6000);
            const r = await fetch(pUrl, { signal: ctrl.signal });
            clearTimeout(t);
            if (!r.ok) throw new Error("not ok");
            const d = await r.json();
            if (!(d.items || []).length) throw new Error("empty");
            return d;
          })).catch(() => null);
          if (fetched) results = parseNaverAC(fetched.items);
        }

        // 2차: Naver AC 직접 호출
        if (results.length === 0) {
          try {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), 5000);
            const r = await fetch(naverAcUrl, { signal: ctrl.signal });
            clearTimeout(t);
            if (r.ok) {
              const data = await r.json();
              if ((data.items || []).length > 0) results = parseNaverAC(data.items);
            }
          } catch(e) { console.log("Naver 직접 호출 실패:", e.message); }
        }

        // 3차: /api/naver?type=search 프록시
        if (results.length === 0) {
          try {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), 18000);
            const res = await fetch(`/api/naver?type=search&q=${encodeURIComponent(qTrimmed)}`, { signal: ctrl.signal });
            clearTimeout(t);
            if (res.ok) {
              const data = await res.json();
              results = (data.quotes || []).filter(r => ["ETF","EQUITY","MUTUALFUND"].includes(r.quoteType));
            }
          } catch(e) { console.log("Naver 프록시 실패:", e.message); }
        }

        // 4차: Yahoo KR 로케일 검색 — lang=ko-KR&region=KR 파라미터로 한국어명 직접 반환
        if (results.length === 0) {
          const krBase=`https://query1.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(qTrimmed)}&lang=ko-KR&region=KR&quotesCount=10&newsCount=0`;
          const krUrls=[`/api/yahoo?type=search&q=${encodeURIComponent(qTrimmed)}&region=KR`,`https://api.allorigins.win/raw?url=${encodeURIComponent(krBase)}`,krBase];
          for(const url of krUrls){try{const ctrl=new AbortController(),t=setTimeout(()=>ctrl.abort(),8000);const r=await fetch(url,{signal:ctrl.signal});clearTimeout(t);if(!r.ok)continue;const d=await r.json();const q=(d.quotes||[]).filter(x=>["ETF","EQUITY","MUTUALFUND"].includes(x.quoteType)&&(x.symbol?.endsWith(".KS")||x.symbol?.endsWith(".KQ")));if(q.length>0){results=q;break;}}catch(e){}}
        }
        // 5차: 여전히 영어명이면 /api/naver type=names 로 보완
        if(results.length>0&&!results.some(r=>/[가-힣]/.test(r.longname||""))){try{const kodesStr=results.map(r=>(r.symbol||"").replace(/\.(KS|KQ)$/,"")).filter(c=>/^\d{6}$/.test(c)).join(",");if(kodesStr){const ctrl=new AbortController(),t=setTimeout(()=>ctrl.abort(),5000);const nr=await fetch(`/api/naver?type=names&codes=${kodesStr}`,{signal:ctrl.signal});clearTimeout(t);if(nr.ok){const nd=await nr.json();if(nd.names&&Object.keys(nd.names).length>0)results=results.map(r=>{const code=(r.symbol||"").replace(/\.(KS|KQ)$/,"");const ko=nd.names[code];return ko?{...r,longname:ko,shortname:ko}:r;});}}}catch(e){}}
      } else {
        // 해외 종목: Yahoo Finance
        const filterFn =
          ctry === "US" ? (q => !q.symbol?.includes(".")||["NMS","NYQ","NGM","PCX"].includes(q.exchange)) :
          ctry === "JP" ? (q => q.symbol?.endsWith(".T")) :
          ctry === "CN" ? (q => q.symbol?.endsWith(".SS")||q.symbol?.endsWith(".SZ")) :
          null;
        results = await searchYahoo(qTrimmed, filterFn);
      }
    } catch(e) { console.warn("검색 오류:", e.message); }

    setSearchResults(results.slice(0, 6));
    setSearching(false);
  };

  const handleSearchChange = (v) => {
    setSearchQ(v); setSelected(null);
    setSearchResults([]);
  };
  const handleSearchSubmit = () => { if (searchQ.trim()) doSearch(searchQ, country); };

  const fetchCurrentPriceForAdd = async () => {
    const ticker = (selected?.ticker || "").replace(/\.(KS|KQ)$/, "");
    const yTicker = selected?.ticker;
    const name = selected?.name || (directMode ? directName.trim() : searchQ.trim());
    setFetchingPrice(true); setShowPriceInput(true);
    try {
      if (/^\d{6}$/.test(ticker)) {
        const res = await fetch(`/api/naver?codes=${ticker}`);
        if (res.ok) {
          const d = await res.json();
          const r = d.results?.[ticker];
          if (r?.currentPrice > 0) { setCurrentPriceInput(String(r.currentPrice)); setFetchingPrice(false); return; }
        }
      }
      if (yTicker) {
        const res = await fetch(`/api/yahoo?type=chart&ticker=${encodeURIComponent(yTicker)}`);
        if (res.ok) {
          const d = await res.json();
          const price = d.chart?.result?.[0]?.meta?.regularMarketPrice;
          if (price > 0) { setCurrentPriceInput(String(Math.round(price))); setFetchingPrice(false); return; }
        }
      }
      if (name) {
        const body = { contents:[{role:"user",parts:[{text:`${name} 현재 주가(${priceUnit==="USD"?"달러":"원화"})를 검색해서 숫자만 반환`}]}], tools:[{googleSearch:{}}], generationConfig:{maxOutputTokens:100,temperature:0,thinkingConfig:{thinkingBudget:0}} };
        const res = await fetch(GEMINI_PROXY, {method:"POST",headers: await geminiHeaders(),body:JSON.stringify({model:"gemini-2.5-flash-lite",body,stream:false})});
        if (res.ok) {
          const data = await res.json();
          const text = data.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||"";
          const num = parseFloat(text.replace(/[^0-9.]/g,""));
          if (num > 0) { setCurrentPriceInput(String(priceUnit==="KRW"?Math.round(num):num)); setFetchingPrice(false); return; }
        }
      }
      alert("현재가를 자동으로 가져올 수 없습니다.\n직접 입력해주세요.");
    } catch(e) { console.warn("현재가 조회 실패:", e); }
    setFetchingPrice(false);
  };

  const handleAdd = () => {
    const cp = parseFloat(String(currentPriceInput).replace(/,/g,""));
    const finalCurrentPrice = (showPriceInput && cp > 0) ? cp : null;
    if (directMode) {
      if (!directName.trim()) { alert("종목명을 입력해주세요."); return; }
      if (!avgPrice || !shares) { alert("평균단가와 수량을 입력해주세요."); return; }
      if (!finalAccount) { alert("계좌를 선택하거나 신규 계좌명을 입력해주세요."); return; }
      onAdd({ ticker: "", yahoo_ticker: null, name: directName.trim(),
        avg_price: parseFloat(String(avgPrice).replace(/,/g,"")) || 0,
        shares: parseFloat(shares) || 0, currency, sector, account: finalAccount, current_price: finalCurrentPrice });
      return;
    }
    if (!selected && !searchQ.trim()) { alert("종목을 검색해서 선택해주세요."); return; }
    if (!avgPrice || !shares) { alert("평균단가와 수량을 입력해주세요."); return; }
    if (!finalAccount) { alert("계좌를 선택하거나 신규 계좌명을 입력해주세요."); return; }
    onAdd({
      ticker: (selected?.ticker || searchQ.trim()).replace(/\.(KS|KQ)$/, ""),
      yahoo_ticker: selected?.ticker || null,
      name: selected?.name || searchQ.trim(),
      avg_price: parseFloat(String(avgPrice).replace(/,/g,"")) || 0,
      shares: parseFloat(shares) || 0,
      currency, sector,
      account: finalAccount,
      current_price: finalCurrentPrice,
    });
  };

  const SECTORS = ["기타","국내지수","미국지수","반도체","AI·로보틱스","미국빅테크","전력인프라","원자력","방산·조선","2차전지","금·원자재","배당","채권","신흥국"];

  return (
    <div style={{ position:"fixed", inset:0, background:"#00000088", zIndex:500, display:"flex", alignItems:"flex-end" }} onClick={onClose}>
      <div style={{ background:"#0f0f18", borderRadius:"20px 20px 0 0", padding:"20px 18px 36px", width:"100%", maxWidth:480, margin:"0 auto", maxHeight:"90vh", overflowY:"auto" }} onClick={e=>e.stopPropagation()}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:18 }}>
          <div style={{ fontSize:16, fontWeight:800, color:"#a8b4f8" }}>✏️ 종목 추가</div>
          <button onClick={onClose} style={{ background:"none", border:"none", color:"#64748b", fontSize:22, cursor:"pointer" }}>×</button>
        </div>

        {/* 계좌 선택 */}
        <div style={{ marginBottom:14 }}>
          <div style={{ fontSize:12, color:"#64748b", marginBottom:6, fontWeight:600 }}>계좌</div>
          {!showNewAccount && existingAccounts.length > 0 ? (
            <div style={{ display:"flex", gap:8 }}>
              <select value={account} onChange={e=>setAccount(e.target.value)}
                style={{ flex:1, background:"#16162a", border:"1px solid #1e1e35", borderRadius:8, padding:"11px 12px", color:"#e8eaf0", fontSize:14, outline:"none" }}>
                {existingAccounts.map(a => <option key={a} value={a}>{a}</option>)}
              </select>
              <button onClick={()=>setShowNewAccount(true)} style={{ padding:"0 12px", borderRadius:8, background:"#16162a", border:"1px solid #1e1e35", color:"#64748b", fontSize:12, cursor:"pointer", whiteSpace:"nowrap" }}>+ 신규</button>
            </div>
          ) : (
            <div style={{ display:"flex", gap:8 }}>
              <input value={newAccountName} onChange={e=>setNewAccountName(e.target.value)} placeholder="새 계좌명 입력"
                style={{ flex:1, background:"#16162a", border:"1px solid #1e1e35", borderRadius:8, padding:"11px 12px", color:"#e8eaf0", fontSize:14, outline:"none" }} />
              {existingAccounts.length>0 && <button onClick={()=>setShowNewAccount(false)} style={{ padding:"0 12px", borderRadius:8, background:"#16162a", border:"1px solid #1e1e35", color:"#64748b", fontSize:12, cursor:"pointer" }}>기존</button>}
            </div>
          )}
        </div>

        {/* 국가 선택 */}
        <div style={{ marginBottom:10 }}>
          <div style={{ fontSize:12, color:"#64748b", marginBottom:6, fontWeight:600 }}>국가</div>
          <div style={{ display:"flex", gap:4, overflowX:"auto" }}>
            {COUNTRIES.map(c => (
              <button key={c.id} onClick={()=>{setCountry(c.id);if(searchQ)doSearch(searchQ,c.id);}} style={{
                padding:"6px 10px", borderRadius:8, border:"none", cursor:"pointer", whiteSpace:"nowrap", flexShrink:0,
                background:country===c.id?"#a8b4f822":"#16162a",
                color:country===c.id?"#a8b4f8":"#475569",
                fontSize:11, fontWeight:700,
              }}>{c.label}</button>
            ))}
          </div>
        </div>

        {/* 종목 검색 */}
        <div style={{ marginBottom:14 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
            <div style={{ fontSize:12, color:"#64748b", fontWeight:600 }}>종목 {directMode?"직접입력":"검색"}</div>
            <button onClick={()=>{ setDirectMode(!directMode); setSelected(null); setSearchResults([]); setDirectName(""); setSearchQ(""); }}
              style={{ fontSize:11, color:directMode?"#4f6ef7":"#64748b", background:"none", border:"1px solid #334155", borderRadius:6, padding:"2px 8px", cursor:"pointer" }}>
              {directMode ? "🔍 검색으로" : "✎ 직접입력 (TDF·펀드)"}
            </button>
          </div>
          {directMode ? (
            <div>
              <input value={directName} onChange={e=>setDirectName(e.target.value)}
                placeholder="종목명 직접 입력 (검색 안되는 TDF·펀드 등)"
                style={{ width:"100%", background:"#16162a", border:"1px solid #0ea5e966", borderRadius:8, padding:"11px 12px", color:"#e8eaf0", fontSize:14, outline:"none" }} />
              {directName.trim() && <div style={{ fontSize:11, color:"#0ea5e9", marginTop:4 }}>✓ {directName.trim()} (티커 없이 추가 · 자동 가격조회 제한)</div>}
            </div>
          ) : (
            <>
              <div style={{ display:"flex", gap:8, marginBottom:4 }}>
                <input value={searchQ} onChange={e=>handleSearchChange(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&handleSearchSubmit()}
                  placeholder="종목명 또는 티커 검색..."
                  style={{ flex:1, background:"#16162a", border:`1px solid ${selected?"#a8b4f8":"#1e1e35"}`, borderRadius:8, padding:"11px 12px", color:"#e8eaf0", fontSize:14, outline:"none" }} />
                <button onClick={handleSearchSubmit} disabled={searching} style={{ padding:"0 14px", borderRadius:8, background:"#a8b4f822", border:"1px solid #a8b4f844", color:"#a8b4f8", fontWeight:700, fontSize:13, cursor:"pointer", whiteSpace:"nowrap" }}>
                  {searching ? "..." : "검색"}
                </button>
              </div>
              {selected && <div style={{ fontSize:11, color:"#a8b4f8", marginBottom:4 }}>✓ {selected.name} ({selected.ticker}) · {selected.exchange}</div>}
              {searching && <div style={{ fontSize:12, color:"#a8b4f8", padding:"6px 4px", display:"flex", alignItems:"center", gap:6 }}><Spinner size={11}/> 검색 중...</div>}
              {searchResults.length>0 && !selected && (
                <div style={{ background:"#22223a", borderRadius:8, overflow:"hidden", border:"1px solid #3a3a6a" }}>
                  {searchResults.map((q,i) => (
                    <button key={i} onClick={()=>{
                      setSelected({name:q.longname||q.shortname||q.symbol, ticker:q.symbol, exchange:q.exchDisp||q.exchange||""});
                      setSearchQ(q.longname||q.shortname||q.symbol);
                      setSearchResults([]);
                    }} style={{
                      width:"100%", padding:"10px 12px", background:"transparent",
                      border:"none", borderBottom:i<searchResults.length-1?"1px solid #2a2a4a":"none",
                      color:"#f0f0ff", fontSize:13, cursor:"pointer", textAlign:"left",
                      display:"flex", justifyContent:"space-between", alignItems:"center",
                    }}>
                      <div>
                        <div style={{ fontWeight:600 }}>{q.longname||q.shortname||q.symbol}</div>
                        <div style={{ fontSize:11, color:"#6a6a9a" }}>{q.symbol} · {q.exchDisp||q.exchange||""}</div>
                      </div>
                      <div style={{ fontSize:10, color:"#8a8ab8", background:"#16162a", padding:"2px 6px", borderRadius:4 }}>{q.quoteType}</div>
                    </button>
                  ))}
                </div>
              )}
            </>
          )}
        </div>

        {/* 평균단가 + 수량 */}
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:14 }}>
          <div>
            <div style={{ fontSize:12, color:"#64748b", marginBottom:6, fontWeight:600 }}>평균단가</div>
            <input value={avgPrice} onChange={e=>setAvgPrice(e.target.value)} inputMode="decimal" placeholder="0"
              style={{ width:"100%", background:"#16162a", border:"1px solid #1e1e35", borderRadius:8, padding:"11px 12px", color:"#e8eaf0", fontSize:14, outline:"none" }} />
          </div>
          <div>
            <div style={{ fontSize:12, color:"#64748b", marginBottom:6, fontWeight:600 }}>수량 (주/좌)</div>
            <input value={shares} onChange={e=>setShares(e.target.value)} inputMode="decimal" placeholder="0"
              style={{ width:"100%", background:"#16162a", border:"1px solid #1e1e35", borderRadius:8, padding:"11px 12px", color:"#e8eaf0", fontSize:14, outline:"none" }} />
          </div>
        </div>

        {/* 통화 + 섹터 */}
        <div style={{ display:"grid", gridTemplateColumns:"1fr 2fr", gap:10, marginBottom:18 }}>
          <div>
            <div style={{ fontSize:12, color:"#64748b", marginBottom:6, fontWeight:600 }}>통화</div>
            <select value={currency} onChange={e=>setCurrency(e.target.value)}
              style={{ width:"100%", background:"#16162a", border:"1px solid #1e1e35", borderRadius:8, padding:"11px 8px", color:"#e8eaf0", fontSize:13, outline:"none" }}>
              <option value="KRW">₩ KRW</option>
              <option value="USD">$ USD</option>
              <option value="JPY">¥ JPY</option>
            </select>
          </div>
          <div>
            <div style={{ fontSize:12, color:"#64748b", marginBottom:6, fontWeight:600 }}>섹터</div>
            <select value={sector} onChange={e=>setSector(e.target.value)}
              style={{ width:"100%", background:"#16162a", border:"1px solid #1e1e35", borderRadius:8, padding:"11px 12px", color:"#e8eaf0", fontSize:13, outline:"none" }}>
              {SECTORS.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
        </div>

        {/* 현재가 (선택) */}
        <div style={{ marginBottom: 18 }}>
          <div style={{ fontSize:12, color:"#64748b", marginBottom:8, fontWeight:600 }}>
            현재가 <span style={{ fontSize:11, color:"#475569", fontWeight:400 }}>(선택 · 미입력 시 자동조회로 나중에 반영 가능)</span>
          </div>
          <div style={{ display:"flex", gap:8, marginBottom: showPriceInput ? 8 : 0 }}>
            <button onClick={fetchCurrentPriceForAdd} disabled={fetchingPrice} style={{
              flex:1, padding:"10px", borderRadius:8, border:"1px solid #22d3a044",
              background: fetchingPrice ? "#22d3a011" : "#22d3a022",
              color:"#22d3a0", fontWeight:700, fontSize:13, cursor:"pointer",
              display:"flex", alignItems:"center", justifyContent:"center", gap:6,
            }}>
              {fetchingPrice ? <><Spinner size={13}/>조회 중</> : "📡 자동 반영"}
            </button>
            <button onClick={()=>setShowPriceInput(true)} style={{
              flex:1, padding:"10px", borderRadius:8,
              border:`1px solid ${showPriceInput&&!fetchingPrice?"#4f6ef7":"#1e1e35"}`,
              background: showPriceInput&&!fetchingPrice ? "#4f6ef722" : "#16162a",
              color: showPriceInput&&!fetchingPrice ? "#a8b4f8" : "#64748b",
              fontWeight:700, fontSize:13, cursor:"pointer",
            }}>✎ 직접 입력</button>
          </div>
          {showPriceInput && (
            <div style={{ display:"flex", gap:8 }}>
              <input value={currentPriceInput} onChange={e=>setCurrentPriceInput(e.target.value)}
                inputMode="decimal" placeholder="현재가 입력"
                style={{ flex:1, background:"#16162a", border:"1px solid #1e1e35", borderRadius:8, padding:"11px 12px", color:"#e8eaf0", fontSize:14, outline:"none" }} />
              {/* 통화 - 현재 KRW 고정, 향후 USD 등 select로 확장 예정 */}
              <div style={{ padding:"0 14px", borderRadius:8, background:"#16162a", border:"1px solid #1e1e35", color:"#64748b", fontSize:13, display:"flex", alignItems:"center", minWidth:60, justifyContent:"center" }}>
                {priceUnit}
              </div>
            </div>
          )}
        </div>

        <button onClick={handleAdd} style={{
          width:"100%", padding:"14px", borderRadius:12, border:"none",
          background:"linear-gradient(135deg,#4f6ef7,#7c3aed)",
          color:"#fff", fontWeight:800, fontSize:15, cursor:"pointer",
        }}>종목 추가</button>
      </div>
    </div>
  );
}


// ---------- 포트폴리오 탭 ----------
// ---------- 계좌 파일 등록 모달 (계좌명 직접입력 or 기존계좌 선택 → 다중 파일 한 계좌로 병합) ----------
function AccountInputModal({ kind = "image", existingAccounts = [], initialFiles = [], onSubmit, onCancel }) {
  const isSheet = kind === "spreadsheet";
  const [mode, setMode] = useState("new"); // "new" | 기존 계좌명
  const [name, setName] = useState("");
  const [files, setFiles] = useState(initialFiles);
  const [dragOver, setDragOver] = useState(false);

  const accept = isSheet ? ".xlsx,.xls,.csv" : "image/*";
  const okExt = isSheet ? ["xlsx","xls","csv"] : ["jpg","jpeg","png","webp","gif","heic","heif","bmp"];
  const isOk = (f) => {
    const ext = (f.name.split(".").pop() || "").toLowerCase();
    if (isSheet) return okExt.includes(ext) || /sheet|excel|csv/.test(f.type || "");
    return (f.type || "").startsWith("image/") || okExt.includes(ext);
  };
  const addFiles = (fl) => { const ok = Array.from(fl || []).filter(isOk); if (ok.length) setFiles(prev => [...prev, ...ok]); };
  const removeFile = (i) => setFiles(prev => prev.filter((_, idx) => idx !== i));

  const effectiveName = (mode === "new" ? name.trim() : mode);
  const canSubmit = effectiveName.length > 0 && files.length > 0;
  const chip = { background:"#16162a", border:"1px solid #334155", color:"#e2e8f0", borderRadius:8 };
  const tabStyle = (active) => ({
    padding:"8px 10px", borderRadius:8, cursor:"pointer", fontSize:13, fontWeight:700, textAlign:"left",
    border:`1px solid ${active ? "#22d3a0" : "#22324a"}`, background: active ? "#22d3a01a" : "#0a0a14",
    color: active ? "#22d3a0" : "#cbd5e1", width:"100%", marginBottom:6,
  });

  return (

// ---------- 인앱 이미지 미리보기 (캐러셀 슬라이드 + 핀치 줌) ----------
function ImageZoomPreview({ items, onConfirm, onCancel }) {
  const [idx, setIdx] = useState(0);
  const [removed, setRemoved] = useState({});
  const [view, setView] = useState({ s: 1, x: 0, y: 0 });
  const [dragX, setDragX] = useState(0);
  const [dragging, setDragging] = useState(false);
  const viewRef = useRef(view); viewRef.current = view;
  const idxRef = useRef(idx); idxRef.current = idx;
  const dragXRef = useRef(dragX); dragXRef.current = dragX;
  const boxRef = useRef(null);
  const g = useRef({ mode: null, d0: 0, s0: 1, x0: 0, y0: 0, sx: 0, sy: 0, lastTap: 0, w: 0 }).current;

  const total = items.length;
  const clamp = (s) => Math.max(1, Math.min(6, s));
  const resetZoom = () => setView({ s: 1, x: 0, y: 0 });
  const goTo = (n) => { const m = Math.max(0, Math.min(total - 1, n)); setIdx(m); resetZoom(); };
  const go = (d) => goTo(idxRef.current + d);
  const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);

  React.useEffect(() => {
    const el = boxRef.current; if (!el) return;
    const onStart = (e) => {
      const t = e.touches;
      if (t.length === 2) { g.mode = "pinch"; g.d0 = dist(t) || 1; g.s0 = viewRef.current.s; }
      else if (t.length === 1) {
        const now = Date.now();
        if (now - g.lastTap < 280) { g.lastTap = 0; g.mode = null; const v = viewRef.current; setView(v.s > 1 ? { s: 1, x: 0, y: 0 } : { s: 2.5, x: 0, y: 0 }); return; }
        g.lastTap = now; g.w = el.offsetWidth || window.innerWidth;
        g.sx = t[0].clientX; g.sy = t[0].clientY;
        if (viewRef.current.s > 1) { g.mode = "pan"; g.x0 = viewRef.current.x; g.y0 = viewRef.current.y; }
        else { g.mode = "swipe"; setDragging(true); }
      }
    };
    const onMove = (e) => {
      const t = e.touches;
      if (g.mode === "pinch" && t.length === 2) { e.preventDefault(); setView(v => { const ns = clamp(g.s0 * (dist(t) / g.d0)); return ns <= 1 ? { s: 1, x: 0, y: 0 } : { ...v, s: ns }; }); }
      else if (g.mode === "pan" && t.length === 1 && viewRef.current.s > 1) { e.preventDefault(); setView(v => ({ ...v, x: g.x0 + (t[0].clientX - g.sx), y: g.y0 + (t[0].clientY - g.sy) })); }
      else if (g.mode === "swipe" && t.length === 1 && total > 1) {
        let dx = t[0].clientX - g.sx; const dy = t[0].clientY - g.sy;
        if (Math.abs(dx) < Math.abs(dy)) return; // 세로 제스처 무시
        e.preventDefault();
        if ((idxRef.current === 0 && dx > 0) || (idxRef.current === total - 1 && dx < 0)) dx *= 0.35; // 양 끝 저항
        setDragX(dx);
      }
    };
    const onEnd = (e) => {
      if (g.mode === "swipe" && e.touches.length === 0) {
        const w = g.w || el.offsetWidth || 320;
        const dx = dragXRef.current;
        const th = Math.max(48, w * 0.2);
        g.mode = null; setDragging(false);
        if (total > 1 && Math.abs(dx) > th) go(dx < 0 ? 1 : -1);
        setDragX(0);
        return;
      }
      if (e.touches.length === 0) { g.mode = null; if (viewRef.current.s <= 1.02 && (viewRef.current.x !== 0 || viewRef.current.y !== 0)) setView({ s: 1, x: 0, y: 0 }); }
      else if (e.touches.length === 1) {
        g.sx = e.touches[0].clientX; g.sy = e.touches[0].clientY;
        if (viewRef.current.s > 1) { g.mode = "pan"; g.x0 = viewRef.current.x; g.y0 = viewRef.current.y; }
        else { g.mode = "swipe"; }
      }
    };
    el.addEventListener("touchstart", onStart, { passive: false });
    el.addEventListener("touchmove", onMove, { passive: false });
    el.addEventListener("touchend", onEnd);
    return () => { el.removeEventListener("touchstart", onStart); el.removeEventListener("touchmove", onMove); el.removeEventListener("touchend", onEnd); };
  }, [total]);

  const zoomBtn = (d) => setView(v => { const ns = clamp(v.s + d); return ns <= 1 ? { s: 1, x: 0, y: 0 } : { ...v, s: ns }; });
  const keptFiles = items.filter((_, i) => !removed[i]).map(it => it.file);
  const curRemoved = !!removed[idx];
  const btn = { background: "#16162a", border: "1px solid #334155", color: "#e2e8f0", borderRadius: 8, padding: "9px 12px", fontSize: 13, fontWeight: 700, cursor: "pointer" };

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 9999, background: "rgba(0,0,0,0.96)", display: "flex", flexDirection: "column" }}>
      {/* 상단 바 */}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 16px", flexShrink: 0, background: "#0a0a14", borderBottom: "1px solid #1e293b" }}>
        <button onClick={onCancel} style={{ background: "none", border: "none", color: "#94a3b8", fontSize: 15, fontWeight: 700, cursor: "pointer" }}>✕ 취소</button>
        <span style={{ color: "#22d3a0", fontSize: 14, fontWeight: 800 }}>📷 InvestIQ 미리보기{total > 1 ? ` ${idx + 1}/${total}` : ""}</span>
        <button onClick={() => { resetZoom(); setDragX(0); }} style={{ background: "none", border: "none", color: "#64748b", fontSize: 13, cursor: "pointer" }}>원래대로</button>
      </div>

      {/* 이미지 트랙(캐러셀) */}
      <div ref={boxRef} style={{ flex: 1, overflow: "hidden", position: "relative", touchAction: "none" }}>
        <div style={{
          display: "flex", height: "100%", width: `${total * 100}%`,
          transform: `translateX(calc(${-idx * (100 / total)}% + ${dragX}px))`,
          transition: dragging ? "none" : "transform 0.3s cubic-bezier(0.22,0.61,0.36,1)",
        }}>
          {items.map((it, i) => (
            <div key={i} style={{ width: `${100 / total}%`, height: "100%", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden" }}>
              <img src={it.url} alt="preview" draggable={false} style={{
                maxWidth: "100%", maxHeight: "100%", objectFit: "contain", userSelect: "none",
                transform: i === idx ? `translate(${view.x}px, ${view.y}px) scale(${view.s})` : "none",
                transition: (i === idx && !g.mode) ? "transform 0.15s" : "none",
                opacity: removed[i] ? 0.3 : 1,
              }} />
            </div>
          ))}
        </div>
        {curRemoved && (
          <div style={{ position: "absolute", top: "50%", left: "50%", transform: "translate(-50%,-50%)", color: "#ef4444", fontSize: 16, fontWeight: 800, background: "#0008", padding: "8px 16px", borderRadius: 10 }}>분석에서 제외됨</div>
        )}
        {total > 1 && idx > 0 && (
          <button onClick={() => go(-1)} style={{ position: "absolute", left: 8, top: "50%", transform: "translateY(-50%)", background: "#000a", border: "1px solid #ffffff22", color: "#fff", width: 48, height: 48, borderRadius: 24, fontSize: 24, cursor: "pointer", lineHeight: 1 }}>‹</button>
        )}
        {total > 1 && idx < total - 1 && (
          <button onClick={() => go(1)} style={{ position: "absolute", right: 8, top: "50%", transform: "translateY(-50%)", background: "#000a", border: "1px solid #ffffff22", color: "#fff", width: 48, height: 48, borderRadius: 24, fontSize: 24, cursor: "pointer", lineHeight: 1 }}>›</button>
        )}
        {/* 하단 점 인디케이터 */}
        {total > 1 && (
          <div style={{ position: "absolute", bottom: 10, left: 0, right: 0, display: "flex", justifyContent: "center", gap: 6 }}>
            {items.map((_, i) => (
              <span key={i} style={{ width: i === idx ? 16 : 6, height: 6, borderRadius: 3, background: i === idx ? "#22d3a0" : "#ffffff44", transition: "all 0.2s" }} />
            ))}
          </div>
        )}
      </div>

      {/* 줌 컨트롤 */}
      <div style={{ display: "flex", justifyContent: "center", alignItems: "center", gap: 10, padding: "8px 0", flexShrink: 0 }}>
        <button onClick={() => zoomBtn(-0.5)} style={{ ...btn, width: 44 }}>−</button>
        <span style={{ color: "#94a3b8", fontSize: 12, minWidth: 48, textAlign: "center" }}>{Math.round(view.s * 100)}%</span>
        <button onClick={() => zoomBtn(0.5)} style={{ ...btn, width: 44 }}>+</button>
        <button onClick={() => setRemoved(r => ({ ...r, [idx]: !r[idx] }))} style={{ ...btn, color: curRemoved ? "#22d3a0" : "#f87171", border: `1px solid ${curRemoved ? "#22d3a0" : "#7f1d1d"}` }}>
          {curRemoved ? "되돌리기" : "이 장 제외"}
        </button>
      </div>

      {/* 하단 액션 */}
      <div style={{ padding: "10px 16px 18px", flexShrink: 0 }}>
        <div style={{ fontSize: 11, color: "#64748b", textAlign: "center", marginBottom: 10 }}>두 손가락 확대 · 더블탭 · 확대 후 한 손가락 이동{total > 1 ? " · 좌우로 휙 넘기기" : ""}</div>
        <button onClick={() => keptFiles.length && onConfirm(keptFiles)} disabled={keptFiles.length === 0}
          style={{ width: "100%", background: keptFiles.length ? "#22d3a0" : "#16162a", color: keptFiles.length ? "#0a0a14" : "#475569", border: "none", borderRadius: 12, padding: "14px", fontSize: 15, fontWeight: 800, cursor: keptFiles.length ? "pointer" : "default" }}>
          {keptFiles.length ? `📊 ${keptFiles.length}장 분석 시작` : "분석할 이미지 없음"}
        </button>
      </div>
    </div>
  );
}
