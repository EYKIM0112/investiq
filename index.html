function IndexWidget() {
  const CACHE_KEY = "investiq_index_widget_v10";
  const BTC_CACHE_KEY = "investiq_btc_widget_v10";

  const loadCache = () => {
    try { return JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); } catch { return null; }
  };
  const loadBtcCache = () => {
    try { return JSON.parse(localStorage.getItem(BTC_CACHE_KEY) || "null"); } catch { return null; }
  };

  const [indices, setIndices] = useState(() => {
    try {
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
      // 캐시 유효성 검사: change가 100 이상이면 이전 포인트값 캐시 → 무효화
      if (cached && cached.some(idx => parseFloat(idx.change) > 50)) {
        localStorage.removeItem(CACHE_KEY);
        return null;
      }
      return cached;
    } catch { return null; }
  });
  const [btc, setBtc] = useState(loadBtcCache);
  const [loading, setLoading] = useState(false);

  const fetchIndices = async () => {
    setLoading(true);
    try {
      // BTC: CoinGecko
      const btcRes = await fetch("https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=14&interval=daily");
      if (btcRes.ok) {
        const btcData = await btcRes.json();
        const prices = btcData.prices?.map(p => p[1]) || [];
        const current = prices[prices.length - 1] || 0;
        const prev    = prices[prices.length - 2] || current;
        const weekAgo = prices.length >= 8 ? prices[prices.length - 8] : null;
        const change     = prev    ? ((current - prev)    / prev    * 100) : 0;
        const weekChange = weekAgo ? ((current - weekAgo) / weekAgo * 100) : null;
        const btcResult = {
          name: "BTC", price: `$${Math.round(current).toLocaleString()}`,
          change: String(Math.abs(change).toFixed(2)), up: change >= 0,
          weekChange: weekChange !== null ? weekChange.toFixed(2) : null,
          weekUp: weekChange !== null ? weekChange >= 0 : null,
        };
        setBtc(btcResult);
        localStorage.setItem(BTC_CACHE_KEY, JSON.stringify(btcResult));
      }

      // 주요 지수: Gemini API로 조회 (CORS 문제 없음)
      const apiKey = getApiKey();
      if (apiKey) {
        try {
          const today = new Date().toLocaleDateString("ko-KR");
          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${apiKey}`;
          const body = {
            contents: [{ role: "user", parts: [{ text: `오늘(${today}) 기준 다음 6개 지수/자산의 현재값과 전일대비 등락률, 1주일 전 대비 등락률을 JSON으로만 반환. 마크다운 없이. 숫자만.
{"indices":[
  {"name":"코스피","value":"7265.30","change":"-0.34","weekChange":"+1.23"},
  {"name":"코스닥","value":"654.20","change":"+0.12","weekChange":"-0.45"}
]}
대상: 코스피, 코스닥, 다우, 나스닥, S&P500, 금(Gold)
- change: 전일대비 등락률 (부호 포함, % 제외)
- weekChange: 1주일 전 대비 등락률 (부호 포함, % 제외)` }] }],
            tools: [{ googleSearch: {} }],
            generationConfig: { maxOutputTokens: 500, temperature: 0, thinkingConfig: { thinkingBudget: 0 } },
          };
          const res = await fetch(url, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
          if (res.ok) {
            const data = await res.json();
            const text = data.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("") || "";
            const match = text.replace(/```json|```/g,"").trim().match(/\{[\s\S]*\}/);
            if (match) {
              const parsed = JSON.parse(match[0]);
              const finalResults = (parsed.indices || []).map(idx => {
                const changeNum = parseFloat(idx.change) || 0;
                const weekNum = parseFloat(idx.weekChange);
                return {
                  name: idx.name,
                  value: String(idx.value || ""),
                  change: String(Math.abs(changeNum).toFixed(2)),
                  up: changeNum >= 0,
                  weekChange: !isNaN(weekNum) ? weekNum.toFixed(2) : null,
                  weekUp: !isNaN(weekNum) ? weekNum >= 0 : null,
                };
              });
              if (finalResults.length > 0) {
                setIndices(finalResults);
                localStorage.setItem(CACHE_KEY, JSON.stringify(finalResults));
              }
            }
          }
        } catch(e) { console.warn("Gemini 지수 조회 실패:", e.message); }
      }
    } catch (e) { console.error("위젯 오류:", e); }
    setLoading(false);
  };
  // 전체새로고침 이벤트 수신
  React.useEffect(() => {
    const handler = () => fetchIndices();
    window.addEventListener("globalRefresh", handler);
    return () => window.removeEventListener("globalRefresh", handler);
  }, []);

  const allItems = [
    ...(indices || []),
    ...(btc ? [btc] : []),
  ];

  if (!allItems.length && !loading) return null;

  return (
    <div style={{ overflowX: "auto", WebkitOverflowScrolling: "touch", marginBottom: 0 }}>
      <div style={{ display: "flex", gap: 8, padding: "10px 14px 8px", minWidth: "max-content" }}>
        {loading && !allItems.length && (
          <div style={{ color: "#2a2a48", fontSize: 12, padding: "10px 0", display:"flex", alignItems:"center", gap:6 }}><Spinner size={12}/> 지수 로딩 중...</div>
        )}
        {allItems.map((idx, i) => {
          const rawChange = String(idx.change || "0").replace(/[+\-%]/g, "").trim();
          const changeNum = parseFloat(rawChange) || 0;
          const isValidChange = !isNaN(changeNum) && rawChange !== "" && rawChange !== "데이터";
          const isUp = idx.up ?? changeNum >= 0;
          const color = isValidChange ? (isUp ? "#22d3a0" : "#f87171") : "#2a2a48";
          const arrow = isUp ? "▲" : "▼";
          const changeStr = isValidChange ? `${arrow} ${Math.abs(changeNum).toFixed(2)}%` : "—";
          const weekNum = idx.weekChange !== null && idx.weekChange !== undefined ? parseFloat(idx.weekChange) : null;
          const weekStr = weekNum !== null && !isNaN(weekNum) ? `${weekNum >= 0 ? "▲" : "▼"} ${Math.abs(weekNum).toFixed(2)}%` : null;
          const weekColor = weekNum !== null ? (weekNum >= 0 ? "#22d3a0" : "#f87171") : "#2a2a48";
          return (
            <div key={i} style={{
              background: "#0f0f18",
              border: "1px solid #16162a",
              borderRadius: 12,
              padding: "11px 13px",
              minWidth: 105, flexShrink: 0,
            }}>
              <div style={{ fontSize: 10, color: "#2a2a48", fontWeight: 600, marginBottom: 5, letterSpacing: 0.8 }}>{idx.name}</div>
              <div style={{ fontSize: 14, fontWeight: 800, color: "#e2e8f0", marginBottom: 4, letterSpacing: -0.3 }}>{idx.value || idx.price}</div>
              <div style={{ fontSize: 11, fontWeight: 700, color }}>{changeStr}</div>
              {weekStr && (
                <div style={{ fontSize: 10, color: weekColor, marginTop: 3, opacity: 0.75 }}>주간 {weekStr}</div>
              )}
            </div>
          );
        })}
      </div>
      <div style={{ height: 1, background: "#0f0f18" }} />
    </div>
  );
}

      <IndexWidget />

        <div style={{ display: tab === "portfolio" ? "block" : "none" }}><Portfolio /></div>
        <div style={{ display: tab === "advisor"   ? "block" : "none" }}><Advisor /></div>

}
