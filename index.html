const STORAGE_KEY = "portfolio_v1";
const GEMINI_MODEL = "gemini-2.5-flash";

const SECTOR_COLORS = {
  "기술": "#00d4ff", "반도체": "#7c3aed", "AI": "#f59e0b",
  "에너지": "#10b981", "금융": "#3b82f6", "헬스케어": "#ec4899",
  "소비재": "#f97316", "부동산": "#84cc16", "방산": "#ef4444",
  "기타": "#6b7280",
};

function getSectorColor(sector) {
  for (const [key, color] of Object.entries(SECTOR_COLORS)) {
    if (sector?.includes(key)) return color;
  }
  return SECTOR_COLORS["기타"];
}

// ── API ──────────────────────────────────────────────────────────────────────
function getApiKey() {
  return localStorage.getItem("investiq_api_key") || "";
}

// ── Gemini API 공통 호출 ──────────────────────────────────────────────────────
async function callGemini({ system, user, maxTokens = 2000, useSearch = false }) {
  const apiKey = getApiKey();
  if (!apiKey) throw new Error("API 키가 설정되지 않았습니다. 설정 탭에서 Gemini API 키를 입력해주세요.");

  const contents = [];
  if (system) contents.push({ role: "user", parts: [{ text: `[시스템 지시]
${system}

[사용자 질문]
${user}` }] });
  else contents.push({ role: "user", parts: [{ text: user }] });

  const body = {
    contents,
    generationConfig: { maxOutputTokens: maxTokens, temperature: 0.7 },
  };

  if (useSearch) {
    body.tools = [{ googleSearch: {} }];
  }

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("") || "";
}

async function callGeminiWithImage({ system, user, imageBase64, mediaType, maxTokens = 2000 }) {
  const apiKey = getApiKey();
  if (!apiKey) throw new Error("API 키가 설정되지 않았습니다. 설정 탭에서 Gemini API 키를 입력해주세요.");

  const parts = [];
  if (system) parts.push({ text: `[시스템 지시]
${system}

` });
  parts.push({ inlineData: { mimeType: mediaType, data: imageBase64 } });
  parts.push({ text: user });

  const body = {
    contents: [{ role: "user", parts }],
    generationConfig: { maxOutputTokens: maxTokens, temperature: 0.3 },
  };

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("") || "";
}

// 기존 함수명 호환성 유지 (내부에서 Gemini 호출)
async function callClaude({ system, user, maxTokens = 1000 }) {
  return callGemini({ system, user, maxTokens, useSearch: false });
}
async function callClaudeWithSearch({ system, user, maxTokens = 2000 }) {
  return callGemini({ system, user, maxTokens, useSearch: true });
}
async function callClaudeWithImage({ system, user, imageBase64, mediaType, maxTokens = 1500 }) {
  return callGeminiWithImage({ system, user, imageBase64, mediaType, maxTokens });
}

}
function savePortfolio(p) {
  if (p === null) localStorage.removeItem(STORAGE_KEY);
  else localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}

function MarketInsight({ onRefreshAll }) {
  const [activeTab, setActiveTab] = useState("summary");
  const [results, setResults]     = useState({});
  const [loading, setLoading]     = useState(null);
  const [errors, setErrors]       = useState({});
  const [updatedAt, setUpdatedAt] = useState({});

  const fetchTab = async (tabId) => {
    setLoading(tabId);
    setErrors(e => ({ ...e, [tabId]: "" }));
    try {
      const today = new Date().toLocaleDateString("ko-KR");
      const text = await callClaudeWithSearch({
        maxTokens: 4000,
        system: `You are a global investment analyst. CRITICAL RULES:
1. Search the web for ONLY the latest 2-3 days of news and market data
2. Your ENTIRE response must be ONLY the JSON object
3. Start your response with { and end with }
4. Do NOT include any text before or after the JSON
5. Do NOT use markdown code blocks
6. Do NOT add citations like [1] or [cite:...]
7. Keep each string value under 50 characters`,
        user: MARKET_PROMPTS[tabId](today),
      });
      let parsed;
      try {
        // 1. 마크다운, cite 태그, 불필요한 텍스트 제거
        let clean = text
          .replace(/```json\s*/gi, "")
          .replace(/```\s*/g, "")
          .replace(/\[cite[^\]]*\]/g, "")
          .replace(/\[source[^\]]*\]/g, "")
          .trim();

        // 2. JSON 블록 추출 - 첫 { 부터 마지막 } 까지
        const firstBrace = clean.indexOf("{");
        const lastBrace = clean.lastIndexOf("}");
        if (firstBrace === -1 || lastBrace === -1) throw new Error("No JSON");
        clean = clean.slice(firstBrace, lastBrace + 1);

        // 3. 직접 파싱
        try { parsed = JSON.parse(clean); }
        catch {
          // 4. 잘린 JSON 복구
          const suffixes = ["}", "]}", "}]}", "}]}}"];
          for (const s of suffixes) { try { parsed = JSON.parse(clean + s); break; } catch {} }
          // 5. 마지막 쉼표 이후 제거 후 복구
          if (!parsed) {
            const lc = clean.lastIndexOf(",");
            if (lc > 0) {
              const t2 = clean.slice(0, lc);
              for (const s of suffixes) { try { parsed = JSON.parse(t2 + s); break; } catch {} }
            }
          }
          if (!parsed) parsed = { summary: clean.slice(0, 800), _raw: true };
        }
      } catch { parsed = { summary: text.slice(0, 800), _raw: true }; }
      setResults(r => ({ ...r, [tabId]: parsed }));
      setUpdatedAt(u => ({ ...u, [tabId]: new Date() }));
    } catch(e) {
      setErrors(er => ({ ...er, [tabId]: "분석 실패: "+e.message }));
    }
    setLoading(null);
  };

// ── 차트 (순수 SVG) ──────────────────────────────────────────────────────────
const PIE_COLORS = ["#0ea5e9","#7c3aed","#f59e0b","#10b981","#ef4444","#ec4899","#f97316","#06b6d4","#84cc16","#6b7280","#a78bfa","#34d399","#fb923c","#fbbf24"];

function guessRegion(name) {
  if (!name) return "기타";
  const n = name.toUpperCase();
  if (n.includes("미국")||n.includes("S&P")||n.includes("나스닥")||n.includes("빅테크")||n.includes("우주테크")||n.includes("배당다우")||n.includes("테크TOP")||n.includes("서학개미")) return "🇺🇸 미국";
  if (n.includes("차이나")||n.includes("중국")) return "🇨🇳 중국";
  if (n.includes("인도")||n.includes("빌리언")) return "🇮🇳 인도";
  if (n.includes("글로벌")||n.includes("TOP4")||n.includes("원자력")||n.includes("K방산")||n.includes("조선")) return "🌍 글로벌";
  return "🇰🇷 한국";
}

function getSectorLabel(sector, name) {
  const n = (name||"").toUpperCase();
  if (n.includes("AI")||n.includes("인공지능")||n.includes("로보")) return "AI·로보틱스";
  if (n.includes("반도체")) return "반도체";
  if (n.includes("빅테크")||n.includes("테크TOP")) return "미국빅테크";
  if (n.includes("S&P")||n.includes("나스닥")) return "미국지수";
  if (n.includes("전력")||n.includes("인프라")) return "전력인프라";
  if (n.includes("원자력")) return "원자력";
  if (n.includes("방산")||n.includes("조선")) return "방산·조선";
  if (n.includes("2차전지")) return "2차전지";
  if (n.includes("금현물")||n.includes("구리실물")) return "금·원자재";
  if (n.includes("채권")||n.includes("배당")) return "배당·채권";
  if (n.includes("차이나")||n.includes("인도빌리언")) return "신흥국";
  if (n.includes("코스닥")||n.includes("코스피")||n.includes("밸류업")||n.includes("증권")) return "국내지수";
  if (sector && sector !== "기타") return sector;
  return "기타";
}

function SvgPieChart({ data, colors }) {
  const [hov, setHov] = useState(null);
  const cx=110, cy=100, r=78, ri=44, W=220, H=200;
  const total = data.reduce((s,d)=>s+d.value,0);
  if (!total) return null;
  let angle = -Math.PI/2;
  const slices = data.map((d,i)=>{
    const pct = d.value/total;
    const a0=angle, a1=angle+pct*2*Math.PI;
    angle=a1;
    const x1=cx+r*Math.cos(a0),y1=cy+r*Math.sin(a0);
    const x2=cx+r*Math.cos(a1),y2=cy+r*Math.sin(a1);
    const ix1=cx+ri*Math.cos(a0),iy1=cy+ri*Math.sin(a0);
    const ix2=cx+ri*Math.cos(a1),iy2=cy+ri*Math.sin(a1);
    const lg=pct>0.5?1:0;
    const path=`M${ix1},${iy1} L${x1},${y1} A${r},${r} 0 ${lg} 1 ${x2},${y2} L${ix2},${iy2} A${ri},${ri} 0 ${lg} 0 ${ix1},${iy1}Z`;
    return {...d,path,color:colors[i%colors.length],pct:(pct*100).toFixed(1)};
  });
  const h = hov!==null?slices[hov]:null;
  return (
    <svg width={W} height={H} style={{display:"block",margin:"0 auto"}}>
      {slices.map((s,i)=>(
        <path key={i} d={s.path} fill={s.color} opacity={hov===null||hov===i?1:0.45}
          onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)}
          style={{cursor:"pointer",transition:"opacity 0.15s"}}/>
      ))}
      {h&&<>
        <text x={cx} y={cy-8} textAnchor="middle" fill="#e2e8f0" fontSize="11" fontWeight="700">{h.name.slice(0,9)}</text>
        <text x={cx} y={cy+10} textAnchor="middle" fill={h.color} fontSize="15" fontWeight="800">{h.pct}%</text>
      </>}
      {!h&&<>
        <text x={cx} y={cy-4} textAnchor="middle" fill="#64748b" fontSize="11">터치하면</text>
        <text x={cx} y={cy+12} textAnchor="middle" fill="#64748b" fontSize="11">상세 표시</text>
      </>}
    </svg>
  );
}

function PortfolioPieCharts({ portfolio }) {
  if (!portfolio) return null;
  const totalValue = portfolio.holdings.reduce((s,h)=>s+(h.shares||0)*(h.current_price||h.avg_price||0),0);
  const cash = portfolio.cash||0;
  const grand = totalValue+cash;

  const sectorMap={}, regionMap={};
  portfolio.holdings.forEach(h=>{
    const sv=(h.shares||0)*(h.current_price||h.avg_price||0);
    const sk=getSectorLabel(h.sector,h.name);
    sectorMap[sk]=(sectorMap[sk]||0)+sv;
    const rk=guessRegion(h.name);
    regionMap[rk]=(regionMap[rk]||0)+sv;
  });
  if(cash>0){sectorMap["💵 현금"]=cash; regionMap["💵 현금"]=cash;}

  const toArr=(m)=>Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([name,value])=>({name,value:Math.round(value)}));
  const sectorData=toArr(sectorMap), regionData=toArr(regionMap);

  return (
    <>
      <div style={{background:"#0f172a",border:"1px solid #1e293b",borderRadius:12,padding:16,marginBottom:14}}>
        <div style={{fontSize:13,color:"#f59e0b",fontWeight:700,marginBottom:14,letterSpacing:2}}>섹터별 구성</div>

        <div style={{fontSize:13,color:"#0ea5e9",fontWeight:700,marginBottom:14,letterSpacing:2}}>지역별 구성</div>
        <SvgPieChart data={regionData} colors={PIE_COLORS}/>
        <PieLegend data={regionData} colors={PIE_COLORS} grand={grand}/>
      </div>
    </>
  );
}

function addHistoryPoint(portfolio) {
  try {
    const history = JSON.parse(localStorage.getItem("portfolio_history_v1")||"[]");
    const tc=portfolio.holdings.reduce((s,h)=>s+(h.shares||0)*(h.avg_price||0),0);
    const tv=portfolio.holdings.reduce((s,h)=>s+(h.shares||0)*(h.current_price||h.avg_price||0),0);
    const ret=tc>0?((tv-tc)/tc*100):0;
    const now=new Date();
    const point={date:now.toISOString().slice(0,10),timestamp:now.getTime(),total_value:Math.round(tv),total_cost:Math.round(tc),return_pct:parseFloat(ret.toFixed(2))};
    const filtered=history.filter(h=>h.date!==point.date);
    localStorage.setItem("portfolio_history_v1",JSON.stringify([...filtered,point].sort((a,b)=>a.timestamp-b.timestamp).slice(-365)));
  } catch(e) { console.error(e); }
}

function ReturnHistoryChart({ portfolio }) {
  const [period, setPeriod] = useState(localStorage.getItem("history_period")||"daily");
  if (!portfolio) return null;

  const rawHistory = (() => { try { return JSON.parse(localStorage.getItem("portfolio_history_v1")||"[]"); } catch { return []; } })();
  const grouped={};
  rawHistory.forEach(h=>{
    const d=new Date(h.timestamp);
    let key;
    if(period==="daily") key=h.date;
    else if(period==="weekly") key=`${d.getFullYear()}-W${Math.ceil((d.getDate())/7)}`;
    else if(period==="monthly") key=h.date.slice(0,7);
    else key=h.date.slice(0,4);
    if(!grouped[key]||h.timestamp>grouped[key].timestamp) grouped[key]=h;
  });
  const history=Object.values(grouped).sort((a,b)=>a.timestamp-b.timestamp);

  const tc=portfolio.holdings.reduce((s,h)=>s+(h.shares||0)*(h.avg_price||0),0);
  const tv=portfolio.holdings.reduce((s,h)=>s+(h.shares||0)*(h.current_price||h.avg_price||0),0);
  const curRet=tc>0?((tv-tc)/tc*100).toFixed(2):0;

  const periods=[{id:"daily",label:"일별"},{id:"weekly",label:"주별"},{id:"monthly",label:"월별"},{id:"yearly",label:"연별"}];

  const maxAbs = history.length ? Math.max(...history.map(h=>Math.abs(h.return_pct)),1) : 1;
  const BAR_H = 100;

  return (
    <div style={{background:"#0f172a",border:"1px solid #1e293b",borderRadius:12,padding:16,marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div style={{fontSize:13,color:"#7c3aed",fontWeight:700,letterSpacing:2}}>수익률 히스토리</div>
        <div style={{display:"flex",gap:4}}>
          {periods.map(p=>(
            <button key={p.id} onClick={()=>{setPeriod(p.id);localStorage.setItem("history_period",p.id);}} style={{
              padding:"4px 8px",borderRadius:10,border:`1px solid ${period===p.id?"#7c3aed":"#334155"}`,
              background:period===p.id?"#7c3aed22":"transparent",
              color:period===p.id?"#a78bfa":"#64748b",fontSize:11,cursor:"pointer",fontWeight:period===p.id?700:400,
            }}>{p.label}</button>
          ))}
        </div>
      </div>

      {history.length===0?(
        <div style={{textAlign:"center",padding:"24px 0",color:"#475569",fontSize:13}}>
          ↻ 가격 새로고침 후 히스토리가 쌓입니다
        </div>
      ):(
        <div>
          <div style={{display:"flex",alignItems:"flex-end",gap:4,height:BAR_H+30,overflowX:"auto",paddingBottom:4}}>
            {history.map((h,i)=>{
              const barH=Math.max(4,Math.abs(h.return_pct)/maxAbs*BAR_H);
              const isPos=h.return_pct>=0;
              const isCur=i===history.length-1;
              return(
                <div key={i} style={{display:"flex",flexDirection:"column",alignItems:"center",minWidth:36,flexShrink:0}}>
                  <div style={{fontSize:10,color:isPos?"#10b981":"#ef4444",fontWeight:700,marginBottom:2}}>
                    {h.return_pct>=0?"+":""}{h.return_pct}%
                  </div>
                  <div style={{
                    width:28,height:barH,borderRadius:"4px 4px 0 0",
                    background:isCur?(isPos?"#0ea5e9":"#ef4444"):(isPos?"#10b981":"#ef4444"),
                    opacity:isCur?1:0.6,
                    border:isCur?"2px solid #fff":"none",
                  }}/>
                  <div style={{fontSize:9,color:"#475569",marginTop:3,textAlign:"center",lineHeight:1.2}}>
                    {period==="daily"?h.date.slice(5):period==="monthly"?h.date.slice(0,7):h.date.slice(0,period==="yearly"?4:7)}
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{textAlign:"center",marginTop:8,fontSize:13,color:"#64748b"}}>
            현재 수익률: <span style={{color:parseFloat(curRet)>=0?"#10b981":"#ef4444",fontWeight:700}}>{parseFloat(curRet)>=0?"+":""}{curRet}%</span>
            <span style={{fontSize:11,color:"#334155",marginLeft:8}}>(파란 막대 = 현재)</span>
          </div>
        </div>
      )}
    </div>
  );
}

    if (mode === "edit") {
      onSave({ ...holding, shares: parseFloat(shares)||0, avg_price: parseFloat(String(avgPrice).replace(/,/g,""))||0 });
    } else if (mode === "buy") {
      const addSh = parseFloat(addShares)||0;
      const addPr = parseFloat(String(addPrice).replace(/,/g,""))||0;
      const newShares = (holding.shares||0) + addSh;
      const newAvg = newShares>0 ? Math.round(((holding.shares||0)*(holding.avg_price||0)+addSh*addPr)/newShares) : (holding.avg_price||0);

              background: sector === s ? getSectorColor(s) + "22" : "transparent",
              color: sector === s ? getSectorColor(s) : "#94a3b8", fontSize: 13, cursor: "pointer",
            }}>{s}</button>
          ))}
        </div>

        <button onClick={handleAdd} style={{
          width: "100%", padding: "14px", borderRadius: 10,
          background: "linear-gradient(135deg,#0ea5e9,#7c3aed)",
          color: "#fff", border: "none", fontWeight: 700, fontSize: 17, cursor: "pointer",
        }}>+ 종목 추가</button>
      </div>
    </div>
  );
}

// ── 포트폴리오 탭 ─────────────────────────────────────────────────────────────
function Portfolio() {
  const [portfolio, setPortfolio] = useState(loadPortfolio);
  const [uploading, setUploading]   = useState(false);
  const [uploadMsg, setUploadMsg]   = useState("");
  const [updating, setUpdating]     = useState(false);
  const [dragOver, setDragOver]     = useState(false);
  const [showManual, setShowManual] = useState(false);
  const [showAddPanel, setShowAddPanel] = useState(false);
  const [editTarget, setEditTarget] = useState(null); // {holding, index}

  // 이미지 → Claude Vision
  const analyzeImage = async (file) => {
    setUploadMsg("AI가 계좌 이미지 분석 중...");
    const base64 = await new Promise((res, rej) => {
      const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.onerror = rej; r.readAsDataURL(file);
    });
    const text = await callClaudeWithImage({
      maxTokens: 2000,
      system: `주식 계좌 스크린샷에서 종목 정보를 추출하여 순수 JSON만 반환. 마크다운 없이.
{"holdings":[{"ticker":"코드","name":"종목명","shares":수량,"avg_price":평균단가,"currency":"KRW또는USD","sector":"섹터"}],"account_type":"국내/해외/혼합","broker":"증권사"}`,
      imageBase64: base64, mediaType: file.type,
      user: "이 계좌 스크린샷에서 모든 보유 종목(코드, 종목명, 수량, 평균단가)을 추출해줘. JSON만.",
    });
    return JSON.parse(text.replace(/```json|```/g, "").trim());
  };

  // 주문체결/실현손익 캡처 분석
  const analyzeOrderCapture = async (file) => {
    setUploadMsg("주문체결 내역 분석 중...");
    const base64 = await new Promise((res,rej) => {
      const r = new FileReader(); r.onload = ()=>res(r.result.split(",")[1]); r.onerror=rej; r.readAsDataURL(file);
    });
    const text = await callGeminiWithImage({
      maxTokens:2000,
      system:`주문체결 또는 실현손익 캡처에서 거래 내역을 추출해 순수 JSON만 반환.
{"trades":[{"name":"종목명","ticker":"코드","type":"buy/sell","shares":수량,"price":단가,"date":"날짜"}]}`,
      imageBase64:base64, mediaType:file.type,
      user:"이 주문체결/실현손익 화면에서 모든 거래 내역(종목명, 수량, 단가, 매수/매도)을 추출해줘. JSON만.",
    });
    const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
    return parsed.trades || [];
  };

  // 주문체결 캡처로 포폴 업데이트
  const processOrderCapture = async (file) => {
    setUploading(true);
    setUploadMsg("주문체결 분석 중...");
    try {
      const trades = await analyzeOrderCapture(file);
      if (!trades.length) { alert("거래 내역을 찾을 수 없어요."); setUploading(false); return; }
      
      let holdings = [...(portfolio?.holdings||[])];
      trades.forEach(trade => {
        const idx = holdings.findIndex(h => h.ticker===trade.ticker || h.name===trade.name);
        if (trade.type === "buy") {
          if (idx >= 0) {
            // 기존 종목 추가매수 → 평단 재계산
            const h = holdings[idx];
            const newShares = (h.shares||0) + trade.shares;
            const newAvg = newShares>0 ? Math.round(((h.shares||0)*(h.avg_price||0)+trade.shares*trade.price)/newShares) : trade.price;
            holdings[idx] = { ...h, shares:newShares, avg_price:newAvg };
          } else {
            holdings.push({ name:trade.name, ticker:trade.ticker||trade.name, shares:trade.shares, avg_price:trade.price, currency:"KRW", sector:"기타", current_price:null });
          }
        } else if (trade.type === "sell") {
          if (idx >= 0) {
            const remaining = (holdings[idx].shares||0) - trade.shares;
            if (remaining <= 0) holdings.splice(idx, 1);
            else holdings[idx] = { ...holdings[idx], shares:remaining };
          }
        }
      });

      const updated = { ...(portfolio||{holdings:[],uploadedAt:new Date().toISOString()}), holdings, updatedAt:new Date().toISOString() };
      savePortfolio(updated); setPortfolio(updated);
      alert(`${trades.length}건 거래 반영 완료!`);
    } catch(e) { alert("분석 실패: "+e.message); }
    setUploading(false); setUploadMsg("");
  };

  // 엑셀/CSV → Claude
  const analyzeSpreadsheet = async (file) => {
    setUploadMsg("스프레드시트 파싱 중...");
    let textContent = "";
    if (file.name.endsWith(".csv")) {
      textContent = await file.text();
    } else {
      const ab = await file.arrayBuffer();
      const bytes = new Uint8Array(ab);
      let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
      const b64 = btoa(bin);
      textContent = await callClaude({
        maxTokens: 2000,
        system: "엑셀 파일 파서. base64 xlsx를 CSV 텍스트로만 변환 반환.",
        user: `이 base64 xlsx를 CSV로 변환:\n${b64.slice(0, 8000)}`,
      });
    }
    setUploadMsg("종목 데이터 인식 중...");
    const text = await callClaude({
      maxTokens: 2000,
      system: `포트폴리오 CSV/텍스트에서 종목 추출 후 순수 JSON만.
{"holdings":[{"ticker":"코드","name":"종목명","shares":수량,"avg_price":평균단가,"currency":"KRW","sector":"섹터"}],"account_type":"","broker":""}`,
      user: `종목 정보 추출:\n\n${textContent.slice(0, 6000)}`,
    });
    return JSON.parse(text.replace(/```json|```/g, "").trim());
  };

  // 공통 파일 처리
  const processFile = async (file, addToExisting = false) => {
    if (!file) return;
    setUploading(true);
    setUploadMsg("파일 확인 중...");
    try {
      const ext = file.name.split(".").pop().toLowerCase();
      let parsed;
      if (["jpg","jpeg","png","webp","gif","heic"].includes(ext) || file.type.startsWith("image/")) {
        parsed = await analyzeImage(file);
      } else if (["xlsx","xls","csv"].includes(ext)) {
        parsed = await analyzeSpreadsheet(file);
      } else {
        throw new Error("이미지, xlsx, csv 파일만 지원합니다.");
      }
      const newHoldings = parsed.holdings.map(h => ({ ...h, current_price: null }));
      const base = addToExisting && portfolio ? portfolio : { ...parsed, uploadedAt: new Date().toISOString() };
      const updated = {
        ...base,
        updatedAt: new Date().toISOString(),
        holdings: addToExisting && portfolio ? [...portfolio.holdings, ...newHoldings] : newHoldings,
      };
      savePortfolio(updated);
      setPortfolio(updated);
      setShowAddPanel(false);
    } catch (e) { alert("분석 실패: " + e.message); }
    setUploading(false);
    setUploadMsg("");
  };

  // 파일 change 핸들러
  const onFileChange = (e, addToExisting) => {
    const f = e.target.files?.[0];
    e.target.value = "";          // 같은 파일 재선택 허용
    if (f) processFile(f, addToExisting);
  };

  // 직접 입력 추가
  const addManualHolding = (h) => {
    const updated = portfolio
      ? { ...portfolio, holdings: [...portfolio.holdings, h], updatedAt: new Date().toISOString() }
      : { holdings: [h], account_type: "혼합", broker: h.account || "", uploadedAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
    savePortfolio(updated);
    setPortfolio(updated);
  };

  // 종목 삭제
  const removeHolding = (idx) => {
    const updated = { ...portfolio, holdings: portfolio.holdings.filter((_, i) => i !== idx) };
    savePortfolio(updated);
    setPortfolio(updated);
  };

  // 종목 수정/삭제
  const updateHolding = (idx, updated) => {
    let newHoldings;
    if (updated === null) {
      newHoldings = portfolio.holdings.filter((_, i) => i !== idx);
    } else {
      newHoldings = portfolio.holdings.map((h, i) => i === idx ? updated : h);
    }
    const p = { ...portfolio, holdings: newHoldings, updatedAt: new Date().toISOString() };
    savePortfolio(p);
    setPortfolio(p);
  };

  // 현재가 업데이트
  const updatePrices = async () => {
    if (!portfolio) return;
    setUpdating(true);
    try {
      const tickers = portfolio.holdings.map(h => `${h.ticker || h.name}(${h.currency || "KRW"})`).join(", ");
      const text = await callClaudeWithSearch({
        maxTokens: 1500,
        system: `주식 현재가 검색 후 JSON만. {"prices":[{"ticker":"","current_price":0,"change_pct":0}]}`,
        user: `다음 종목 현재가 검색: ${tickers}. JSON만 반환.`,
      });
      const { prices } = JSON.parse(text.replace(/```json|```/g, "").trim());
      const updated = {
        ...portfolio, updatedAt: new Date().toISOString(),
        holdings: portfolio.holdings.map(h => {
          const p = prices.find(x => x.ticker === h.ticker || x.ticker === h.name);
          return p ? { ...h, current_price: p.current_price, change_pct: p.change_pct } : h;
        }),
      };
      savePortfolio(updated); setPortfolio(updated);
      // 히스토리 포인트 저장
      const period = localStorage.getItem("history_period") || "daily";
      addHistoryPoint(updated, period);
    } catch (e) { alert("가격 업데이트 실패: " + e.message); }
    setUpdating(false);
  };

  const [viewMode, setViewMode] = useState("all"); // "all" | 계좌명

  // 계좌 목록
  const accounts = portfolio ? [...new Set(portfolio.holdings.map(h => h.account).filter(Boolean))] : [];

  // 현재 뷰에 따른 종목 필터
  const visibleHoldings = portfolio
    ? (viewMode === "all" ? portfolio.holdings : portfolio.holdings.filter(h => h.account === viewMode))
    : [];

  const totalCost  = visibleHoldings.reduce((s, h) => s + (h.shares||0)*(h.avg_price||0), 0);
  const totalValue = visibleHoldings.reduce((s, h) => s + (h.shares||0)*(h.current_price||h.avg_price||0), 0);
  const totalReturn = totalCost > 0 ? ((totalValue - totalCost) / totalCost) * 100 : 0;

  // 업로드 패널 — label+input을 항상 DOM에 렌더링 (모바일 sandbox 대응)
  const renderUploadPanel = (addToExisting = false) => {
    const imgId  = addToExisting ? "file-img-add"  : "file-img-new";
    const xlsId  = addToExisting ? "file-xls-add"  : "file-xls-new";
    return (
      <div>
        {/* 숨김 input — label과 id로 연결, 항상 DOM에 존재 */}
        <input
          id={imgId} type="file" accept="image/*"
          style={{ position: "absolute", width: 1, height: 1, opacity: 0, overflow: "hidden" }}
          onChange={e => onFileChange(e, addToExisting)}
        />
        <input
          id={xlsId} type="file" accept=".xlsx,.xls,.csv"
          style={{ position: "absolute", width: 1, height: 1, opacity: 0, overflow: "hidden" }}
          onChange={e => onFileChange(e, addToExisting)}
        />

        {uploading ? (
          <div style={{ textAlign: "center", padding: "36px 20px", background: "#0a0f1a", borderRadius: 14, border: "1px solid #1e293b" }}>
            <Spinner size={34} />
            <div style={{ marginTop: 14, color: "#0ea5e9", fontWeight: 700, fontSize: 16 }}>{uploadMsg}</div>
          </div>
        ) : (
          <div>
            {/* 드래그앤드롭 — PC용 */}
            <div
              onDragOver={e => { e.preventDefault(); setDragOver(true); }}
              onDragLeave={() => setDragOver(false)}
              onDrop={e => { e.preventDefault(); setDragOver(false); processFile(e.dataTransfer.files[0], addToExisting); }}
              style={{
                border: `2px dashed ${dragOver ? "#0ea5e9" : "#1e293b"}`,
                borderRadius: 12, padding: "20px 16px", textAlign: "center",
                background: dragOver ? "#0ea5e911" : "#0a0f1a", marginBottom: 12, transition: "all 0.2s",
              }}
            >
              <div style={{ fontSize: 26, marginBottom: 5 }}>📂</div>
              <div style={{ fontSize: 14, color: "#475569" }}>PC: 파일을 여기로 드래그</div>
              <div style={{ fontSize: 13, color: "#334155", marginTop: 2 }}>이미지 · xlsx · csv</div>
            </div>

            {/* label 버튼 — htmlFor로 input 직접 연결 (모바일에서 가장 확실) */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
              <label
                htmlFor={imgId}
                style={{
                  padding: "14px 8px", borderRadius: 12, cursor: "pointer",
                  background: "linear-gradient(135deg,#0ea5e9,#0369a1)", color: "#fff",
                  fontWeight: 700, fontSize: 15, display: "flex", flexDirection: "column",
                  alignItems: "center", gap: 6, userSelect: "none",
                }}
              >
                <span style={{ fontSize: 24 }}>📱</span>
                <span>갤러리 / 스크린샷</span>
              </label>
              <label
                htmlFor={xlsId}
                style={{
                  padding: "14px 8px", borderRadius: 12, cursor: "pointer",
                  background: "linear-gradient(135deg,#10b981,#059669)", color: "#fff",
                  fontWeight: 700, fontSize: 15, display: "flex", flexDirection: "column",
                  alignItems: "center", gap: 6, userSelect: "none",
                }}
              >
                <span style={{ fontSize: 24 }}>📊</span>
                <span>엑셀 / CSV</span>
              </label>
            </div>

            <button
              onClick={() => { setShowManual(true); setShowAddPanel(false); }}
              style={{
                width: "100%", padding: "13px", borderRadius: 12, cursor: "pointer",
                background: "#1e293b", color: "#e2e8f0", border: "1px solid #334155",
                fontWeight: 700, fontSize: 15, display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
              }}
            >
              ✏️ 직접 입력
            </button>
            {addToExisting && (
              <button onClick={() => setShowAddPanel(false)} style={{ width: "100%", marginTop: 8, padding: "10px", background: "none", border: "none", color: "#64748b", fontSize: 15, cursor: "pointer" }}>
                취소
              </button>
            )}
          </div>
        )}
      </div>
    );
  };

  return (
    <div style={{ padding: "0 4px" }}>
      {editTarget && (
        <EditHoldingModal
          holding={editTarget.holding}
          onClose={() => setEditTarget(null)}
          onSave={(updated) => {
            updateHolding(editTarget.index, updated);
            setEditTarget(null);
          }}
        />
      )}
      {showManual && (
        <ManualInputModal onClose={() => setShowManual(false)} onAdd={h => { addManualHolding(h); setShowManual(false); }} />
      )}

      {/* 포폴 없음 → 초기 등록 */}
      {!portfolio ? (
        <div>
          <div style={{ textAlign: "center", marginBottom: 20 }}>
            <div style={{ fontSize: 40, marginBottom: 8 }}>💼</div>
            <div style={{ fontSize: 16, fontWeight: 700, color: "#e2e8f0", marginBottom: 4 }}>포트폴리오 등록</div>
            <div style={{ fontSize: 14, color: "#64748b" }}>스크린샷, 엑셀, 직접입력 중 편한 방법으로 추가하세요</div>
          </div>
          {renderUploadPanel(false)}
        </div>
      ) : (
        <div>
          {/* 계좌 탭 */}
          <div style={{ display: "flex", gap: 6, marginBottom: 12, overflowX: "auto", paddingBottom: 4 }}>
            <button onClick={() => setViewMode("all")} style={{
              padding: "6px 12px", borderRadius: 20, border: `1px solid ${viewMode === "all" ? "#7c3aed" : "#334155"}`,
              background: viewMode === "all" ? "#7c3aed22" : "transparent",
              color: viewMode === "all" ? "#a78bfa" : "#64748b",
              fontSize: 13, fontWeight: viewMode === "all" ? 700 : 400, cursor: "pointer", whiteSpace: "nowrap", flexShrink: 0,
            }}>전체</button>
            {accounts.map(acc => (
              <button key={acc} onClick={() => setViewMode(acc)} style={{
                padding: "6px 12px", borderRadius: 20, border: `1px solid ${viewMode === acc ? "#0ea5e9" : "#334155"}`,
                background: viewMode === acc ? "#0ea5e922" : "transparent",
                color: viewMode === acc ? "#0ea5e9" : "#64748b",
                fontSize: 13, fontWeight: viewMode === acc ? 700 : 400, cursor: "pointer", whiteSpace: "nowrap", flexShrink: 0,
              }}>{acc}</button>
            ))}
          </div>

          {/* 요약 카드 */}
          <div style={{ background: "linear-gradient(135deg,#0f172a,#1e1b4b)", border: "1px solid #312e81", borderRadius: 16, padding: 18, marginBottom: 14 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14 }}>
              <div>
                <div style={{ fontSize: 12, color: "#7c3aed", fontWeight: 700, letterSpacing: 2, marginBottom: 3 }}>
                  {viewMode === "all" ? "전체 포트폴리오" : viewMode}
                </div>
                <div style={{ fontSize: 13, color: "#475569" }}>{new Date(portfolio.updatedAt).toLocaleString("ko-KR")}</div>
              </div>
              <div style={{ display: "flex", gap: 6 }}>
                <button onClick={updatePrices} disabled={updating} style={{ background: "#1e293b", color: "#e2e8f0", border: "1px solid #334155", borderRadius: 8, padding: "6px 10px", cursor: "pointer", fontSize: 13, fontWeight: 700, display: "flex", alignItems: "center", gap: 4 }}>
                  {updating ? <Spinner size={11} /> : "↻"} 가격
                </button>
                <button onClick={() => {
                  const accs = [...new Set(portfolio.holdings.map(h=>h.account).filter(Boolean))];
                  const target = window.prompt("삭제할 계좌명 입력 (전체삭제: 전체):\n" + accs.join(", "));
                  if (!target) return;
                  if (target === "전체") { savePortfolio(null); setPortfolio(null); }
                  else {
                    const updated = { ...portfolio, holdings: portfolio.holdings.filter(h=>h.account!==target), updatedAt:new Date().toISOString() };
                    savePortfolio(updated); setPortfolio(updated);
                  }
                }} style={{ background: "#1e293b", color: "#ef4444", border: "1px solid #ef444433", borderRadius: 8, padding: "6px 10px", cursor: "pointer", fontSize: 13 }}>🗑️ 삭제</button>
              </div>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>
              {[
                { label: "총 매입", value: totalCost >= 100000000 ? `₩${(totalCost/100000000).toFixed(1)}억` : `₩${Math.round(totalCost/10000)}만`, color: "#94a3b8" },
                { label: "평가금액", value: totalValue >= 100000000 ? `₩${(totalValue/100000000).toFixed(1)}억` : `₩${Math.round(totalValue/10000)}만`, color: "#e2e8f0" },
                { label: "수익률", value: `${totalReturn >= 0 ? "+" : ""}${totalReturn.toFixed(2)}%`, color: totalReturn >= 0 ? "#10b981" : "#ef4444" },
              ].map((m, i) => (
                <div key={i} style={{ textAlign: "center", background: "#0f172a55", borderRadius: 8, padding: "10px 4px" }}>
                  <div style={{ fontSize: 9, color: "#64748b", marginBottom: 3 }}>{m.label}</div>
                  <div style={{ fontSize: 16, fontWeight: 800, color: m.color }}>{m.value}</div>
                </div>
              ))}
            </div>
          </div>

          {/* 종목 추가 버튼 — 상단 배치 */}
          <div style={{marginBottom:14}}>
            <input id="add-img" type="file" accept="image/*"
              style={{position:"absolute",width:1,height:1,opacity:0,overflow:"hidden"}}
              onChange={e=>onFileChange(e,true)}/>
            <input id="add-xls" type="file" accept=".xlsx,.xls,.csv"
              style={{position:"absolute",width:1,height:1,opacity:0,overflow:"hidden"}}
              onChange={e=>onFileChange(e,true)}/>
            <input id="order-img-top" type="file" accept="image/*"
              style={{position:"absolute",width:1,height:1,opacity:0,overflow:"hidden"}}
              onChange={e=>{const f=e.target.files?.[0]; e.target.value=""; if(f) processOrderCapture(f);}}/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:8}}>
              <label htmlFor="add-img" style={{padding:"10px 6px",borderRadius:10,background:"#0ea5e922",border:"1px solid #0ea5e944",color:"#0ea5e9",fontWeight:700,fontSize:13,cursor:"pointer",textAlign:"center",userSelect:"none"}}>📱 스크린샷</label>
              <label htmlFor="add-xls" style={{padding:"10px 6px",borderRadius:10,background:"#10b98122",border:"1px solid #10b98144",color:"#10b981",fontWeight:700,fontSize:13,cursor:"pointer",textAlign:"center",userSelect:"none"}}>📊 엑셀/CSV</label>

// ── AI 조언 탭 ────────────────────────────────────────────────────────────────
function Advisor() {
  const [loading, setLoading]       = useState(false);
  const [question, setQuestion]     = useState("");
  const [chatHistory, setChatHistory] = useState([]);
  const portfolio = loadPortfolio();

  const getAdvice = async (q) => {
    if (!q) return;
    setLoading(true);
    try {
      const portfolioStr = portfolio
        ? portfolio.holdings.map(h => `${h.name}(${h.ticker}) ${h.shares}주 평단${h.avg_price}`).join(", ")
        : "포트폴리오 정보 없음";
      const text = await callClaudeWithSearch({
        maxTokens: 2000,
        system: `당신은 실전 투자 어드바이저입니다. 웹 검색으로 최신 2~3일 시장 정보를 수집한 뒤 답변하세요.

규칙:
- 마크다운(###, **, -) 절대 사용 금지. 일반 텍스트로만 작성
- 핵심만 간결하게. 불필요한 인사말, 설명 없이 바로 본론
- 질문에 딱 맞는 답변만. "포트폴리오 진단" 같은 틀 강요 금지
- 매수/매도 추천 시: 종목명 + 이유 + 관련ETF(시총 3000억↑ 우선) 함께 제시
- ETF 시총 1000억↓는 추천 불가. 1000~3000억이면 "(소규모 주의)" 명시
- 수치 기반 근거 제시 (예: "반도체 ETF 자금 유입 3일 연속 증가")
- 답변 길이: 3~5문장으로 핵심만
⚠️ 참고용. 투자 손실 책임은 투자자 본인.`,
        user: `[포트폴리오] ${portfolioStr}\n\n[질문] ${q}`,
      });
      setChatHistory(prev => [...prev, { role: "user", content: q }, { role: "ai", content: text }]);
      setQuestion("");
    } catch (e) {
      setChatHistory(prev => [...prev, { role: "ai", content: "오류: " + e.message }]);
    }
    setLoading(false);
  };

  const quickActions = ["내 포폴 리밸런싱 방향 조언해줘", "현재 모멘텀 섹터에 내 포폴 노출도가 충분한가?", "지금 추가 매수하기 좋은 종목 추천해줘", "내 포폴의 리스크 분석해줘"];

  return (
    <div style={{ padding: "0 4px" }}>
      {!portfolio && (
        <div style={{ background: "#1a0a0a", border: "1px solid #ef444433", borderRadius: 12, padding: 14, marginBottom: 16, fontSize: 15, color: "#fca5a5" }}>
          ⚠️ 포트폴리오 탭에서 계좌를 등록하면 더 정확한 맞춤 조언을 받을 수 있어요
        </div>
      )}

      <div style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 12, color: "#64748b", marginBottom: 8, fontWeight: 700, letterSpacing: 1 }}>빠른 질문</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
          {quickActions.map((q, i) => (
            <button key={i} onClick={() => getAdvice(q)} disabled={loading} style={{ background: "#1e293b", color: "#94a3b8", border: "1px solid #334155", borderRadius: 20, padding: "6px 14px", cursor: "pointer", fontSize: 14 }}>
              {q}
            </button>
          ))}
        </div>
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        <input
          value={question}
          onChange={e => setQuestion(e.target.value)}
          onKeyDown={e => e.key === "Enter" && !e.shiftKey && getAdvice(question)}
          placeholder="투자 관련 질문을 입력하세요..."
          style={{ flex: 1, background: "#0f172a", border: "1px solid #334155", borderRadius: 10, padding: "11px 14px", color: "#e2e8f0", fontSize: 16, outline: "none" }}
        />
        <button onClick={() => getAdvice(question)} disabled={loading || !question} style={{ background: "#7c3aed", color: "#fff", border: "none", borderRadius: 10, padding: "11px 18px", cursor: "pointer", fontWeight: 700, opacity: loading || !question ? 0.5 : 1 }}>
          {loading ? <Spinner size={16} /> : "전송"}
        </button>
      </div>

      {chatHistory.length === 0 && !loading && (
        <div style={{ textAlign: "center", padding: "50px 20px", color: "#475569" }}>
          <div style={{ fontSize: 44, marginBottom: 12 }}>🤖</div>
          <div style={{ fontSize: 16 }}>AI 투자 어드바이저에게 질문해보세요</div>
          <div style={{ fontSize: 14, marginTop: 6 }}>실시간 웹 검색으로 최신 시장 정보를 반영합니다</div>
        </div>
      )}

      {loading && (
        <div style={{ textAlign: "center", padding: "20px", color: "#64748b", fontSize: 15 }}>
          <Spinner size={22} />
          <div style={{ marginTop: 10 }}>시장 정보 검색 중...</div>
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        {chatHistory.map((msg, i) => (
          <div key={i} style={{
            background: msg.role === "user" ? "#1e293b" : "#0f172a",
            border: `1px solid ${msg.role === "user" ? "#334155" : "#1e293b"}`,
            borderRadius: 12, padding: 16,
            borderLeft: msg.role === "ai" ? "3px solid #7c3aed" : "none",
          }}>
            <div style={{ fontSize: 12, color: msg.role === "user" ? "#64748b" : "#7c3aed", fontWeight: 700, marginBottom: 7, letterSpacing: 1 }}>
              {msg.role === "user" ? "나의 질문" : "AI 어드바이저"}
            </div>
            <div style={{ color: "#cbd5e1", fontSize: 15, lineHeight: 1.8, whiteSpace: "pre-wrap" }}>{msg.content}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

            ⚠️ 이 앱의 투자 정보는 참고용이며, 투자 손실에 대한 책임은 투자자 본인에게 있습니다.
          </div>
        </div>
      </div>
    </div>
  );
}
