// 프록시 호출 헤더 — 로그인 세션 토큰을 동봉(서버에서 검증). 미인증이면 토큰 없이 전송 → 서버가 401.
async function geminiHeaders() {
  const { data } = await supabaseClient.auth.getSession();
  const token = data?.session?.access_token;
  const h = { "Content-Type": "application/json" };
  if (token) h["Authorization"] = "Bearer " + token;
  return h;
}

// ---------- 안전한 JSON 파싱 ----------
function safeParseJSON(text) {
  // 마크다운 코드블록 제거
  let cleaned = text.replace(/```json\s*/gi, "").replace(/```\s*/g, "").trim();
  // JSON 블록 추출 시도 (배열 또는 객체)
  const matchObj = cleaned.match(/\{[\s\S]*\}/);
  const matchArr = cleaned.match(/\[[\s\S]*\]/);
  // 배열만 있는 경우도 처리
  if (!matchObj && matchArr) cleaned = matchArr[0];
  else if (matchObj) cleaned = matchObj[0];
  try {
    return JSON.parse(cleaned);
  } catch (e) {
    // 끊긴 JSON 복구: holdings 배열 말미 불완전 항목 제거 후 재시도
    let fixed = cleaned;
    // 잘린 holdings 배열 복구: 마지막 완전하지 않은 { ... } 블록 제거
    if (fixed.includes('"holdings"') || fixed.includes('"recommendations"')) {
      const holdingsMatch = fixed.match(/"(?:holdings|recommendations)"\s*:\s*\[/);
      if (holdingsMatch) {
        const startIdx = holdingsMatch.index + holdingsMatch[0].length;
        let depth = 1, lastCompleteIdx = startIdx, inStr = false, escape = false;
        for (let i = startIdx; i < fixed.length && depth > 0; i++) {
          const ch = fixed[i];
          if (escape) { escape = false; continue; }
          if (ch === '\\' && inStr) { escape = true; continue; }
          if (ch === '"') { inStr = !inStr; continue; }
          if (inStr) continue;
          if (ch === '{') depth++;
          else if (ch === '}') { depth--; if (depth === 1) lastCompleteIdx = i + 1; }
        }
        // 마지막 완전한 객체까지만 잘라서 배열 닫기
        const truncated = fixed.slice(0, lastCompleteIdx) + "]" + fixed.slice(fixed.indexOf("]", lastCompleteIdx) + 1);
        // 남은 구조 닫기
        const opens2 = (truncated.match(/\[|\{/g) || []).length;
        const closes2 = (truncated.match(/\]|\}/g) || []).length;
        let recovered = truncated;
        for (let i = 0; i < opens2 - closes2; i++) recovered += i % 2 === 0 ? "}" : "]";
        try { return JSON.parse(recovered); } catch(e3) {}
      }
    }
    // 일반 따옴표/괄호 닫기 시도
    const quoteCount = (fixed.match(/(?<!\\)"/g) || []).length;
    if (quoteCount % 2 !== 0) fixed += '"';
    const opens = (fixed.match(/\[|\{/g) || []).length;
    const closes = (fixed.match(/\]|\}/g) || []).length;
    for (let i = 0; i < opens - closes; i++) fixed += i % 2 === 0 ? "]" : "}";
    try {
      return JSON.parse(fixed);
    } catch (e2) {
      throw new Error("JSON 파싱 실패. AI 응답이 올바르지 않습니다.");
    }
  }
}

// ---------- Gemini API 스트리밍 호출 ----------
async function callGeminiStream({ system, user, maxTokens = 2000, useSearch = false, onChunk, _retry = 0 }) {
  const model = useSearch ? GEMINI_MODEL : GEMINI_MODEL_FAST;
  const contents = [];
  if (system) contents.push({ role: "user", parts: [{ text: `[시스템 지시]\n${system}\n\n[사용자 질문]\n${user}` }] });
  else contents.push({ role: "user", parts: [{ text: user }] });

  const body = { contents, generationConfig: { maxOutputTokens: maxTokens, temperature: 0.7, ...(useSearch ? {} : { thinkingConfig: { thinkingBudget: 0 } }) } };
  if (useSearch) body.tools = [{ googleSearch: {} }];

  let res;
  try {
    res = await fetch(GEMINI_PROXY, {
      method: "POST",
      headers: await geminiHeaders(),
      body: JSON.stringify({ model, body, stream: true }),
    });
  } catch (netErr) {
    // network error (Failed to fetch) 재시도
    if (_retry < 2) {
      await new Promise(r => setTimeout(r, 2000 * (_retry + 1)));
      return callGeminiStream({ system, user, maxTokens, useSearch, onChunk, _retry: _retry + 1 });
    }
    throw new Error("network error");
  }
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    const msg = err.error?.message || `HTTP ${res.status}`;
    // 과부하(429/503) 시 최대 3회 재시도
    if ((res.status === 429 || res.status === 503) && _retry < 3) {
      const delay = (res.status === 429 ? 5000 : 2000) * (_retry + 1);
      onChunk && onChunk(`[재시도 중... ${_retry + 1}/3]`);
      await new Promise(r => setTimeout(r, delay));
      return callGeminiStream({ system, user, maxTokens, useSearch, onChunk, _retry: _retry + 1 });
    }
    throw new Error(msg);
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let fullText = "";
  let finishReason = "";
  let buf = "";

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const lines = buf.split("\n");
    buf = lines.pop();
    for (const line of lines) {
      if (!line.startsWith("data: ")) continue;
      const json = line.slice(6).trim();
      if (json === "[DONE]") continue;
      try {
        const parsed = JSON.parse(json);
        if (parsed.error) {
          const errMsg = parsed.error.message || "";
          // 스트리밍 중 과부하 에러도 재시도
          if ((parsed.error.code === 429 || parsed.error.code === 503) && _retry < 3) {
            await new Promise(r => setTimeout(r, 2000 * (_retry + 1)));
            return callGeminiStream({ system, user, maxTokens, useSearch, onChunk, _retry: _retry + 1 });
          }
          throw new Error(errMsg);
        }
        const chunk = parsed.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("") || "";
        if (parsed.candidates?.[0]?.finishReason) finishReason = parsed.candidates[0].finishReason;
        if (chunk) { fullText += chunk; onChunk && onChunk(fullText); }
      } catch (e) { if (e.message && !e.message.includes("JSON")) throw e; }
    }
  }
  // 토큰 한도로 응답이 잘린 경우: 토큰 2배로 1회 자동 재시도 (사용자가 다시 누를 필요 없게)
  if (finishReason === "MAX_TOKENS" && _retry < 1) {
    onChunk && onChunk("[응답이 길어 더 받는 중...]");
    return callGeminiStream({ system, user, maxTokens: Math.min(maxTokens * 2, 16000), useSearch, onChunk, _retry: _retry + 1 });
  }
  return fullText;}

// ---------- Gemini API 일반 호출 (이미지 등 스트리밍 불필요한 경우) ----------
async function callGemini({ system, user, maxTokens = 2000, useSearch = false, temperature = 0.7 }) {
  const model = useSearch ? GEMINI_MODEL : GEMINI_MODEL_FAST;
  const contents = [];
  if (system) contents.push({ role: "user", parts: [{ text: `[시스템 지시]\n${system}\n\n[사용자 질문]\n${user}` }] });
  else contents.push({ role: "user", parts: [{ text: user }] });

  const body = { contents, generationConfig: { maxOutputTokens: maxTokens, temperature, ...(useSearch ? {} : { thinkingConfig: { thinkingBudget: 0 } }) } };
  if (useSearch) body.tools = [{ googleSearch: {} }];

  const res = await fetch(GEMINI_PROXY, { method: "POST", headers: await geminiHeaders(), body: JSON.stringify({ model, body, stream: false }) });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("") || "";
}

async function callGeminiWithImage({ system, user, imageBase64, mediaType, maxTokens = 2000 }) {
  const parts = [];
  if (system) parts.push({ text: `[시스템 지시]\n${system}\n\n` });
  parts.push({ inlineData: { mimeType: mediaType, data: imageBase64 } });
  parts.push({ text: user });

  const body = {
    contents: [{ role: "user", parts }],
    generationConfig: { maxOutputTokens: maxTokens, temperature: 0.3, thinkingConfig: { thinkingBudget: 0 } },
  };

  // 콜드스타트(첫 호출)·일시 오류(5xx/429)·네트워크 끊김은 재시도 (최대 3회, 백오프)
  let lastErr;
  for (let attempt = 0; attempt < 3; attempt++) {
    if (attempt > 0) await new Promise(r => setTimeout(r, 1500 * attempt));
    try {
      const res = await fetch(GEMINI_PROXY, { method: "POST", headers: await geminiHeaders(), body: JSON.stringify({ model: GEMINI_MODEL, body, stream: false }) });
      if ([429, 500, 502, 503, 504].includes(res.status)) { lastErr = new Error(`서버 일시 오류 (${res.status})`); continue; }
      const data = await res.json();
      if (data.error) throw new Error(data.error.message); // 인증·요청 오류 등은 즉시 실패(재시도 무의미)
      return data.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("") || "";
    } catch (e) {
      lastErr = e;
      const transient = (e.name === "TypeError") || /failed to fetch|networkerror|load failed|fetch|시간 초과|timeout/i.test(e.message || "");
      if (!transient) throw e; // 네트워크 계열만 재시도
    }
  }
  throw lastErr || new Error("이미지 분석 실패");
}

// 기존 함수명 호환성 유지
async function callClaude({ system, user, maxTokens = 1000 }) {
  return callGemini({ system, user, maxTokens, useSearch: false });
}
async function callClaudeWithSearch({ system, user, maxTokens = 2000 }) {
  return callGemini({ system, user, maxTokens, useSearch: true });
}
async function callClaudeWithImage({ system, user, imageBase64, mediaType, maxTokens = 1500 }) {
  return callGeminiWithImage({ system, user, imageBase64, mediaType, maxTokens });
}

function loadPortfolio() {
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    const p = stored || PRESET_PORTFOLIO;
    // 마이그레이션: 과거 전역 현금(cash) → 계좌별 현금(cashByAccount). 전역값은 계좌를 알 수 없어 초기화.
    if (p && !p.cashByAccount) { p.cashByAccount = {}; if ("cash" in p) delete p.cash; }
    return p;
  } catch { return PRESET_PORTFOLIO; }
}
function savePortfolio(p) {
  if (p === null) localStorage.removeItem(STORAGE_KEY);
  else localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}
// 계좌별 현금(예수금). account 미지정/"all"이면 전체 합계.
function getCashFor(pf, account) {
  if (!pf) return 0;
  const m = pf.cashByAccount || {};
  if (!account || account === "all") return Object.values(m).reduce((s, v) => s + (Number(v) || 0), 0);
  return Number(m[account]) || 0;
}
// 특정 계좌의 현금을 설정한 새 cashByAccount 반환
function setCashFor(pf, account, value) {
  const m = { ...(pf && pf.cashByAccount ? pf.cashByAccount : {}) };
  const v = Number(value) || 0;
  if (v <= 0) delete m[account]; else m[account] = v;
  return m;
}

// ---------- USD/KRW 환율 (캐싱, 1시간 TTL) ----------
const FX_CACHE_KEY = "investiq_usdkrw_v1";
const FX_FALLBACK  = 1380; // 조회 실패 시 폴백

function getUsdKrw() {
  try {
    const c = JSON.parse(localStorage.getItem(FX_CACHE_KEY) || "null");
    if (c && c.rate > 0) return c.rate;
  } catch {}
  return FX_FALLBACK;
}
async function refreshUsdKrw() {
  try {
    // 1시간 이내 캐시면 재조회 생략 (토큰/요청 절약)
    const c = JSON.parse(localStorage.getItem(FX_CACHE_KEY) || "null");
    if (c && c.rate > 0 && Date.now() - (c.ts || 0) < 3600 * 1000) return c.rate;
  } catch {}
  try {
    const r = await fetch(`/api/yahoo?type=chart&ticker=${encodeURIComponent("USDKRW=X")}`);
    if (r.ok) {
      const d = await r.json();
      const rate = d.chart?.result?.[0]?.meta?.regularMarketPrice;
      if (rate > 0) {
        try { localStorage.setItem(FX_CACHE_KEY, JSON.stringify({ rate, ts: Date.now() })); } catch {}
        return rate;
      }
    }
  } catch {}
  return null;
}

// 보유 종목 평가액/매입액을 KRW로 환산 (USD 종목은 환율 곱)
function holdingValueKRW(h, fx) {
  const v = (h.shares || 0) * (h.current_price || h.avg_price || 0);
  return h.currency === "USD" ? v * (fx || getUsdKrw()) : v;
}
function holdingCostKRW(h, fx) {
  const v = (h.shares || 0) * (h.avg_price || 0);
  return h.currency === "USD" ? v * (fx || getUsdKrw()) : v;
}

// 시장 인사이트 캐시 중 가장 최근 조회 시각 (기준일 표시용)
function getMarketInsightDate() {
  let latest = null;
  ["summary","kr","us","asia","europe","commodities","crypto","ipo"].forEach(t => {
    try {
      const item = localStorage.getItem(`market_cache_${t}`);
      if (item) { const { time } = JSON.parse(item); if (time) { const d = new Date(time); if (!latest || d > latest) latest = d; } }
    } catch {}
  });
  return latest; // Date | null
}
function fmtInsightDate(d) {
  if (!d) return "";
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

function getMarketInsightContext(maxLen = 1200, tabs = ["summary","kr","us"]) {
  try {
    const parts = [];
    tabs.forEach(t => {
      const item = localStorage.getItem(`market_cache_${t}`);
      if (item) { const { data } = JSON.parse(item); const txt = typeof data === "string" ? data : JSON.stringify(data); if (txt) parts.push(`[${t}] ${txt}`); }
    });
    if (!parts.length) return "";
    return parts.join(" ").replace(/\s+/g, " ").slice(0, maxLen);
  } catch { return ""; }
}

function SectorRow({ item, showScore }) {
  return (
    <div style={{ marginBottom:16 }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4 }}>
        <span style={{ fontSize:17, fontWeight:700, color:getSectorColor(item.name) }}>{item.name}</span>
        {showScore && item.score && <span style={{ fontSize:14, color:"#10b981", fontWeight:700 }}>{item.score}/100</span>}
      </div>
      {showScore && item.score && (
        <div style={{ background:"#16162a", borderRadius:4, height:5, marginBottom:6 }}>
          <div style={{ width:`${item.score}%`, height:5, borderRadius:4, background:getSectorColor(item.name) }} />
        </div>
      )}
      <div style={{ fontSize:15, color:"#94a3b8", marginBottom:4 }}>{item.reason}</div>
      {item.leaders?.length > 0 && (
        <div style={{ fontSize:14, color:"#94a3b8" }}>주도주: <span style={{ color:"#e2e8f0" }}>{item.leaders.join(" · ")}</span></div>
      )}
      {item.etf?.length > 0 && (
        <div style={{ fontSize:14, color:"#94a3b8" }}>관련ETF: <span style={{ color:"#0ea5e9" }}>{item.etf.join(" · ")}</span></div>
      )}
    </div>
  );
}

// ---------- 세계 주요 지수 목록 (MarketInsight 용) ----------
const WORLD_INDEX_LIST = [
  { name: "닛케이225",      ticker: "%5EN225",   },
  { name: "홍콩항생",       ticker: "%5EHSI",    },
  { name: "상해종합",       ticker: "000001.SS", },
  { name: "인도Sensex",     ticker: "%5EBSESN",  },
  { name: "대만가권",       ticker: "%5ETWII",   },
  { name: "독일DAX",        ticker: "%5EGDAXI",  },
  { name: "영국FTSE",       ticker: "%5EFTSE",   },
  { name: "필라델피아반도체", ticker: "%5ESOX",    },
];

function MarketInsight({ onRefreshAll }) {
  // localStorage 캐시 초기 로드
  const loadCachedResults = () => {
    const cached = {};
    const cachedTimes = {};
    const tabs = ["summary","kr","us","asia","europe","commodities","crypto","ipo"];
    tabs.forEach(tabId => {
      try {
        const item = localStorage.getItem(`market_cache_${tabId}`);
        if (item) {
          const { data, time } = JSON.parse(item);
          cached[tabId] = data;
          cachedTimes[tabId] = new Date(time);
        }
      } catch(e) {}
    });
    return { cached, cachedTimes };
  };

  const { cached: initCache, cachedTimes: initTimes } = loadCachedResults();
  const [activeTab, setActiveTab] = useState("summary");
  const [results, setResults]     = useState(initCache);
  const [loading, setLoading]     = useState(new Set()); // 탭별 독립 로딩
  const [errors, setErrors]       = useState({});
  const [updatedAt, setUpdatedAt] = useState(initTimes);

  // ── 세계 지수 Yahoo 직접 조회 ──────────────────────────────
  const [worldIndices, setWorldIndices] = useState(() => {
    try {
      const c = JSON.parse(localStorage.getItem("investiq_world_idx_v1") || "null");
      if (c && Date.now() - c.ts < 30*60*1000) return c.data;
    } catch {}
    return null;
  });
  const [worldIdxLoading, setWorldIdxLoading] = useState(false);

  const fetchWorldIndices = async () => {
    setWorldIdxLoading(true);
    try {
      const results = await Promise.allSettled(
        WORLD_INDEX_LIST.map(async ({ name, ticker }) => {
          const res = await fetch(`/api/yahoo?type=chart&ticker=${ticker}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const d = await res.json();
          if (d.error) throw new Error(d.error);
          const meta   = d.chart?.result?.[0]?.meta;
          const closes = (d.chart?.result?.[0]?.indicators?.quote?.[0]?.close || []).filter(c => c != null);
          const current   = meta?.regularMarketPrice || closes[closes.length-1] || 0;
          const prevClose = meta?.previousClose      || closes[closes.length-2] || 0;
          const changeVal = prevClose > 0 ? ((current - prevClose) / prevClose * 100) : 0;
          return {
            name,
            value: current >= 1000
              ? current.toLocaleString("en-US", { maximumFractionDigits: 2 })
              : current.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
            change: Math.abs(changeVal).toFixed(2),
            up: changeVal >= 0,
            rawChange: changeVal,
          };
        })
      );
      const ok = results.filter(r => r.status === "fulfilled").map(r => r.value);
      if (ok.length > 0) {
        setWorldIndices(ok);
        localStorage.setItem("investiq_world_idx_v1", JSON.stringify({ data: ok, ts: Date.now() }));
      }
    } catch(e) { console.warn("세계 지수 조회 실패:", e); }
    setWorldIdxLoading(false);
  };

  React.useEffect(() => { if (!worldIndices) fetchWorldIndices(); }, []);

  const isLoading = (tabId) => loading.has(tabId);
  const setTabLoading = (tabId, val) => setLoading(prev => {
    const next = new Set(prev);
    val ? next.add(tabId) : next.delete(tabId);
    return next;
  });

  const fetchTab = async (tabId, retryCount = 0) => {
    setTabLoading(tabId, true);
    setErrors(e => ({ ...e, [tabId]: "" }));
    try {
      const today = new Date().toLocaleDateString("ko-KR");

      // ── 세계 지수 실시간 컨텍스트 주입 (asia / europe / summary) ──
      let worldCtx = "";
      if (worldIndices && worldIndices.length > 0) {
        const asiaNames  = ["닛케이225","홍콩항생","상해종합","인도Sensex","대만가권"];
        const euroNames  = ["독일DAX","영국FTSE"];
        const asiaData   = worldIndices.filter(i => asiaNames.includes(i.name));
        const euroData   = worldIndices.filter(i => euroNames.includes(i.name));
        const allData    = worldIndices;
        const fmt = (arr) => arr.map(i => `${i.name}: ${i.value} (${i.up?"+":"-"}${i.change}%)`).join(", ");
        if (tabId === "asia"    && asiaData.length > 0)
          worldCtx = `\n\n[API 실시간 아시아 지수 - 이 값을 index_change에 정확히 사용]\n${fmt(asiaData)}`;
        if (tabId === "europe"  && euroData.length > 0)
          worldCtx = `\n\n[API 실시간 유럽 지수 - 이 값을 참고]\n${fmt(euroData)}`;
        if (tabId === "summary" && allData.length > 0)
          worldCtx = `\n\n[API 실시간 세계 지수 (index_alerts 생성 불필요, 이미 별도 표시됨)]\n${fmt(allData)}`;
      }

      const timeoutMs = (tabId === "summary" || tabId === "commodities") ? 90000 : 60000;
      const timeoutPromise = new Promise((_, rej) => setTimeout(() => rej(new Error(`타임아웃 (${timeoutMs/1000}초)`)), timeoutMs));
      const text = await Promise.race([
        callGeminiStream({
          maxTokens: 8000,
          useSearch: true,
          system: `You are a global investment analyst with real-time market data access. CRITICAL RULES:
1. Search the web for TODAY's or YESTERDAY's market data ONLY. Never use data older than 2 days.
2. For index values (KOSPI, NASDAQ etc), find the most recent actual price from today's trading session.
3. Your ENTIRE response must be ONLY a valid JSON object
4. Start your response IMMEDIATELY with { and end with }
5. ABSOLUTELY NO text before or after the JSON
6. NO markdown, NO code blocks, NO backticks
7. NO citations like [1] [2] or [cite:...] anywhere
8. All string values must be in Korean (한국어)
9. Keep each string value concise

${SOURCE_RULES}`,
          user: MARKET_PROMPTS[tabId](today) + worldCtx,
        }),
        timeoutPromise,
      ]);
      let parsed;
      try {
        let clean = text
          .replace(/```json\s*/gi, "").replace(/```\s*/g, "")
          .replace(/\[cite[^\]]*\]/g, "").replace(/\[source[^\]]*\]/g, "")
          .replace(/\[\d+\]/g, "").replace(/\[\d+,\s*\d+[^\]]*\]/g, "")
          .replace(/\.\s*\[cite/g, ". ").trim();
        const firstBrace = clean.indexOf("{");
        const lastBrace = clean.lastIndexOf("}");
        if (firstBrace === -1 || lastBrace === -1) throw new Error("No JSON");
        clean = clean.slice(firstBrace, lastBrace + 1);
        try { parsed = JSON.parse(clean); }
        catch {
          const suffixes = ["}", "]}", "}]}", "}]}}"];
          for (const s of suffixes) { try { parsed = JSON.parse(clean + s); break; } catch {} }
          if (!parsed) {
            const lc = clean.lastIndexOf(",");
            if (lc > 0) {
              const t2 = clean.slice(0, lc);
              for (const s of suffixes) { try { parsed = JSON.parse(t2 + s); break; } catch {} }
            }
          }
          if (!parsed) {
            if (retryCount < 2) {
              setTabLoading(tabId, false);
              setTimeout(() => fetchTab(tabId, retryCount + 1), 2000);
              return;
            }
            parsed = { summary: "분석 결과를 파싱하지 못했습니다. 다시 시도해주세요.", _raw: true };
          }
        }
      } catch {
        if (retryCount < 2) {
          setTabLoading(tabId, false);
          setTimeout(() => fetchTab(tabId, retryCount + 1), 2000);
          return;
        }
        parsed = { summary: "분석 중 오류가 발생했습니다. 다시 시도해주세요.", _raw: true };
      }
      setResults(r => ({ ...r, [tabId]: parsed }));
      setUpdatedAt(u => ({ ...u, [tabId]: new Date() }));
      try { localStorage.setItem(`market_cache_${tabId}`, JSON.stringify({ data: parsed, time: new Date().toISOString() })); } catch(e) {}
    } catch(e) {
      if (retryCount < 2) {
        setTabLoading(tabId, false);
        setTimeout(() => fetchTab(tabId, retryCount + 1), 3000);
        return;
      }
      setErrors(er => ({ ...er, [tabId]: "분석 실패: "+e.message }));
    } finally {
      setTabLoading(tabId, false);
    }
  };

  // 전체 새로고침 이벤트
  React.useEffect(() => {
    const handler = () => {
      setResults({});
      setErrors({});
      setLoading(new Set());
      setWorldIndices(null);
      localStorage.removeItem("investiq_world_idx_v1");
      ["summary","kr","us","asia","europe","commodities","crypto","ipo"].forEach(t => {
        localStorage.removeItem(`market_cache_${t}`);
      });
      fetchWorldIndices();
      setActiveTab(prev => {
        setTimeout(() => fetchTab(prev), 150);
        return prev;
      });
    };
    window.addEventListener("globalRefresh", handler);
    return () => window.removeEventListener("globalRefresh", handler);
  }, []);

  const tab  = MARKET_TABS.find(t => t.id === activeTab);
  const data = results[activeTab];

const PIE_COLORS = ["#0ea5e9","#7c3aed","#f59e0b","#10b981","#ef4444","#ec4899","#f97316","#06b6d4","#84cc16","#6b7280","#8b78f5","#22d3a0","#fb923c","#fbbf24"];

function guessRegion(name) {
  if (!name) return "기타";
  const n = name.toUpperCase();
  if (n.includes("미국")||n.includes("S&P")||n.includes("나스닥")||n.includes("빅테크")||n.includes("우주테크")||n.includes("배당다우")||n.includes("테크TOP")||n.includes("서학개미")) return "미국";
  if (n.includes("차이나")||n.includes("중국")) return "중국";
  if (n.includes("인도")||n.includes("빌리언")) return "인도";
  if (n.includes("글로벌")||n.includes("TOP4")||n.includes("원자력")||n.includes("K방산")||n.includes("조선")) return "글로벌";
  return "한국";
}

function getSectorLabel(sector, name) {
  const n = (name||"").toUpperCase();
  if (n.includes("채권")||n.includes("미국채")||n.includes("국채")||n.includes("국공채")||n.includes("회사채")||n.includes("단기채")||n.includes("CD금리")||n.includes("KOFR")||n.includes("금리액티브")||n.includes("MMF")||n.includes("머니마켓")||n.includes("TDF")||n.includes("타겟데이트")||n.includes("자산배분")) return "채권";
  if (n.includes("배당")) return "배당";
  if (n.includes("삼성전자")) return "반도체";
  if (n.includes("AI")||n.includes("인공지능")||n.includes("로보")) return "AI·로보틱스";
  if (n.includes("반도체")) return "반도체";
  if (n.includes("빅테크")||n.includes("테크TOP")) return "미국빅테크";
  if (n.includes("S&P")||n.includes("나스닥")) return "미국지수";
  if (n.includes("전력")||n.includes("인프라")) return "전력인프라";
  if (n.includes("원자력")) return "원자력";
  if (n.includes("방산")||n.includes("조선")) return "방산·조선";
  if (n.includes("2차전지")) return "2차전지";
  if (n.includes("금현물")||n.includes("구리실물")) return "금·원자재";
  if (n.includes("차이나")||n.includes("인도빌리언")) return "신흥국";
  if (n.includes("코스닥")||n.includes("코스피")||n.includes("밸류업")||n.includes("증권")) return "국내지수";
  if (sector && sector !== "기타") return sector;
  return "기타";
}

function SvgPieChart({ data, colors, totalValue }) {
  const [hov, setHov] = useState(null);
  const cx=110, cy=100, r=78, ri=44, W=220, H=200;
  const total = data.reduce((s,d)=>s+d.value,0);
  if (!total) return null;
  let angle = -Math.PI/2;
  const slices = data.map((d,i)=>{
    const pct = d.value/total;
    // 100% 단일 슬라이스면 거의 완전한 원으로 처리 (SVG 호 제한 우회)
    const safePct = pct >= 1 ? 0.9999 : pct;
    const a0=angle, a1=angle+safePct*2*Math.PI;
    angle=a1;
    const x1=cx+r*Math.cos(a0),y1=cy+r*Math.sin(a0);
    const x2=cx+r*Math.cos(a1),y2=cy+r*Math.sin(a1);
    const ix1=cx+ri*Math.cos(a0),iy1=cy+ri*Math.sin(a0);
    const ix2=cx+ri*Math.cos(a1),iy2=cy+ri*Math.sin(a1);
    const lg=safePct>0.5?1:0;
    const path=`M${ix1},${iy1} L${x1},${y1} A${r},${r} 0 ${lg} 1 ${x2},${y2} L${ix2},${iy2} A${ri},${ri} 0 ${lg} 0 ${ix1},${iy1}Z`;
    return {...d,path,color:colors[i%colors.length],pct:(pct*100).toFixed(1)};
  });
  const h = hov!==null?slices[hov]:null;
  const handleTouch = (i) => setHov(prev => prev===i ? null : i);
  return (
    <svg width={W} height={H} style={{display:"block",margin:"0 auto"}}>
      {slices.map((s,i)=>(
        <path key={i} d={s.path} fill={s.color}
          opacity={hov===null||hov===i?1:0.45}
          onClick={()=>handleTouch(i)}
          onTouchStart={(e)=>{e.preventDefault();handleTouch(i);}}
          style={{cursor:"pointer",transition:"opacity 0.15s"}}/>
      ))}
      {/* 중앙(도넛 구멍) 클릭/탭 → 선택 해제하고 전체 보기로 */}
      <circle cx={cx} cy={cy} r={ri-1} fill="transparent"
        onClick={()=>setHov(null)} onTouchStart={(e)=>{e.preventDefault();setHov(null);}}
        style={{cursor:"pointer"}}/>
      {h ? <g style={{pointerEvents:"none"}}>
        <text x={cx} y={cy-16} textAnchor="middle" fill="#e2e8f0" fontSize="12" fontWeight="700">{h.name.length>8?h.name.slice(0,8)+"..":h.name}</text>
        <text x={cx} y={cy+4} textAnchor="middle" fill={h.color} fontSize="18" fontWeight="800">{h.pct}%</text>
        <text x={cx} y={cy+20} textAnchor="middle" fill="#364875" fontSize="11">{Math.round(h.value/10000).toLocaleString()}만원</text>
        <text x={cx} y={cy+34} textAnchor="middle" fill="#475569" fontSize="9">가운데 탭 → 전체</text>
      </g> : <g style={{pointerEvents:"none"}}>
        <text x={cx} y={cy-8} textAnchor="middle" fill="#2a3a60" fontSize="12">총 자산</text>
        <text x={cx} y={cy+10} textAnchor="middle" fill="#94a3b8" fontSize="13" fontWeight="700">{totalValue?Math.round(totalValue/10000).toLocaleString()+"만":""}</text>
      </g>}
    </svg>
  );
}

function PieLegend({data, colors, grand}) {
  return (

function PortfolioPieCharts({ portfolio, filterAccount }) {
  if (!portfolio) return null;
  const holdings = filterAccount && filterAccount !== "all"
    ? portfolio.holdings.filter(h => h.account === filterAccount)
    : portfolio.holdings;

  // 동일 계좌+동일 종목명 합산 (RSA 등 구분 없이)
  const mergedMap = new Map();
  holdings.forEach(h => {
    const key = `${h.account||""}::${h.name||h.ticker||""}`;
    if (mergedMap.has(key)) {
      const ex = mergedMap.get(key);
      const totalShares = (ex.shares||0) + (h.shares||0);
      const totalCost = (ex.shares||0)*(ex.avg_price||0) + (h.shares||0)*(h.avg_price||0);
      mergedMap.set(key, { ...ex, shares: totalShares, avg_price: totalShares>0?totalCost/totalShares:ex.avg_price, current_price: h.current_price||ex.current_price });
    } else {
      mergedMap.set(key, {...h});
    }
  });
  const merged = Array.from(mergedMap.values());

  const cash = getCashFor(portfolio, filterAccount);
  const fx = getUsdKrw();
  const totalValue = merged.reduce((s,h)=>s+holdingValueKRW(h,fx),0);
  const grand = totalValue + cash;

  const sectorMap={}, regionMap={};
  merged.forEach(h=>{
    const sv=holdingValueKRW(h,fx);
    const sk=getSectorLabel(h.sector,h.name);
    sectorMap[sk]=(sectorMap[sk]||0)+sv;
    const rk=guessRegion(h.name);
    regionMap[rk]=(regionMap[rk]||0)+sv;
  });
  if(cash>0){sectorMap["₩ 현금"]=cash; regionMap["₩ 현금"]=cash;}

  const toArr=(m)=>Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([name,value])=>({name,value:Math.round(value)}));
  const sectorData=toArr(sectorMap), regionData=toArr(regionMap);

  return (
    <>
      <div style={{background:"#0f0f18",border:"1px solid #1e293b",borderRadius:12,padding:16,marginBottom:14}}>
        <div style={{fontSize:13,color:"#f59e0b",fontWeight:700,marginBottom:14,letterSpacing:2}}>섹터별 구성</div>
        <SvgPieChart data={sectorData} colors={PIE_COLORS} totalValue={grand}/>
        <PieLegend data={sectorData} colors={PIE_COLORS} grand={grand}/>
      </div>
      <div style={{background:"#0f0f18",border:"1px solid #1e293b",borderRadius:12,padding:16,marginBottom:14}}>
        <div style={{fontSize:13,color:"#0ea5e9",fontWeight:700,marginBottom:14,letterSpacing:2}}>지역별 구성</div>
        <SvgPieChart data={regionData} colors={PIE_COLORS} totalValue={grand}/>
        <PieLegend data={regionData} colors={PIE_COLORS} grand={grand}/>
      </div>
    </>
  );
}

function addHistoryPoint(portfolio, filterAccount = null) {
  try {
    const holdings = filterAccount
      ? portfolio.holdings.filter(h => h.account === filterAccount)
      : portfolio.holdings;
    const pricedHoldings = holdings.filter(h => h.current_price && h.current_price > 0);
    if (pricedHoldings.length === 0) return;
    const fx = getUsdKrw();
    const tc = pricedHoldings.reduce((s,h) => s+holdingCostKRW(h,fx), 0);
    const tv = pricedHoldings.reduce((s,h) => s+holdingValueKRW(h,fx), 0);
    if (tc <= 0 || tv <= 0) return;
    const ret = ((tv-tc)/tc*100);
    if (Math.abs(ret) > 1000) return;
    const now = new Date();
    const point = { date:now.toISOString().slice(0,10), timestamp:now.getTime(), total_value:Math.round(tv), total_cost:Math.round(tc), return_pct:parseFloat(ret.toFixed(2)) };
    const key = filterAccount ? `portfolio_history_${filterAccount}` : "portfolio_history_v1";
    const history = JSON.parse(localStorage.getItem(key)||"[]");
    const filtered = history.filter(h => h.date !== point.date);
    localStorage.setItem(key, JSON.stringify([...filtered, point].sort((a,b)=>a.timestamp-b.timestamp).slice(-365)));
  } catch(e) { console.error(e); }
}

function saveAllHistoryPoints(portfolio) {
  // 전체 히스토리
  addHistoryPoint(portfolio, null);
  // 계좌별 히스토리
  const accounts = [...new Set(portfolio.holdings.map(h=>h.account).filter(Boolean))];
  accounts.forEach(acc => addHistoryPoint(portfolio, acc));
}

function ReturnHistoryChart({ portfolio, viewMode = "all" }) {
  const [period, setPeriod] = useState(localStorage.getItem("history_period")||"daily");
  if (!portfolio) return null;

  // 전체 or 계좌별 히스토리 키 선택
  const historyKey = viewMode === "all" ? "portfolio_history_v1" : `portfolio_history_${viewMode}`;
  const rawHistory = (() => { try { return JSON.parse(localStorage.getItem(historyKey)||"[]"); } catch { return []; } })();
  const grouped={};
  rawHistory.forEach(h=>{
    const d=new Date(h.timestamp);
    let key;
    if(period==="daily") key=h.date;
    else if(period==="weekly") key=`${d.getFullYear()}-W${Math.ceil((d.getDate())/7)}`;
    else if(period==="monthly") key=h.date.slice(0,7);
    else key=h.date.slice(0,4);
    if(!grouped[key]||h.timestamp>grouped[key].timestamp) grouped[key]=h;
  });
  const history=Object.values(grouped).sort((a,b)=>a.timestamp-b.timestamp);

  const filteredHoldings = viewMode === "all"
    ? portfolio.holdings
    : portfolio.holdings.filter(h => h.account === viewMode);
  const fxR = getUsdKrw();
  const tc = filteredHoldings.reduce((s,h)=>s+holdingCostKRW(h,fxR),0);
  const tv = filteredHoldings.reduce((s,h)=>s+holdingValueKRW(h,fxR),0);
  const curRet = tc>0 ? ((tv-tc)/tc*100).toFixed(2) : 0;

  const periods=[{id:"daily",label:"일별"},{id:"weekly",label:"주별"},{id:"monthly",label:"월별"},{id:"yearly",label:"연별"}];

  const maxAbs = history.length ? Math.max(...history.map(h=>Math.abs(h.return_pct)),1) : 1;
  const BAR_H = 100;

  return (
    <div style={{background:"#0f0f18",border:"1px solid #1e293b",borderRadius:12,padding:16,marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div style={{fontSize:13,color:"#7c3aed",fontWeight:700,letterSpacing:2}}>수익률 히스토리</div>
        <div style={{display:"flex",gap:4}}>
          {periods.map(p=>(
            <button key={p.id} onClick={()=>{setPeriod(p.id);localStorage.setItem("history_period",p.id);}} style={{
              padding:"4px 8px",borderRadius:10,border:`1px solid ${period===p.id?"#7c3aed":"#2a2a48"}`,
              background:period===p.id?"#7c3aed22":"transparent",
              color:period===p.id?"#8b78f5":"#364875",fontSize:11,cursor:"pointer",fontWeight:period===p.id?700:400,
            }}>{p.label}</button>
          ))}
        </div>
      </div>

      {history.length===0?(
        <div style={{textAlign:"center",padding:"24px 0",color:"#64748b",fontSize:13}}>
          가격 새로고침 후 히스토리가 쌓입니다
        </div>
      ):(
        <div>
          <div style={{display:"flex",alignItems:"flex-end",gap:4,height:BAR_H+30,overflowX:"auto",paddingBottom:4}}>
            {history.map((h,i)=>{
              const barH=Math.max(4,Math.abs(h.return_pct)/maxAbs*BAR_H);
              const isPos=h.return_pct>=0;
              const isCur=i===history.length-1;
              return(
                <div key={i} style={{display:"flex",flexDirection:"column",alignItems:"center",minWidth:36,flexShrink:0}}>
                  <div style={{fontSize:10,color:isPos?"#10b981":"#ef4444",fontWeight:700,marginBottom:2}}>
                    {h.return_pct>=0?"+":""}{h.return_pct}%
                  </div>
                  <div style={{
                    width:28,height:barH,borderRadius:"4px 4px 0 0",
                    background:isCur?(isPos?"#0ea5e9":"#ef4444"):(isPos?"#10b981":"#ef4444"),
                    opacity:isCur?1:0.6,
                    border:isCur?"2px solid #fff":"none",
                  }}/>
                  <div style={{fontSize:9,color:"#64748b",marginTop:3,textAlign:"center",lineHeight:1.2}}>
                    {period==="daily"?h.date.slice(5):period==="monthly"?h.date.slice(0,7):h.date.slice(0,period==="yearly"?4:7)}
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{textAlign:"center",marginTop:8,fontSize:13,color:"#94a3b8"}}>
            현재 수익률: <span style={{color:parseFloat(curRet)>=0?"#10b981":"#ef4444",fontWeight:700}}>{parseFloat(curRet)>=0?"+":""}{curRet}%</span>
            <span style={{fontSize:11,color:"#64748b",marginLeft:8}}>(파란 막대 = 현재)</span>
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- 종목 검색 공통 컴포넌트 ----------
function StockSearchRow({ country = "KR", onSelect }) {
  const [q, setQ]             = useState("");
  const [results, setResults] = useState([]);
  const [searching, setSearching] = useState(false);
  const [directMode, setDirectMode] = useState(false);
  const [directName, setDirectName] = useState("");

  const doSearch = async () => {
    const query = q.trim();
    if (!query) return;
    setSearching(true); setResults([]);
    const ETF_BRANDS = ["KODEX","TIGER","ACE","RISE","PLUS","KBSTAR","ARIRANG","HANARO","TIMEFOLIO","SOL","SMART","TREX","KOSEF","KTOP"];
    let found = [];
    try {
      if (country === "KR") {
        const parseAC = items => (items||[]).slice(0,8).map(item => {
          const nm=item[0]||"", code=item[1]||"", mkt=item[2]==="2"?"KOSDAQ":"KOSPI";
          return { symbol: code+(mkt==="KOSDAQ"?".KQ":".KS"), longname:nm, shortname:nm,
                   quoteType: ETF_BRANDS.some(b=>nm.toUpperCase().startsWith(b))?"ETF":"EQUITY", exchDisp:mkt };
        }).filter(x=>x.symbol.length>3);

        const acUrl = `https://ac.finance.naver.com/ac?q=${encodeURIComponent(query)}&q_enc=UTF-8&t_koreng=1&st=111&r_lt=111&r_format=json`;
        // 1차: CORS 프록시
        if (!found.length) {
          const pj = await Promise.any([
            `https://api.allorigins.win/raw?url=${encodeURIComponent(acUrl)}`,
            `https://corsproxy.io/?${encodeURIComponent(acUrl)}`,
          ].map(async p => {
            const ctrl=new AbortController(), t=setTimeout(()=>ctrl.abort(),6000);
            const r=await fetch(p,{signal:ctrl.signal}); clearTimeout(t);
            if(!r.ok) throw new Error();
            const d=await r.json();
            if(!(d.items||[]).length) throw new Error();
            return d;
          })).catch(()=>null);
          if (pj) found = parseAC(pj.items);
        }
        // 2차: 서버 프록시 (Gemini fallback 포함)
        if (!found.length) {
          try {
            const ctrl=new AbortController(), t=setTimeout(()=>ctrl.abort(),18000);
            const res=await fetch(`/api/naver?type=search&q=${encodeURIComponent(query)}`,{signal:ctrl.signal}); clearTimeout(t);
            if(res.ok){const d=await res.json(); found=(d.quotes||[]).filter(x=>["ETF","EQUITY","MUTUALFUND"].includes(x.quoteType));}
          } catch(e){}
        }
        // 3차: Yahoo KR
        if (!found.length) {
          try {
            const ctrl=new AbortController(), t=setTimeout(()=>ctrl.abort(),8000);
            const res=await fetch(`/api/yahoo?type=search&q=${encodeURIComponent(query)}&region=KR`,{signal:ctrl.signal}); clearTimeout(t);
            if(res.ok){const d=await res.json(); found=(d.quotes||[]).filter(x=>["ETF","EQUITY"].includes(x.quoteType)&&(x.symbol?.endsWith(".KS")||x.symbol?.endsWith(".KQ")));}
          } catch(e){}
        }
        // 한국어명 보완
        if (found.length && !found.some(r=>/[가-힣]/.test(r.longname||""))) {
          try {
            const codes=found.map(r=>(r.symbol||"").replace(/\.(KS|KQ)$/,"")).filter(c=>/^\d{6}$/.test(c)).join(",");
            if(codes){
              const ctrl=new AbortController(), t=setTimeout(()=>ctrl.abort(),5000);
              const nr=await fetch(`/api/naver?type=names&codes=${codes}`,{signal:ctrl.signal}); clearTimeout(t);
              if(nr.ok){const nd=await nr.json(); if(nd.names) found=found.map(r=>{const c=(r.symbol||"").replace(/\.(KS|KQ)$/,"");const ko=nd.names[c];return ko?{...r,longname:ko,shortname:ko}:r;});}
            }
          } catch(e){}
        }
      } else {
        try {
          const ctrl=new AbortController(), t=setTimeout(()=>ctrl.abort(),8000);
          const res=await fetch(`/api/yahoo?type=search&q=${encodeURIComponent(query)}`,{signal:ctrl.signal}); clearTimeout(t);
          if(res.ok){const d=await res.json(); found=(d.quotes||[]).filter(x=>["ETF","EQUITY"].includes(x.quoteType));}
        } catch(e){}
      }
    } catch(e){ console.warn("StockSearch 오류:", e); }
    setResults(found.slice(0,6)); setSearching(false);
  };

  const inputS = {flex:1,background:"#020617",border:"1px solid #334155",borderRadius:8,padding:"11px 12px",color:"#e2e8f0",fontSize:14,outline:"none"};

  if (directMode) return (
    <div>
      <div style={{display:"flex",gap:8,marginBottom:6}}>
        <input value={directName} onChange={e=>setDirectName(e.target.value)}
          onKeyDown={e=>{ if(e.key==="Enter"&&directName.trim()){onSelect({name:directName.trim(),ticker:"",yahoo_ticker:null});setDirectMode(false);setDirectName("");} }}
          placeholder="TDF·펀드 등 종목명 직접 입력" autoFocus style={{...inputS,border:"1px solid #0ea5e9"}}/>
        <button onClick={()=>{ if(directName.trim()){onSelect({name:directName.trim(),ticker:"",yahoo_ticker:null});setDirectMode(false);setDirectName("");} }}
          style={{padding:"0 14px",borderRadius:8,background:"#0ea5e9",border:"none",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer",whiteSpace:"nowrap"}}>확인</button>
      </div>
      <button onClick={()=>setDirectMode(false)} style={{fontSize:12,color:"#4f6ef7",background:"none",border:"none",cursor:"pointer",padding:0}}>← 검색으로</button>
    </div>
  );

  return (
    <div>
      <div style={{display:"flex",gap:6,marginBottom:4}}>
        <input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doSearch()}
          placeholder="종목명 또는 티커 검색..." style={inputS}/>
        <button onClick={doSearch} disabled={searching}
          style={{padding:"0 12px",borderRadius:8,background:"#a8b4f822",border:"1px solid #a8b4f844",color:"#a8b4f8",fontWeight:700,fontSize:13,cursor:"pointer",whiteSpace:"nowrap"}}>
          {searching?"…":"검색"}</button>
        <button onClick={()=>setDirectMode(true)}
          style={{padding:"0 10px",borderRadius:8,background:"#16162a",border:"1px solid #334155",color:"#64748b",fontSize:12,cursor:"pointer",whiteSpace:"nowrap"}}>직접입력</button>
      </div>
      {searching && <div style={{fontSize:12,color:"#a8b4f8",padding:"4px 0",display:"flex",alignItems:"center",gap:6}}><Spinner size={11}/>검색 중...</div>}
      {results.length>0 && (
        <div style={{background:"#0f0f18",border:"1px solid #334155",borderRadius:8,overflow:"hidden",marginTop:2}}>
          {results.map((r,i)=>(
            <button key={i} onClick={()=>{
              const nm=r.longname||r.shortname||r.symbol;
              onSelect({name:nm,ticker:r.symbol,yahoo_ticker:r.symbol,exchange:r.exchDisp||r.exchange||""});
              setQ(nm); setResults([]);
            }} style={{width:"100%",padding:"9px 12px",background:"transparent",border:"none",borderBottom:i<results.length-1?"1px solid #1e293b":"none",color:"#f0f0ff",fontSize:13,cursor:"pointer",textAlign:"left",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontWeight:600}}>{r.longname||r.shortname||r.symbol}</div>
                <div style={{fontSize:11,color:"#64748b"}}>{r.symbol} · {r.exchDisp||r.exchange}</div>
              </div>
              <div style={{fontSize:10,color:"#8a8ab8",background:"#16162a",padding:"2px 6px",borderRadius:4}}>{r.quoteType}</div>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

const ACCOUNTS = ["국내계좌", "해외계좌", "ISA", "연금저축", "IRP", "기타"];
const SECTORS  = ["기술","반도체","AI","에너지","금융","헬스케어","소비재","방산","부동산","기타"];


function EditHoldingModal({ holding, onClose, onSave }) {
  const [mode, setMode] = useState("edit");
  const [shares, setShares] = useState(String(holding.shares || ""));
  const [avgPrice, setAvgPrice] = useState(String(Math.round(holding.avg_price || 0))); // #6 소수점 수정
  const [addShares, setAddShares] = useState("");
  const [addPrice, setAddPrice] = useState("");
  const [sellShares, setSellShares] = useState("");
  const [stockOverride, setStockOverride] = useState(null); // 종목명/티커 변경 시
  const [showNameEdit, setShowNameEdit] = useState(!holding.ticker); // ticker 없으면 바로 열기
  const [showPriceInput, setShowPriceInput] = useState(false);
  const [currentPriceInput, setCurrentPriceInput] = useState(holding.current_price > 0 ? String(holding.current_price) : "");
  const [priceUnit, setPriceUnit] = useState(holding.currency === "USD" ? "USD" : "KRW"); // 향후 외화 확장 대비
  const [fetchingPrice, setFetchingPrice] = useState(false);

  const handleSave = () => {
    if (mode === "edit") {
      const base = { ...holding, shares: parseFloat(shares)||0, avg_price: parseFloat(String(avgPrice).replace(/,/g,""))||0 };
      if (stockOverride) {
        base.name = stockOverride.name;
        if (stockOverride.ticker) {
          base.ticker = stockOverride.ticker.replace(/\.(KS|KQ)$/, "");
          base.yahoo_ticker = stockOverride.yahoo_ticker || stockOverride.ticker;
        }
      }
      const cp = parseFloat(String(currentPriceInput).replace(/,/g,""));
      if (showPriceInput && cp > 0) base.current_price = cp;
      onSave(base);
    } else if (mode === "buy") {
      const addSh = parseFloat(addShares)||0;
      const addPr = parseFloat(String(addPrice).replace(/,/g,""))||0;
      const newShares = (holding.shares||0) + addSh;
      const newAvg = newShares>0 ? Math.round(((holding.shares||0)*(holding.avg_price||0)+addSh*addPr)/newShares) : (holding.avg_price||0);
      onSave({ ...holding, shares: newShares, avg_price: newAvg });
    } else if (mode === "sell") {
      const sellSh = parseFloat(sellShares)||0;
      const newShares = (holding.shares||0) - sellSh;
      if (newShares <= 0) { onSave(null); return; }
      onSave({ ...holding, shares: newShares });
    }
  };

  const fetchCurrentPrice = async () => {
    const code = (stockOverride?.ticker || holding.ticker || "").replace(/\.(KS|KQ)$/, "");
    const yTicker = stockOverride?.yahoo_ticker || holding.yahoo_ticker || (code ? code + ".KS" : null);
    const name = stockOverride?.name || holding.name || "";
    setFetchingPrice(true); setShowPriceInput(true);
    try {
      // 1. Naver (KRW 6자리 코드)
      if (/^\d{6}$/.test(code)) {
        const res = await fetch(`/api/naver?codes=${code}`);
        if (res.ok) {
          const d = await res.json();
          const r = d.results?.[code];
          if (r?.currentPrice > 0) { setCurrentPriceInput(String(r.currentPrice)); setFetchingPrice(false); return; }
        }
      }
      // 2. Yahoo Finance
      if (yTicker) {
        const res = await fetch(`/api/yahoo?type=chart&ticker=${encodeURIComponent(yTicker)}`);
        if (res.ok) {
          const d = await res.json();
          const price = d.chart?.result?.[0]?.meta?.regularMarketPrice;
          if (price > 0) { setCurrentPriceInput(String(Math.round(price))); setFetchingPrice(false); return; }
        }
      }
      // 3. Gemini Search
      if (name) {
        const body = { contents:[{role:"user",parts:[{text:`${name} 현재 주가(${priceUnit==="USD"?"달러":"원화"})를 검색해서 숫자만 반환`}]}], tools:[{googleSearch:{}}], generationConfig:{maxOutputTokens:100,temperature:0,thinkingConfig:{thinkingBudget:0}} };
        const res = await fetch(GEMINI_PROXY, {method:"POST",headers: await geminiHeaders(),body:JSON.stringify({model:"gemini-2.5-flash-lite",body,stream:false})});
        if (res.ok) {
          const data = await res.json();
          const text = data.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||"";
          const num = parseFloat(text.replace(/[^0-9.]/g,""));
          if (num > 0) { setCurrentPriceInput(String(priceUnit==="KRW"?Math.round(num):num)); setFetchingPrice(false); return; }
        }
      }
      alert("현재가를 자동으로 가져올 수 없습니다.\n직접 입력해주세요.");
    } catch(e) { console.warn("현재가 조회 실패:", e); }
    setFetchingPrice(false);
  };

  const tabBtn = (t, label) => (
    <button onClick={() => setMode(t)} style={{
      flex:1, padding:"8px 4px", border:"none", borderRadius:8, cursor:"pointer", fontSize:14, fontWeight:mode===t?700:400,
      background: mode===t?(t==="buy"?"#0ea5e9":t==="sell"?"#ef4444":"#7c3aed"):"#16162a",
      color: mode===t?"#fff":"#364875",
    }}>{label}</button>
  );

  const newSharesCalc = (holding.shares||0)+(parseFloat(addShares)||0);
  const newAvgCalc = newSharesCalc>0
    ? Math.round(((holding.shares||0)*(holding.avg_price||0)+(parseFloat(addShares)||0)*(parseFloat(String(addPrice).replace(/,/g,""))||0))/newSharesCalc)
    : 0;

  return (
    <div style={{ position:"fixed", inset:0, background:"#000b", zIndex:300, display:"flex", alignItems:"flex-end" }}
      onClick={e => e.target===e.currentTarget && onClose()}>
      <div style={{ width:"100%", maxWidth:480, margin:"0 auto", background:"#0f0f18", borderRadius:"20px 20px 0 0", padding:"24px 20px 48px", maxHeight:"88vh", overflowY:"auto", border:"1px solid #1e293b" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:20 }}>
          <div>
            <div style={{ fontWeight:700, color:"#e2e8f0", fontSize:17 }}>{stockOverride?.name || holding.name}</div>
            <div style={{ fontSize:13, color:"#94a3b8", marginTop:3 }}>현재 {holding.shares}주 · 평단 {Math.round(holding.avg_price||0).toLocaleString()}원{holding.account?` · ${holding.account}`:""}</div>
          </div>
          <button onClick={onClose} style={{ background:"none", border:"none", color:"#94a3b8", fontSize:22, cursor:"pointer" }}>x</button>
        </div>
        <div style={{ display:"flex", gap:6, marginBottom:20, background:"#16162a", borderRadius:10, padding:4 }}>
          {tabBtn("edit","수정")}
          {tabBtn("buy","추가매수")}
          {tabBtn("sell","v 일부매도")}
        </div>
        {mode==="edit" && (
          <>
            {/* 종목명/티커 변경 */}
            <div style={{ background:"#0a0a14", border:"1px solid #1e293b", borderRadius:10, padding:"12px 14px", marginBottom:14 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom: showNameEdit ? 12 : 0 }}>
                <div style={{ fontSize:13, color:"#64748b", fontWeight:600 }}>

                    </span>

                  {!stockOverride && !holding.ticker && (
                    <span style={{ color:"#f59e0b", marginLeft:8, fontSize:11, fontWeight:400 }}>티커 없음 · 검색으로 연결 가능</span>

                <button onClick={()=>{ setShowNameEdit(!showNameEdit); if(showNameEdit) setStockOverride(null); }}

        )}
        <button onClick={handleSave} style={{
          width:"100%", padding:"14px", borderRadius:10, border:"none", cursor:"pointer",

        }}>
          {mode==="edit"?"저장":mode==="buy"?"매수 반영":"매도 반영"}
        </button>
      </div>
    </div>
  );
}

function TradeModal({ mode, holdings, accounts, onClose, onConfirm, currentCash = 0, defaultAccount = "" }) {
  const isBuy  = mode === "buy";
  const isSell = mode === "sell";
  const isCash = mode === "cash";
  const [account, setAccount]         = useState(defaultAccount || accounts[0] || "");

  const [country, setCountry]         = useState("KR");

  const [searchResults, setSearchResults] = useState([]);
  const [searching, setSearching]     = useState(false);
  const [price, setPrice]             = useState("");
  const [shares, setShares]           = useState("");
  const [cashAmt, setCashAmt]         = useState(String(currentCash || ""));

  const COUNTRIES = [

    { id:"JP", label:"🇯🇵 일본", suffix:".T" },
    { id:"CN", label:"🇨🇳 중국", suffix:".SS .SZ" },
    { id:"ALL", label:"🌐 전체", suffix:"" },

  const existingOptions = holdings.filter(h => !account || h.account === account);

  const totalCost = (parseFloat(price)||0) * (parseFloat(shares)||0);

  const doSearch = async (q, ctry) => {
    if (!q || q.length < 2) { setSearchResults([]); return; }
    setSearching(true);
    const qTrimmed = q.trim();
    let results = [];
    const searchYahoo = async (query, filterFn) => {
      const base = `https://query1.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(query)}&quotesCount=10&newsCount=0`;
      const urls = [`/api/yahoo?type=search&q=${encodeURIComponent(query)}`, `https://api.allorigins.win/raw?url=${encodeURIComponent(base)}`, base];
      for (const url of urls) {
        try {
          const ctrl = new AbortController();
          const t = setTimeout(() => ctrl.abort(), 8000);
          const r = await fetch(url, { signal: ctrl.signal });
          clearTimeout(t);
          if (!r.ok) continue;
          const text = await r.text();
          const data = typeof text === "string" ? JSON.parse(text) : text;
          const list = (data.quotes||[]).filter(x=>["ETF","EQUITY","MUTUALFUND"].includes(x.quoteType));
          const filtered = filterFn ? list.filter(filterFn) : list;
          if (filtered.length > 0) return filtered;
        } catch(e) {}
      }
      return [];
    };
    try {
      if (ctry === "KR") {
        const ETF_BRANDS2 = ["KODEX","TIGER","ACE","RISE","PLUS","KBSTAR","ARIRANG","HANARO","TIMEFOLIO","SOL","SMART","TREX","KOSEF","KTOP"];
        const parseAC = (items) => items.slice(0,8).map(item => {
          const name=item[0]||"", code=item[1]||"", mkt=item[2]==="2"?"KOSDAQ":"KOSPI";
          return { symbol:code+(mkt==="KOSDAQ"?".KQ":".KS"), longname:name, shortname:name, quoteType:ETF_BRANDS2.some(b=>name.toUpperCase().startsWith(b))?"ETF":"EQUITY", exchDisp:mkt };
        }).filter(x=>x.symbol.length>3);
        const acUrl = `https://ac.finance.naver.com/ac?q=${encodeURIComponent(qTrimmed)}&q_enc=UTF-8&t_koreng=1&st=111&r_lt=111&r_format=json`;
        // 1차: allorigins → Naver AC
        try {
          const ctrl=new AbortController(), t=setTimeout(()=>ctrl.abort(),7000);
          const r=await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(acUrl)}`,{signal:ctrl.signal});
          clearTimeout(t);
          if(r.ok){const d=await r.json();if((d.items||[]).length>0)results=parseAC(d.items);}
        } catch(e){}
        // 2차: Naver AC 직접
        if(results.length===0){try{const ctrl=new AbortController(),t=setTimeout(()=>ctrl.abort(),5000);const r=await fetch(acUrl,{signal:ctrl.signal});clearTimeout(t);if(r.ok){const d=await r.json();if((d.items||[]).length>0)results=parseAC(d.items);}}catch(e){}}
        // 3차: /api/naver 프록시
        if(results.length===0){try{const ctrl=new AbortController(),t=setTimeout(()=>ctrl.abort(),18000);const res=await fetch(`/api/naver?type=search&q=${encodeURIComponent(qTrimmed)}`,{signal:ctrl.signal});clearTimeout(t);if(res.ok){const d=await res.json();results=(d.quotes||[]).filter(r=>["ETF","EQUITY","MUTUALFUND"].includes(r.quoteType));}}catch(e){}}
        // 4차: Yahoo KR 로케일 검색 — lang=ko-KR&region=KR 파라미터로 한국어명 직접 반환
        if(results.length===0){
          const krBase=`https://query1.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(qTrimmed)}&lang=ko-KR&region=KR&quotesCount=10&newsCount=0`;
          const krUrls=[`/api/yahoo?type=search&q=${encodeURIComponent(qTrimmed)}&region=KR`,`https://api.allorigins.win/raw?url=${encodeURIComponent(krBase)}`,krBase];
          for(const url of krUrls){try{const ctrl=new AbortController(),t=setTimeout(()=>ctrl.abort(),8000);const r=await fetch(url,{signal:ctrl.signal});clearTimeout(t);if(!r.ok)continue;const d=await r.json();const q=(d.quotes||[]).filter(x=>["ETF","EQUITY","MUTUALFUND"].includes(x.quoteType)&&(x.symbol?.endsWith(".KS")||x.symbol?.endsWith(".KQ")));if(q.length>0){results=q;break;}}catch(e){}}
        }
        // 5차: 여전히 영어명이면 /api/naver type=names 로 보완
        if(results.length>0&&!results.some(r=>/[가-힣]/.test(r.longname||""))){try{const kodesStr=results.map(r=>(r.symbol||"").replace(/\.(KS|KQ)$/,"")).filter(c=>/^\d{6}$/.test(c)).join(",");if(kodesStr){const ctrl=new AbortController(),t=setTimeout(()=>ctrl.abort(),5000);const nr=await fetch(`/api/naver?type=names&codes=${kodesStr}`,{signal:ctrl.signal});clearTimeout(t);if(nr.ok){const nd=await nr.json();if(nd.names&&Object.keys(nd.names).length>0)results=results.map(r=>{const code=(r.symbol||"").replace(/\.(KS|KQ)$/,"");const ko=nd.names[code];return ko?{...r,longname:ko,shortname:ko}:r;});}}}catch(e){}}
      } else {
        const filterFn =
          ctry==="US" ? (q=>!q.symbol?.includes(".")||["NMS","NYQ","NGM","PCX"].includes(q.exchange)) :
          ctry==="JP" ? (q=>q.symbol?.endsWith(".T")) :
          ctry==="CN" ? (q=>q.symbol?.endsWith(".SS")||q.symbol?.endsWith(".SZ")) : null;
        results = await searchYahoo(qTrimmed, filterFn);
      }
    } catch(e) { console.warn("검색 오류:", e.message); }
    setSearchResults(results.slice(0,6));
    setSearching(false);

    </div>
  );

  return (
    <div style={{ position:"fixed", inset:0, background:"#00000088", zIndex:500, display:"flex", alignItems:"flex-end" }} onClick={onClose}>

        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>

              style={{ width:"100%", background:"#16162a", border:"1px solid #1e1e35", borderRadius:8, padding:"11px 12px", color:"#e8eaf0", fontSize:14, outline:"none" }}>
              {accounts.map(a => <option key={a} value={a}>{a}</option>)}
            </select>
          </div>
        )}

        {/* 매수: 기존/신규 탭 */}
        {isBuy && (
          <div style={{ display:"flex", gap:0, marginBottom:14, background:"#16162a", borderRadius:10, padding:3 }}>
            {[{id:"existing",label:"기존 종목 추가매수"},{id:"new",label:"신규 종목"}].map(t => (
              <button key={t.id} onClick={()=>{setBuyTab(t.id);setName("");setSearchQ("");setSearchResults([]);setYahooTicker(null);}} style={{
                flex:1, padding:"8px 4px", border:"none", borderRadius:8,
                background:buyTab===t.id?"#0f0f18":"transparent",
                color:buyTab===t.id?"#22d3a0":"#475569",
                fontSize:12, fontWeight:700, cursor:"pointer",
              }}>{t.label}</button>
            ))}
          </div>
        )}

        {/* 종목 선택 */}
        <div style={{ marginBottom:14 }}>
          <div style={{ fontSize:12, color:"#64748b", marginBottom:6, fontWeight:600 }}>종목</div>

          {/* 기존 종목 드롭다운 (매도 or 기존 추가매수) */}
          {(isSell || (isBuy && buyTab==="existing")) && (
            <select value={name} onChange={e=>setName(e.target.value)}
              style={{ width:"100%", background:"#16162a", border:"1px solid #1e1e35", borderRadius:8, padding:"11px 12px", color:name?"#e8eaf0":"#475569", fontSize:14, outline:"none" }}>
              <option value="">종목 선택...</option>
              {existingOptions.map((h,i) => (
                <option key={i} value={h.name}>{h.name} ({isSell?h.shares+"주":"평단 "+Math.round(h.avg_price||0).toLocaleString()+"원"})</option>
              ))}
            </select>
          )}

          {/* 신규 종목 - 국가 선택 + Yahoo 검색 */}
          {isBuy && buyTab==="new" && (
            <div>
              {/* 국가 선택 */}
              <div style={{ display:"flex", gap:4, marginBottom:8, overflowX:"auto" }}>
                {COUNTRIES.map(c => (
                  <button key={c.id} onClick={()=>handleCountryChange(c.id)} style={{
                    padding:"5px 10px", borderRadius:8, border:"none", cursor:"pointer", whiteSpace:"nowrap", flexShrink:0,
                    background:country===c.id?"#22d3a022":"#16162a",
                    color:country===c.id?"#22d3a0":"#475569",
                    fontSize:11, fontWeight:700,
                  }}>{c.label}</button>

              </div>
              {/* 검색창 */}
              <div style={{ display:"flex", gap:8, marginBottom:4 }}>
                <input value={searchQ} onChange={e=>handleSearchChange(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&handleSearchSubmit()}
                  placeholder="종목명 또는 티커..."
                  style={{ flex:1, background:"#16162a", border:`1px solid ${name?"#22d3a0":"#1e1e35"}`, borderRadius:8, padding:"11px 12px", color:"#e8eaf0", fontSize:14, outline:"none" }} />

              {searching && <div style={{ fontSize:12, color:"#a8b4f8", padding:"6px 4px", display:"flex", alignItems:"center", gap:6 }}><Spinner size={11}/> 검색 중...</div>}
              {searchResults.length > 0 && !name && (
                <div style={{ background:"#22223a", borderRadius:8, overflow:"hidden", border:"1px solid #3a3a6a" }}>
                  {searchResults.map((q,i) => (
                    <button key={i} onMouseDown={e=>{e.preventDefault();
                      setName(q.longname||q.shortname||q.symbol);
                      setYahooTicker(q.symbol);
                      setSearchQ(q.longname||q.shortname||q.symbol);
                      setSearchResults([]);
                    }} style={{
                      width:"100%", padding:"10px 12px", background:"transparent",
                      border:"none", borderBottom:i<searchResults.length-1?"1px solid #12121f":"none",
                      color:"#e8eaf0", fontSize:13, cursor:"pointer", textAlign:"left",

                    </button>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>

        {/* 단가 */}
        <div style={{ marginBottom:14 }}>
          <div style={{ fontSize:12, color:"#64748b", marginBottom:6, fontWeight:600 }}>{isBuy?"매수":"매도"} 단가</div>

        </div>

        <div style={{ marginBottom:16 }}>
          <div style={{ fontSize:12, color:"#64748b", marginBottom:6, fontWeight:600 }}>
            수량 {isSell && maxShares>0 && <span>(보유 {maxShares}주)</span>}
          </div>
          <div style={{ display:"flex", gap:8 }}>
            <input value={shares} onChange={e=>setShares(e.target.value)} inputMode="decimal" placeholder="0"
              style={{ flex:1, background:"#16162a", border:`1px solid ${isSell&&parseFloat(shares)>maxShares?"#f87171":"#1e1e35"}`, borderRadius:8, padding:"11px 12px", color:"#e8eaf0", fontSize:14, outline:"none" }} />
            {isSell && maxShares>0 && (
              <button onClick={()=>setShares(String(maxShares))} style={{ padding:"0 14px", borderRadius:8, background:"#1a0a0a", border:"1px solid #3a1a1a", color:"#f87171", fontSize:12, fontWeight:700, cursor:"pointer", whiteSpace:"nowrap" }}>전량</button>
            )}
          </div>
          {isSell && parseFloat(shares)>maxShares && <div style={{ fontSize:11, color:"#f87171", marginTop:4 }}>보유 수량 초과</div>}
        </div>

        {totalCost > 0 && (
          <div style={{ background:"#16162a", borderRadius:10, padding:"12px 14px", marginBottom:16, display:"flex", justifyContent:"space-between" }}>
            <span style={{ fontSize:13, color:"#64748b" }}>총 {isBuy?"매수":"매도"}금액</span>
            <span style={{ fontSize:14, fontWeight:700, color:isBuy?"#22d3a0":"#f87171" }}>₩{Math.round(totalCost).toLocaleString()}</span>
          </div>
        )}

        <button onClick={()=>{ if(!isValid)return; onConfirm({type:mode,account,name:name.trim(),yahooTicker,price:parseFloat(price),shares:parseFloat(shares)}); }}
          disabled={!isValid} style={{
          width:"100%", padding:"14px", borderRadius:12, border:"none",
          background:!isValid?"#16162a":isBuy?"linear-gradient(135deg,#22d3a0,#0891b2)":"linear-gradient(135deg,#f87171,#dc2626)",
          color:!isValid?"#334155":"#fff", fontWeight:800, fontSize:15, cursor:isValid?"pointer":"not-allowed",
        }}>{isBuy?"매수 반영":"매도 반영"}</button>
      </div>
    </div>
  );
}
