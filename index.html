4. 기타: 어떤 형태든 종목명/수량/평균단가(또는 역산 가능한 값) 추출

[중요 규칙]
- 브랜드명(KODEX/TIGER/ACE/RISE/PLUS/TIME 등)은 종목명 앞에 포함 (예: "TIGER 미국우주테크")
- shares(보유수량): 화면에 표시된 실제 보유 주수/좌수
- avg_price(평균단가): 반드시 매입금액 ÷ shares 로 계산. TDF/펀드는 1좌당 1,000~2,000원 수준이고 수량이 수십만~백만 좌일 수 있음. 매입금액이 수백만~수십억 단위인데 수량이 수십만 이상이면 avg_price는 반드시 매입금액÷수량으로 계산 (매입금액 자체를 avg_price로 쓰지 말 것)
- 현금성자산 처리: "현금성자산", "미래에셋증권현금성자산", "MMF", "머니마켓", "CMA" 등 현금성 종목은 shares=평가금액(원 단위 숫자), avg_price=1, current_price=1 로 처리. 절대 평가금액을 avg_price로 쓰지 말 것
- current_price: 화면에 현재가/현재값이 보이면 숫자로 추출. 없으면 null
- change_pct: 화면에 등락률(%)이 보이면 숫자로 추출 (예: +2.34 또는 -1.5). 없으면 null
- TDF/MMF 등 현재가 조회가 어려운 종목도 화면에 표시된 값 그대로 추출
- ticker, yahoo_ticker: 한국(KRW) 종목은 빈 문자열/null로 둘 것 (앱이 종목명으로 정확히 조회). 미국 등 해외 종목만 알면 yahoo_ticker에 심볼 기입
- account: 아래 규칙을 반드시 따를 것
  * 계좌명이 있으면 → 계좌명만 사용 (계좌번호, 계좌주 이름 모두 제외)
  * 계좌명이 없으면 → 계좌번호만 사용 (잘려도 OK, 계좌주 이름 제외)
  * 계좌주 성명(한글 이름)은 절대 포함하지 말 것
  * 예: "[Super365] 3026-1683-01 김응용" → "Super365" 또는 "[Super365]"
  * 예: "270-82-452759 [01] 종합계좌 김응용" → "종합계좌"
  * 예: "3026-1683-01" (계좌명 없음) → "3026-1683-01"
- cash: 예수금/현금 잔고 (없으면 0)

[partial_fail 규칙 - 절대 원칙]
아래 경우는 holdings에 절대 포함하지 말고 반드시 partial_fail에만 넣을 것:
1. 종목명에 "..." 또는 "…"이 포함된 경우 (예: "KODEX 코리아밸...", "TIGER 미국우주테크...") → 이름이 완전하지 않으므로 무조건 partial_fail. 설령 수량과 금액이 읽혀도 절대 holdings에 넣지 말 것.
2. 화면 하단에서 행 전체가 잘려서 수량/금액 중 하나라도 없는 경우
3. 숫자가 흐리거나 가려져 정확히 읽을 수 없는 경우
4. 보유수량이 0이거나 평가금액이 0인 경우 (전량 매도된 종목) → holdings에 넣지 말고 partial_fail로
→ partial_fail에 넣을 때는 화면에서 읽은 텍스트 그대로 기록

{"holdings":[{"ticker":"","yahoo_ticker":null,"name":"브랜드포함종목명","shares":수량,"avg_price":평균단가,"current_price":현재가또는null,"change_pct":등락률또는null,"currency":"KRW","sector":"섹터","account":"계좌명"}],"account_type":"국내/해외/혼합","account":"계좌명","cash":예수금,"partial_fail":["잘린종목명"],"total_count":화면상단종목수또는null}`,
          imageBase64: base64,
          mediaType,
          user: "이 계좌 스크린샷에서 모든 보유 종목과 계좌 정보를 추출해줘. JSON만.",
        });
        parsed = safeParseJSON(text);

        // ── JS 레벨 강제 처리: "..." 포함된 종목명 → partial_fail (AI 프롬프트 의존 X)
        if (parsed?.holdings) {
          const truncated = parsed.holdings.filter(h => h.name && (h.name.includes("...") || h.name.includes("…")));
          if (truncated.length > 0) {
            parsed.holdings = parsed.holdings.filter(h => !h.name?.includes("...") && !h.name?.includes("…"));
            parsed.partial_fail = [...(parsed.partial_fail || []), ...truncated.map(h => h.name)];
          }
        }

        // 수량/단가 없는 종목 → 해당 종목만 partial_fail로 분리 (전량 매도 후 0으로 남은 종목 등)
        // 현금성자산(avg_price=1이 정상)은 제외하고 판단
        if (parsed?.holdings) {
          const isCash = (nm) => ["현금","mmf","머니마켓","cma","현금성"].some(k => (nm||"").toLowerCase().includes(k));
          const missingData = parsed.holdings.filter(h => !isCash(h.name) && (!h.shares || h.shares <= 0 || !h.avg_price || h.avg_price <= 0));
          if (missingData.length > 0) {
            parsed.holdings = parsed.holdings.filter(h => isCash(h.name) || (h.shares > 0 && h.avg_price > 0));
            parsed.partial_fail = [...(parsed.partial_fail || []), ...missingData.map(h => `${h.name} (수량/단가 없음)`)];
          }
        }

        // 부분 인식 실패 안내
        // total_count 불일치 감지: AI가 화면 종목수를 알고 있는데 파싱된 것이 적으면 경고
        const declaredTotal = parsed.total_count;
        const parsedCount = (parsed.holdings?.length || 0) + (parsed.partial_fail?.length || 0);
        const hasCountMismatch = declaredTotal && parsedCount < declaredTotal;
        if (hasCountMismatch) {
          const missingCount = declaredTotal - parsedCount;
          parsed.partial_fail = [...(parsed.partial_fail || []), ...Array(missingCount).fill("(미확인 종목 - 스크롤 후 재업로드 권장)")];
        }

        if (!parsed?.holdings?.length && !(parsed.partial_fail?.length)) throw new Error("종목을 인식할 수 없습니다.\n계좌 잔고 화면의 스크린샷을 올려주세요.");

        if ((parsed.partial_fail?.length || 0) > 0) {
          const realFails = parsed.partial_fail.filter(f => !f.startsWith("(미확인"));
          const countFails = parsed.partial_fail.length - realFails.length;
          const succeeded = parsed.holdings?.length || 0;
          const failCount = parsed.partial_fail.length;
          if (batchCtx) {
            // 다중 이미지 배치: 이미지마다 confirm을 띄우면 모바일 브라우저가 반복 대화상자를
            // 자동 억제(이후 confirm()=false)해서 이미지가 통째로 누락됨. → confirm 없이 성공분 등록,
            // 잘린 종목명만 모아서 배치 끝에 1회 안내. (경계 잘림은 대부분 옆 이미지에서 잡힘)
            if (realFails.length) batchCtx.partialFails.push(...realFails);
          } else {
            let msg = `⚠️ ${succeeded + failCount}개 종목 중 ${failCount}개 인식 실패\n\n`;
            if (realFails.length > 0) msg += `실패 종목: ${realFails.join(", ")}\n\n`;
            if (countFails > 0) msg += `미확인 ${countFails}개 (스크롤하여 재업로드 시 추가 가능)\n\n`;
            msg += `나머지 ${succeeded}개 종목을 등록하시겠습니까?`;
            const proceed = window.confirm(msg);
            if (!proceed) { setUploading(false); setUploadMsg(""); return; }
          }
        }
        if (!parsed?.holdings?.length) {
          if (batchCtx) { setUploading(false); return; } // 이 이미지엔 등록할 종목 없음 → 조용히 건너뜀
          throw new Error("등록할 수 있는 종목이 없습니다.\n수량과 평균단가가 보이는 화면을 올려주세요.");
        }

      } else if (isSpreadsheet) {
        parsed = await analyzeSpreadsheet(file);
      } else {
        throw new Error(`지원하지 않는 파일 형식입니다. (${ext || mime || "알 수 없음"})\n이미지, xlsx, csv 파일만 가능합니다.`);
      }

      if (!parsed?.holdings?.length) {
        if (batchCtx) { setUploading(false); return; } // 배치: 이 이미지 건너뜀
        throw new Error("종목을 찾을 수 없어요. 다른 이미지를 시도해보세요.");
      }

      // ── 계좌명 + 등록 방식 결정 ───────────────────────────────────────────
      // 머지 기준은 항상 최신 localStorage(base)에서 읽음 (다중 이미지 순차 처리 시 stale closure 방지).
      const base = loadPortfolio();
      let targetAccountName, regMode;
      if (batchCtx) {
        // 스크린샷 모달 경로: 사용자가 입력한 계좌명 사용(AI 자동인식 무시). 교체 여부는 onConfirm에서 배치당 1회 확인 완료.
        targetAccountName = batchCtx.accountName;
        if (batchCtx.batchTouched.has(targetAccountName)) regMode = "merge";          // 같은 배치 추가분 → 병합
        else if (batchCtx.preBatchAccounts.has(targetAccountName)) regMode = "replace"; // 기존 계좌 → 교체
        else regMode = "new";                                                          // 신규
      } else {
        // 비배치(스프레드시트 등): 같은 계좌명이면 구분자 붙여 신규로 (기존 동작 유지, 의도치 않은 덮어쓰기 방지)
        const rawAccount = (parsed.account || "신규계좌").trim();
        const existing = [...new Set(base.holdings.map(h => h.account).filter(Boolean))];
        targetAccountName = rawAccount;
        if (existing.includes(rawAccount)) {
          const dup = existing.filter(n => n === rawAccount || n.startsWith(rawAccount + " ")).length;
          targetAccountName = rawAccount + ` -${dup + 1}`;
        }
        regMode = "new";
      }

      let newHoldings = parsed.holdings.map(h => {
        const name = (h.name || "").toLowerCase();
        const shares = parseFloat(h.shares) || 0;
        let avgPrice = parseFloat(h.avg_price) || 0;
        let currentPrice = (h.current_price && h.current_price > 0) ? parseFloat(h.current_price) : null;

        // 현금성자산 처리 (1좌=1원)
        const isCashAsset = name.includes("현금") || name.includes("mmf") || name.includes("머니마켓") || name.includes("cma") || name.includes("현금성");
        if (isCashAsset) { avgPrice = 1; currentPrice = 1; }

        // 비정상 avg_price 보정: 매입금액 전체가 avg_price로 들어온 경우 (100억 초과)
        if (!isCashAsset && shares > 0 && avgPrice > 0) {
          const impliedTotal = shares * avgPrice;
          if (impliedTotal > 10000000000 && avgPrice > shares && avgPrice > 100000) {
            avgPrice = Math.round(avgPrice / shares);
          }
        }

        // KRW avg_price 소수점 제거
        const isKRW = !h.currency || h.currency === "KRW";
        if (isKRW) avgPrice = Math.round(avgPrice);

        // KRW 종목은 Gemini OCR 티커를 신뢰하지 않음 (잘림·환각으로 엉뚱한 종목 매칭 방지)
        // → 종목명 기반 resolveTickerCodes 검증을 거쳐서만 티커 확정
        return {
          ...h,
          shares,
          avg_price: avgPrice,
          ticker: isKRW ? "" : h.ticker,
          yahoo_ticker: isKRW ? null : (h.yahoo_ticker || null),
          current_price: currentPrice,
          change_pct: h.change_pct ?? null,
          account: batchCtx ? targetAccountName : (h.account || targetAccountName),
        };
      }).filter(h => h.shares > 0 && h.avg_price >= 0);

      // 모든 KRW 종목을 종목명 기반으로 티커 검증·조회 (현금성자산 제외)
      const krwToResolve = newHoldings.filter(h =>
        (!h.currency || h.currency === "KRW") &&
        !["현금","mmf","머니마켓","cma","현금성"].some(k => (h.name||"").toLowerCase().includes(k))
      );
      if (krwToResolve.length > 0) {
        setUploadMsg(`📡 종목코드 조회 중 (${krwToResolve.length}개)...`);
        try {
          const resolved = await resolveTickerCodes(krwToResolve);
          const resolvedMap = {};
          resolved.forEach(r => { if (r.name) resolvedMap[r.name] = r; });
          newHoldings = newHoldings.map(h => {
            const r = resolvedMap[h.name];
            if (!r?.yahoo_ticker) return h;
            const m = r.yahoo_ticker.match(/^(\d{6})\.(KS|KQ)$/);
            // 1글자 오타 보정으로 공식명을 받은 경우 이름 교정 + 알림 기록
            const corrected = r._officialName && r._officialName !== h.name;
            if (corrected) {
              const note = { from: h.name, to: r._officialName };
              if (batchCtx) batchCtx.corrections.push(note);
              else localCorrections.push(note);
            }
            return { ...h, yahoo_ticker: r.yahoo_ticker, ticker: m ? m[1] : "", name: corrected ? r._officialName : h.name };
          });
        } catch(e) { console.warn("ticker 보완 실패:", e); }
      }

      // ── 등록 방식에 따라 머지 (base = 최신 localStorage 스냅샷) ──────────────
      let latestPortfolio;
      if (regMode === "merge") {
        // 같은 배치의 추가 스샷 → 같은 계좌에 종목 이어붙이기 (같은 종목명은 새 데이터로 갱신)
        const newNames = new Set(newHoldings.map(h => h.name));
        const others = base.holdings.filter(h => h.account !== targetAccountName);
        const keptSame = base.holdings.filter(h => h.account === targetAccountName && !newNames.has(h.name));
        latestPortfolio = { ...base, updatedAt: new Date().toISOString(), holdings: [...others, ...keptSame, ...newHoldings] };
      } else if (regMode === "replace") {
        // 기존 동일 계좌 종목 전부 제거 후 통째 교체
        const others = base.holdings.filter(h => h.account !== targetAccountName);
        latestPortfolio = { ...base, updatedAt: new Date().toISOString(), holdings: [...others, ...newHoldings] };
        console.log(`계좌 "${targetAccountName}" 교체`);
      } else {
        // 신규 계좌 추가
        latestPortfolio = { ...base, updatedAt: new Date().toISOString(), holdings: [...base.holdings, ...newHoldings] };
      }
      // 이번 배치에서 이 계좌를 건드림 → 같은 배치의 다음 스샷은 merge로 처리
      if (batchCtx) batchCtx.batchTouched.add(targetAccountName);
      // 현금(예수금) 반영: 교체·신규는 그 스샷/엑셀 기준으로 설정(현금 정보 없으면 0) / 같은 배치 병합은 누적
      if (regMode === "replace" || regMode === "new") {
        latestPortfolio.cashByAccount = setCashFor(latestPortfolio, targetAccountName, parsed.cash > 0 ? parsed.cash : 0);
      } else if (parsed.cash > 0) {
        latestPortfolio.cashByAccount = setCashFor(latestPortfolio, targetAccountName, getCashFor(latestPortfolio, targetAccountName) + parsed.cash);
      }
      savePortfolio(latestPortfolio); setPortfolio(latestPortfolio);

      setShowAddPanel(false);
      setUploadMsg(`✅ ${newHoldings.length}개 종목 등록! 현재가 조회 중...`);
      // 다중 이미지 배치 처리 중에는 마지막에 한 번만 현재가 조회 (이미지별 updatePrices 동시 발화 → 덮어쓰기 방지)
      if (!skipPriceUpdate) setTimeout(() => updatePrices(latestPortfolio), 300);
      if (!batchCtx && localCorrections.length) {
        alert("이름 자동 교정:\n" + localCorrections.map(c => `${c.from} → ${c.to}`).join("\n"));
      }
    } catch (e) {
      if (batchCtx) {
        // 배치: 이미지 한 장 실패해도 나머지는 진행. 실패는 모아서 끝에 1회 안내(겁나는 순간 플래시 X)
        batchCtx.errors.push(e.message || "분석 실패");
      } else {
        setUploadMsg(`❌ ${e.message}`);
        setTimeout(() => setUploadMsg(""), 6000);
      }
    }
    setUploading(false);
  };

  // 파일 change 핸들러
  const onFileChange = async (e, addToExisting) => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";          // 같은 파일 재선택 허용
    if (!files.length) return;
    const isImg = (f) => (f.type || "").startsWith("image/") || ["jpg","jpeg","png","webp","gif","heic","heif","bmp"].includes((f.name.split(".").pop() || "").toLowerCase());
    const images = files.filter(isImg);
    const others = files.filter(f => !isImg(f));
    // 스프레드시트 등 비이미지: 즉시 처리
    for (const file of others) await processFile(file, addToExisting);
    // 이미지: 다중 선택분을 미리보기로 모아서 한 장씩 확인(줌) 후 분석
    if (images.length) {
      const items = images.map(f => ({ file: f, url: URL.createObjectURL(f) }));
      setImgPreview({ items, addToExisting });
    }
  };

  // 다중 파일(이미지/엑셀)을 한 계좌로 배치 등록 (계좌명 = 사용자 입력). 이미지 미리보기 이후 / 엑셀은 바로 호출.
  const registerBatch = (files, addToExisting, accountName) => {
    const trimmedName = (accountName || "").trim();
    const preBatch = loadPortfolio();
    const preBatchAccounts = new Set(preBatch.holdings.map(h => h.account).filter(Boolean));
    let ctx = null;
    if (trimmedName) {
      if (preBatchAccounts.has(trimmedName)) {
        const ok = window.confirm(`"${trimmedName}" 계좌가 이미 등록되어 있습니다.\n이 계좌의 종목 정보를 새로 올린 내용으로 교체할까요?`);
        if (!ok) return;
      }
      ctx = { accountName: trimmedName, preBatchAccounts, batchTouched: new Set(), partialFails: [], errors: [], corrections: [] };
    }
    (async () => {
      // 파일별 현재가 조회는 건너뛰고(skipPriceUpdate), 전부 등록 후 누적 포폴로 한 번만 조회
      for (const f of files) await processFile(f, addToExisting, true, ctx);
      if (ctx && (ctx.errors.length || ctx.partialFails.length)) {
        let msg = "";
        if (ctx.errors.length) msg += `⚠️ ${ctx.errors.length}개 파일 분석에 실패했습니다. 잠시 후 그 파일만 다시 등록해주세요.\n(${[...new Set(ctx.errors)].join(" / ")})`;
        if (ctx.partialFails.length) msg += `${msg ? "\n\n" : ""}일부 종목은 이름이 잘려 인식하지 못했습니다:\n${[...new Set(ctx.partialFails)].join(", ")}\n그 종목이 온전히 보이는 화면으로 다시 등록해주세요.`;
        if (msg) alert(msg);
      }
      // 1글자 오타 자동 교정 알림 (사용자가 인지 후 필요시 수정 가능)
      if (ctx && ctx.corrections.length) {
        alert("이름 자동 교정 (OCR 1글자 오차 보정):\n" + ctx.corrections.map(c => `${c.from} → ${c.to}`).join("\n"));
      }
      // 등록한 계좌의 종목만 현재가 조회 (전체 포폴 재조회 안 함 → 토큰 절약)
      setTimeout(() => updatePrices(loadPortfolio(), false, trimmedName || null), 300);
    })();
  };

  // 직접 입력 추가
  const addManualHolding = (h) => {
    const updated = portfolio
      ? { ...portfolio, holdings: [...portfolio.holdings, h], updatedAt: new Date().toISOString() }
      : { holdings: [h], account_type: "혼합", broker: h.account || "", uploadedAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
    savePortfolio(updated);
    setPortfolio(updated);
    setTimeout(() => updatePrices(updated, true), 400); // 새로 추가한 종목만 현재가 조회
  };

  // 종목 삭제
  const removeHolding = (idx) => {
    const updated = { ...portfolio, holdings: portfolio.holdings.filter((_, i) => i !== idx) };
    savePortfolio(updated);
    setPortfolio(updated);
  };

  // 종목 수정/삭제
  const updateHolding = (idx, updated) => {
    let newHoldings;
    if (updated === null) {
      newHoldings = portfolio.holdings.filter((_, i) => i !== idx);
    } else {
      newHoldings = portfolio.holdings.map((h, i) => i === idx ? updated : h);
    }
    const p = { ...portfolio, holdings: newHoldings, updatedAt: new Date().toISOString() };
    savePortfolio(p);
    setPortfolio(p);
  };

  // Yahoo Finance로 단일 종목 현재가 조회
  const fetchYahooPrice = async (ticker) => {
    if (!ticker) return null;
    const url = `/api/yahoo?type=chart&ticker=${encodeURIComponent(ticker)}`;
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 8000);
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(timer);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.error) return null;
      const meta = data.chart?.result?.[0]?.meta;
      if (!meta) return null;

      // currency 검증: 한국 종목(.KS/.KQ)인데 KRW가 아니면 잘못된 데이터
      const isKRTicker = ticker.endsWith(".KS") || ticker.endsWith(".KQ");
      if (isKRTicker && meta.currency && meta.currency !== "KRW") {
        console.warn(`[티커오류] ${ticker}: currency=${meta.currency} (KRW 아님) → 무효`);
        return null;
      }
      // 거래소 검증: 한국 종목인데 KRX/KSC가 아니면 무효
      const exchange = meta.exchangeName || meta.fullExchangeName || "";
      if (isKRTicker && exchange && !["KSC","KOE","KRX","KOSPI","KOSDAQ","KSE"].some(e => exchange.toUpperCase().includes(e))) {
        console.warn(`[티커오류] ${ticker}: exchange=${exchange} → 무효`);
        return null;
      }

      const price = meta.regularMarketPrice || meta.previousClose;
      const prev  = meta.previousClose || meta.chartPreviousClose;
      if (!price || price <= 0) return null;
      const changePct = prev ? ((price - prev) / prev * 100) : 0;
      return { current_price: price, change_pct: changePct };
    } catch(e) { return null; }
  };

  // 종목명으로 티커 조회 (네이버 검색 + 이름 검증)
  // 핵심: 화면 OCR 코드나 검색 1순위를 무검증 신뢰하지 않고, 검색 결과 이름이 실제 일치하는지 확인
  const resolveTickerCodes = async (holdings) => {
    const needTicker = holdings.filter(h => !h.yahoo_ticker);
    if (needTicker.length === 0) return holdings;

    const tickerMap = {};

    // 이름 정규화: 공백·특수문자 제거, 소문자, 자주 잘리는 접미사 무시
    const norm = (s) => (s || "")
      .toUpperCase()
      .replace(/\s+/g, "")
      .replace(/[()[\]{}·.,&]/g, "")
      .replace(/(INDXX|INDEX|PLUS|플러스|액티브|ACTIVE|ETF)$/g, "");

    // 두 이름이 같은 종목인지 검증 (한쪽이 다른 쪽을 충분히 포함하면 일치)
    const nameMatches = (queryName, resultName) => {
      const a = norm(queryName), b = norm(resultName);
      if (!a || !b) return false;
      if (a === b) return true;
      // 짧은 쪽이 긴 쪽에 포함되고, 짧은 쪽 길이가 6자 이상이면 일치로 간주
      const [short, long] = a.length <= b.length ? [a, b] : [b, a];
      return short.length >= 6 && long.includes(short);
    };

    // 1글자 치환/추가/삭제 오타 보정용 헬퍼 (가드: 숫자 동일 + 한글 코어 6자 이상)
    const digitsOf = (s) => (s.match(/\d/g) || []).join("");
    const hangulCount = (s) => (s.match(/[가-힣]/g) || []).length;
    const editDistanceIsOne = (a, b) => {
      if (a === b) return false;
      const la = a.length, lb = b.length;
      if (Math.abs(la - lb) > 1) return false;
      if (la === lb) { // 치환 1회
        let diff = 0;
        for (let i = 0; i < la; i++) { if (a[i] !== b[i]) { if (++diff > 1) return false; } }
        return diff === 1;
      }
      // 삽입/삭제 1회
      const [s, l] = la < lb ? [a, b] : [b, a];
      let i = 0, j = 0, skipped = false;
      while (i < s.length && j < l.length) {
        if (s[i] === l[j]) { i++; j++; }
        else { if (skipped) return false; skipped = true; j++; }
      }
      return true;
    };
    const closeByOneChar = (queryName, resultName) => {
      const a = norm(queryName), b = norm(resultName);
      if (!a || !b) return false;
      if (digitsOf(a) !== digitsOf(b)) return false;                 // 숫자 동일해야 (100/200/150 등 구분 보호)
      if (Math.max(hangulCount(a), hangulCount(b)) < 6) return false; // 한글 코어 6자 미만(코스피/코스닥 등) 제외
      return editDistanceIsOne(a, b);
    };

    await Promise.allSettled(needTicker.map(async h => {
      const tryEndpoints = [
        `/api/naver?type=search&q=${encodeURIComponent(h.name)}`,   // 1차: 네이버 (한국 ETF 정확)
        `/api/yahoo?type=search&q=${encodeURIComponent(h.name)}&region=KR`, // 2차: Yahoo 백업
      ];
      for (const url of tryEndpoints) {
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 8000);
          const res = await fetch(url, { signal: controller.signal });
          clearTimeout(timer);
          if (!res.ok) continue;
          const data = await res.json();
          const quotes = (data.quotes || []).filter(q =>
            q.symbol && (q.symbol.endsWith(".KS") || q.symbol.endsWith(".KQ"))
          );
          if (quotes.length === 0) continue;
          // 이름이 일치하는 결과만 채택 (엉뚱한 종목 차단)
          // 1순위: 정규화 후 완전 일치 / 2순위: 포함 관계(접미사 잘림 대응) → 티커만, 이름 유지
          const exact = quotes.find(q => norm(h.name) === norm(q.longname || q.shortname || ""));
          const inc = exact || quotes.find(q => nameMatches(h.name, q.longname || q.shortname || ""));
          if (inc) { tickerMap[h.name] = { symbol: inc.symbol, officialName: null }; return; }
          // 3순위: 한 글자 오타 보정 (가드 통과 + 후보 단일 + 공식명이 한글일 때만) → 티커 + 이름 교정
          const edCands = quotes.filter(q => closeByOneChar(h.name, q.longname || q.shortname || ""));
          if (edCands.length === 1) {
            const off = edCands[0].longname || edCands[0].shortname || "";
            tickerMap[h.name] = { symbol: edCands[0].symbol, officialName: /[가-힣]/.test(off) ? off : null };
            return;
          }
          // 검색 결과는 있으나 검증 실패 → 다음 엔드포인트 시도
        } catch(e) {}
      }
      // 모든 검색에서 검증 실패 → ticker 미할당 (updatePrices가 이름 기반 검색으로 가격 조회)
    }));

    return holdings.map(h => {
      const t = tickerMap[h.name];
      return { ...h, yahoo_ticker: h.yahoo_ticker || t?.symbol || null, _officialName: t?.officialName || null };
    });
  };

  // Gemini fallback (Yahoo 실패 종목 재시도)
  const updatePricesGeminiFallback = async (pf, onlyMissing = false) => {
    if (!pf?.holdings) { setUpdating(false); return; }
    try {
      const targets = onlyMissing ? pf.holdings.filter(h => !h.current_price) : pf.holdings;
      if (targets.length === 0) { setUpdating(false); return; }
      const chunks = [];
      for (let i = 0; i < targets.length; i += 10) chunks.push(targets.slice(i, i+10));
      let allPrices = [];
      for (const chunk of chunks) {
        const names = chunk.map(h => h.name).join(", ");
        const body = {
          contents: [{ role: "user", parts: [{ text: `다음 한국 ETF/주식의 오늘 현재가를 검색해서 JSON으로만 반환. 마크다운 없이.
{"prices":[{"name":"종목명","current_price":숫자,"change_pct":숫자}]}
대상: ${names}` }] }],
          tools: [{ googleSearch: {} }],
          generationConfig: { maxOutputTokens: 800, temperature: 0, thinkingConfig: { thinkingBudget: 0 } },
        };
        let retries = 2;
        while (retries >= 0) {
          try {
            const res = await fetch(GEMINI_PROXY, { method: "POST", headers: await geminiHeaders(), body: JSON.stringify({ model: "gemini-2.5-flash-lite", body, stream: false }) });
            if (res.status === 503 || res.status === 429) {
              retries--;
              if (retries >= 0) { await new Promise(r => setTimeout(r, 3000)); continue; }
              else break;
            }
            if (!res.ok) break;
            const data = await res.json();
            const text = data.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||"";
            const match = text.replace(/```json|```/g,"").trim().match(/\{[\s\S]*\}/);
            if (match) { const p = JSON.parse(match[0]); if (p.prices) allPrices = [...allPrices, ...p.prices]; }
            break;
          } catch(e) { break; }
        }
      }
      if (allPrices.length === 0) throw new Error("Gemini fallback 실패");
      const updated = { ...pf, updatedAt: new Date().toISOString(),
        holdings: pf.holdings.map(h => {
          const p = allPrices.find(x => x.name === h.name);
          return p ? { ...h, current_price: Number(p.current_price)||h.current_price, change_pct: Number(p.change_pct)||0 } : h;
        }),
      };
      savePortfolio(updated); setPortfolio(updated); saveAllHistoryPoints(updated);
      setUploadMsg(`✅ ${allPrices.length}개 종목 현재가 업데이트 완료 (AI)`);
      setTimeout(() => setUploadMsg(""), 4000);
    } catch(e) {
      setUploadMsg("❌ 현재가 조회 실패 - 잠시 후 다시 시도하세요");
      setTimeout(() => setUploadMsg(""), 5000);
    }
    setUpdating(false);
  };

  // 현재가 업데이트
  // KRW + 6자리 ticker → 네이버 금융 (가장 정확)
  // KRW + ticker 없음  → Gemini Search
  // USD 등 외화        → Yahoo Finance → Gemini fallback
  const updatePrices = async (targetPortfolio, onlyMissing = false, accountFilter = null) => {
    const pf = targetPortfolio || portfolio;
    if (!pf || !pf.holdings) return;
    // onlyMissing: 가격 없는 종목만 / accountFilter: 특정 계좌 종목만 → 조회 후 전체 포폴에 병합
    const fullHoldings = pf.holdings;
    const activeHoldings = fullHoldings.filter(h =>
      (!onlyMissing || !h.current_price) && (!accountFilter || h.account === accountFilter)
    );
    if (activeHoldings.length === 0) return;
    const activePf = { ...pf, holdings: activeHoldings };
    setUpdating(true);
    setUploadMsg(accountFilter ? `📡 ${accountFilter} 현재가 조회 중...` : (onlyMissing ? "📡 신규 종목 현재가 조회 중..." : "📡 현재가 조회 중..."));
    try {
      const isNoPriceAsset = (h) => {
        const lower = (h.name||"").toLowerCase();
        return lower.includes("현금성자산")||lower.includes("현금성")||lower.includes("mmf")
            || lower.includes("머니마켓")||lower.includes("cma")||lower.includes("예수금")
            || lower.includes("수시입출금")||lower.includes("파킹")
            || lower.includes("tdf")||lower.includes("타겟데이트")||lower.includes("로자산배분")
            || lower.includes("자산배분적극")||lower.includes("자산배분안정")||lower.includes("자산배분중립")
            || lower.includes("배분형")||lower.includes("생애주기");
      };
      const isCashName = (n) => {
        const lower = (n||"").toLowerCase();
        return lower.includes("현금성자산")||lower.includes("현금성")||lower.includes("mmf")
            || lower.includes("머니마켓")||lower.includes("cma")||lower.includes("예수금")
            || lower.includes("수시입출금")||lower.includes("파킹");
      };

      const priceableHoldings = activePf.holdings.filter(h => !isNoPriceAsset(h));
      const cashHoldings = activePf.holdings.filter(h => isNoPriceAsset(h)).map(h => {
        if (isCashName(h.name)) return { ...h, current_price: 1, change_pct: 0 };
        return { ...h, current_price: h.current_price || h.avg_price, change_pct: h.change_pct ?? null };
      });

      const isKRW = (h) => !h.currency || h.currency === "KRW";
      const krwHoldings     = priceableHoldings.filter(h => isKRW(h));
      const foreignHoldings = priceableHoldings.filter(h => !isKRW(h));

      // ── [KRW / 네이버 우선] ──────────────────────────────────────────────
      let pricedKRW = [...krwHoldings];
      if (krwHoldings.length > 0) {
        // 6자리 ticker 있는 것 → 네이버
        const KR_CODE = /^\d{6}$/;
        const KR_CODE_EXT = /^(\d{6})\.(KS|KQ)$/; // 000660.KS 형태도 허용
        const getKrCode = (t) => { const m=String(t||'').match(/^(\d{6})(?:\.(KS|KQ))?$/); return m?m[1]:null; };
        const withCode    = krwHoldings.filter(h => getKrCode(h.ticker));
        const withoutCode = krwHoldings.filter(h => !getKrCode(h.ticker));

        let naverPrices = {};
        if (withCode.length > 0) {
          setUploadMsg(`📡 네이버 금융 조회 중 (${withCode.length}개)...`);
          try {
            const codes = withCode.map(h => getKrCode(h.ticker)).join(",");
            const nr = await fetch(`/api/naver?codes=${codes}`);
            if (nr.ok) {
              const nd = await nr.json();
              naverPrices = nd.results || {};
            }
          } catch(e) { console.warn("Naver 조회 오류:", e.message); }
        }

        // 네이버 성공 종목 처리
        const afterNaver = withCode.map(h => {
          const np = naverPrices[getKrCode(h.ticker)];
          return (np && np.currentPrice > 0)
            ? { ...h, current_price: np.currentPrice, change_pct: np.changeRate || 0 }
            : { ...h };
        });

        // 네이버 실패 + ticker 없는 종목 → Gemini Search
        const needGemini = [...afterNaver.filter(h => !h.current_price), ...withoutCode];
        let geminiPrices = [];
        if (needGemini.length > 0) {
          setUploadMsg(`📡 AI 보조 조회 중 (${needGemini.length}개)...`);
          const chunks = [];
          for (let i = 0; i < needGemini.length; i += 10) chunks.push(needGemini.slice(i, i+10));
          for (const chunk of chunks) {
            const names = chunk.map(h => h.name).join(", ");
            const body = {
              contents: [{ role:"user", parts:[{ text:`다음 한국 ETF/주식의 오늘 현재가(원화)를 검색해서 JSON으로만 반환. 마크다운 없이.
{"prices":[{"name":"종목명","current_price":숫자,"change_pct":숫자}]}
대상: ${names}` }] }],
              tools: [{ googleSearch:{} }],
              generationConfig: { maxOutputTokens:1000, temperature:0, thinkingConfig:{thinkingBudget:0} },
            };
            let retries = 2;
            while (retries >= 0) {
              try {
                const gr = await fetch(GEMINI_PROXY, { method:"POST", headers: await geminiHeaders(), body:JSON.stringify({ model:"gemini-2.5-flash-lite", body, stream:false }) });
                if ((gr.status===503||gr.status===429) && retries>0) { retries--; await new Promise(r=>setTimeout(r,3000)); continue; }
                if (!gr.ok) break;
                const gd = await gr.json();
                const gt = gd.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||"";
                const gm = gt.replace(/```json|```/g,"").trim().match(/\{[\s\S]*\}/);
                if (gm) { const gp = JSON.parse(gm[0]); if (gp.prices) geminiPrices=[...geminiPrices,...gp.prices]; }
                break;
              } catch(e) { break; }
            }
          }
        }

        pricedKRW = krwHoldings.map(h => {
          // 네이버 결과 우선
          const naverR = naverPrices[h.ticker];
          if (naverR && naverR.currentPrice > 0)
            return { ...h, current_price: naverR.currentPrice, change_pct: naverR.changeRate || 0 };
          // Gemini 결과
          const geminiR = geminiPrices.find(x => x.name === h.name);
          if (geminiR && Number(geminiR.current_price) > 0)
            return { ...h, current_price: Number(geminiR.current_price), change_pct: Number(geminiR.change_pct)||0 };
          return { ...h };
        });
      }

      // ── [외화 / Yahoo Finance] ──────────────────────────────────────────
      let pricedForeign = [...foreignHoldings];
      if (foreignHoldings.length > 0) {
        setUploadMsg(`📡 해외 종목 ${foreignHoldings.length}개 조회 중...`);
        const withTickers = await resolveTickerCodes(foreignHoldings);
        const results = await Promise.allSettled(
          withTickers.map(async h => {
            if (!h.yahoo_ticker) return { ...h };
            let price = await fetchYahooPrice(h.yahoo_ticker);
            if (!price && h.yahoo_ticker.endsWith(".KS")) {
              const kq = h.yahoo_ticker.replace(".KS",".KQ");
              price = await fetchYahooPrice(kq);
              if (price) h = { ...h, yahoo_ticker: kq };
            }
            return price ? { ...h, current_price: price.current_price, change_pct: price.change_pct } : { ...h };
          })
        );
        pricedForeign = results.map((r,i) => r.status==="fulfilled" ? r.value : withTickers[i]);
        const foreignFailed = pricedForeign.filter(h => !h.current_price);
        if (foreignFailed.length > 0) {
          const tmpPf = { ...pf, holdings: [...pricedForeign, ...pricedKRW, ...cashHoldings] };
          await updatePricesGeminiFallback(tmpPf, true);
          return;
        }
      }

      const allPricedHoldings = [...pricedKRW, ...pricedForeign, ...cashHoldings];
      // 부분 조회(onlyMissing 또는 accountFilter)면 조회한 종목만 전체 포폴에 병합
      const isSubset = onlyMissing || !!accountFilter;
      const mergedHoldings = isSubset
        ? fullHoldings.map(h => {
            const updated = allPricedHoldings.find(x => x.ticker===h.ticker && x.name===h.name && x.account===h.account);
            return updated || h;
          })
        : allPricedHoldings;
      const successCount = allPricedHoldings.filter(h => h.current_price && h.current_price > 0).length;
      const updated = { ...pf, updatedAt: new Date().toISOString(), holdings: mergedHoldings };
      savePortfolio(updated); setPortfolio(updated); saveAllHistoryPoints(updated);
      setUploadMsg(`✅ ${successCount}개 종목 현재가 업데이트 완료`);
      setTimeout(() => setUploadMsg(""), 4000);
    } catch(e) {
      setUploadMsg(`❌ 가격 업데이트 실패: ${e.message}`);
      setTimeout(() => setUploadMsg(""), 5000);
    }
    setUpdating(false);
  };

  const [showDeleteModal, setShowDeleteModal] = useState(false);
  const [viewMode, setViewMode] = useState("all");
  const [sortBy, setSortBy] = useState("name");
  const [sortDir, setSortDir] = useState("desc");

  // 포트폴리오 탭 첫 진입 시 미조회 종목 자동 갱신
  useEffect(() => {
    if (!autoUpdated && portfolio) {
      const hasUnpriced = portfolio.holdings.some(h => !h.current_price);
      if (hasUnpriced) { setAutoUpdated(true); setTimeout(() => updatePrices(), 500); }
    }
  }, []);

  // 계좌 목록
  const accounts = portfolio ? [...new Set(portfolio.holdings.map(h => h.account).filter(Boolean))] : [];

  // 현재 뷰에 따른 종목 필터 + 동일 종목 합산 (전체/계좌별 모두)
  const rawHoldings = (() => {
    if (!portfolio) return [];
    const holdings = viewMode === "all" ? portfolio.holdings : portfolio.holdings.filter(h => h.account === viewMode);
    // 동일 종목명 합산 (RSA 등 구분 없이)
    const map = new Map();
    holdings.forEach(h => {
      const key = (viewMode === "all" ? "" : h.account + "::") + (h.name || h.ticker || "");
      if (map.has(key)) {
        const ex = map.get(key);
        const totalShares = (ex.shares||0) + (h.shares||0);
        const totalCost = (ex.shares||0)*(ex.avg_price||0) + (h.shares||0)*(h.avg_price||0);
        map.set(key, {
          ...ex,
          shares: totalShares,
          avg_price: totalShares > 0 ? totalCost / totalShares : ex.avg_price,
          current_price: h.current_price || ex.current_price,
          _accounts: [...(ex._accounts||[ex.account]), h.account].filter(Boolean),
        });
      } else {
        map.set(key, { ...h, _accounts: [h.account].filter(Boolean) });
      }
    });
    return Array.from(map.values());
  })();

  const visibleHoldings = [...rawHoldings].sort((a, b) => {
    let av, bv;
    if (sortBy === "value") {
      av = (a.shares||0)*(a.current_price||a.avg_price||0);
      bv = (b.shares||0)*(b.current_price||b.avg_price||0);
      return sortDir === "asc" ? av-bv : bv-av;
    } else if (sortBy === "profit") {
      const ac=(a.shares||0)*(a.avg_price||0), bc=(b.shares||0)*(b.avg_price||0);
      av = ac>0?((a.shares||0)*(a.current_price||a.avg_price||0)-ac)/ac*100:0;
      bv = bc>0?((b.shares||0)*(b.current_price||b.avg_price||0)-bc)/bc*100:0;
      return sortDir === "asc" ? av-bv : bv-av;
    } else {
      av = a.name||""; bv = b.name||"";
      return sortDir === "asc" ? av.localeCompare(bv,"ko") : bv.localeCompare(av,"ko");
    }
  });

  const cash = getCashFor(portfolio, viewMode);
  const fxMain = getUsdKrw();
  const totalCost  = visibleHoldings.reduce((s, h) => s + holdingCostKRW(h, fxMain), 0);
  const totalValue = visibleHoldings.reduce((s, h) => s + holdingValueKRW(h, fxMain), 0) + cash;
  const totalReturn = totalCost > 0 ? ((totalValue - totalCost) / totalCost) * 100 : 0;

  // 업로드 패널 - label+input을 항상 DOM에 렌더링 (모바일 sandbox 대응)
  const renderUploadPanel = (addToExisting = false) => {
    return (
      <div>
        {uploading ? (
          <div style={{ textAlign: "center", padding: "36px 20px", background: "#0a0f1a", borderRadius: 14, border: "1px solid #1e293b" }}>
            <Spinner size={34} />
            <div style={{ marginTop: 14, color: "#0ea5e9", fontWeight: 700, fontSize: 16 }}>{uploadMsg}</div>
          </div>
        ) : (
          <div>
            {/* 드래그앤드롭 - PC용 */}
            <div
              onDragOver={e => { e.preventDefault(); setDragOver(true); }}
              onDragLeave={() => setDragOver(false)}
              onDrop={e => {
                e.preventDefault(); setDragOver(false);
                const dropped = Array.from(e.dataTransfer.files || []);
                const isImg = (f) => (f.type||"").startsWith("image/") || ["jpg","jpeg","png","webp","gif","heic","heif","bmp"].includes((f.name.split(".").pop()||"").toLowerCase());
                const imgs = dropped.filter(isImg);
                const sheets = dropped.filter(f => !isImg(f));
                if (imgs.length) setAcctModal({ addToExisting, kind: "image", initialFiles: imgs });
                else if (sheets.length) setAcctModal({ addToExisting, kind: "spreadsheet", initialFiles: sheets });
              }}
              style={{
                border: `2px dashed ${dragOver ? "#0ea5e9" : "#16162a"}`,
                borderRadius: 12, padding: "20px 16px", textAlign: "center",
                background: dragOver ? "#0ea5e911" : "#0a0f1a", marginBottom: 12, transition: "all 0.2s",
              }}
            >
              <div style={{ fontSize: 26, marginBottom: 5 }}></div>
              <div style={{ fontSize: 14, color: "#64748b" }}>PC: 파일을 여기로 드래그</div>
              <div style={{ fontSize: 13, color: "#64748b", marginTop: 2 }}>이미지 · 엑셀(xlsx)</div>
            </div>

            {/* 스크린샷·엑셀 둘 다 계좌명 모달 경유 */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
              <button
                onClick={() => setAcctModal({ addToExisting, kind: "image", initialFiles: [] })}
                style={{
                  padding: "14px 8px", borderRadius: 12, cursor: "pointer", border: "none",
                  background: "linear-gradient(135deg,#0ea5e9,#0369a1)", color: "#fff",
                  fontWeight: 700, fontSize: 15, display: "flex", flexDirection: "column",
                  alignItems: "center", gap: 6, userSelect: "none",
                }}
              >
                <span style={{ fontSize: 24 }}>📷</span>
                <span>갤러리 / 스크린샷</span>
                <span style={{ fontSize:11, opacity:0.7, fontWeight:400 }}>계좌명 입력 후 여러 장</span>
              </button>
              <button
                onClick={() => setAcctModal({ addToExisting, kind: "spreadsheet", initialFiles: [] })}
                style={{
                  padding: "14px 8px", borderRadius: 12, cursor: "pointer", border: "none",
                  background: "linear-gradient(135deg,#10b981,#059669)", color: "#fff",
                  fontWeight: 700, fontSize: 15, display: "flex", flexDirection: "column",
                  alignItems: "center", gap: 6, userSelect: "none",
                }}
              >
                <span style={{ fontSize: 24 }}>📊</span>
                <span>엑셀</span>
                <span style={{ fontSize:11, opacity:0.7, fontWeight:400 }}>계좌명 입력 후 등록</span>
              </button>
            </div>

            <button
              onClick={() => { setShowManual(true); setShowAddPanel(false); }}
              style={{
                width: "100%", padding: "13px", borderRadius: 12, cursor: "pointer",
                background: "#16162a", color: "#e2e8f0", border: "1px solid #334155",
                fontWeight: 700, fontSize: 15, display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
              }}
            >
              ✎ 직접 입력
            </button>
            <div style={{ marginTop: 12, padding: "11px 12px", background: "#0a0f1a", border: "1px solid #1e293b", borderRadius: 10, fontSize: 11, color: "#94a3b8", lineHeight: 1.6 }}>
              <div style={{ color: "#0ea5e9", fontWeight: 700, marginBottom: 5 }}>📷 스크린샷 인식 팁</div>
              <div>· 등록 시 <b style={{color:"#cbd5e1"}}>계좌명을 직접 입력</b>합니다. 한 계좌가 여러 화면에 걸쳐 있으면 <b style={{color:"#cbd5e1"}}>여러 장을 함께 선택</b>하면 한 계좌로 합쳐집니다.</div>
              <div>· 가장 정확: <b style={{color:"#cbd5e1"}}>종목명 + 매수평단가 + 보유수량</b>. 평단가가 없어도 <b style={{color:"#cbd5e1"}}>종목명 + 보유수량 + 매수금액</b>이면 평단가를 자동 계산합니다.</div>
              <div>· 종목명이 잘리거나(…) 보유수량이 안 보이면 그 종목은 인식되지 않습니다.</div>
            </div>
            {addToExisting && (
              <button onClick={() => setShowAddPanel(false)} style={{ width: "100%", marginTop: 8, padding: "10px", background: "none", border: "none", color: "#94a3b8", fontSize: 15, cursor: "pointer" }}>
                취소
              </button>
            )}
          </div>
        )}
      </div>
    );
  };

  return (
    <div style={{ padding: "0 4px" }}>
      {/* 업로드/갱신 진행 토스트 */}
      {(uploading || updating || uploadMsg) && (
        <div style={{
          position: "fixed", bottom: 70, left: "50%", transform: "translateX(-50%)",
          zIndex: 999, maxWidth: 380, width: "90%",
          background: (uploading || updating) ? "linear-gradient(135deg,#0d2040,#1a0d35)" : uploadMsg.startsWith("❌") ? "linear-gradient(135deg,#2a0a0a,#1a0505)" : "linear-gradient(135deg,#0a2a1a,#051510)",
          border: `1px solid ${(uploading||updating) ? "#1a3a5a" : uploadMsg.startsWith("❌") ? "#3a1a1a" : "#1a3a28"}`,
          borderRadius: 16, padding: "14px 20px",
          display: "flex", alignItems: "center", gap: 12,
          boxShadow: "0 8px 32px #00000066",
        }}>
          {(uploading || updating) && <Spinner size={18} />}
          <div style={{ color: (uploading||updating) ? "#22d3ee" : uploadMsg.startsWith("❌") ? "#f87171" : "#22d3a0", fontWeight: 700, fontSize: 14, flex: 1 }}>
            {uploadMsg || (uploading ? "분석 중..." : "현재가 조회 중...")}
          </div>
        </div>
      )}

      {editTarget && (
        <EditHoldingModal
          holding={editTarget.holding}
          onClose={() => setEditTarget(null)}
          onSave={(updated) => { updateHolding(editTarget.index, updated); setEditTarget(null); }}
        />
      )}
      {showManual && (
        <ManualInputModal
          onClose={() => setShowManual(false)}
          onAdd={h => { addManualHolding(h); setShowManual(false); }}
          existingAccounts={portfolio ? [...new Set(portfolio.holdings.map(h=>h.account).filter(Boolean))] : []}
          defaultAccount={viewMode !== "all" ? viewMode : ""}
        />
      )}
      {acctModal && (
        <AccountInputModal
          kind={acctModal.kind || "image"}
          existingAccounts={portfolio ? [...new Set(portfolio.holdings.map(h=>h.account).filter(Boolean))] : []}
          initialFiles={acctModal.initialFiles || []}
          onCancel={() => setAcctModal(null)}
          onSubmit={(name, files) => {
            const addToExisting = acctModal.addToExisting;
            const kind = acctModal.kind || "image";
            setAcctModal(null);
            if (kind === "spreadsheet") {
              registerBatch(files, addToExisting, name); // 엑셀/CSV: 미리보기 없이 바로 등록
            } else {
              const items = files.map(f => ({ file: f, url: URL.createObjectURL(f) }));
              setImgPreview({ items, addToExisting, accountName: name }); // 이미지: 줌/스와이프 미리보기 단계로
            }
          }}
        />
      )}
      {imgPreview && (
        <ImageZoomPreview
          items={imgPreview.items}
          onCancel={() => { imgPreview.items.forEach(it => { try { URL.revokeObjectURL(it.url); } catch {} }); setImgPreview(null); }}
          onConfirm={(files) => {
            const { items, addToExisting, accountName } = imgPreview;
            setImgPreview(null);
            items.forEach(it => { try { URL.revokeObjectURL(it.url); } catch {} });
            registerBatch(files, addToExisting, accountName);
          }}
        />
      )}
      {cashPrompt && (() => {
        const { scenario, account, amount, curCash, updated, apply } = cashPrompt;
        const opts = scenario === "sell"
          ? [{ label:"예수금에 추가", cash: curCash + amount, primary:true }, { label:"예수금 변경 없음", cash: null }]
          : scenario === "buy-over"
            ? [{ label:"예수금 0원으로 변경", cash: 0, primary:true }, { label:"예수금 변경 없음", cash: null }]
            : [{ label:"예수금에서 차감", cash: curCash - amount, primary:true }, { label:"예수금 변경 없음", cash: null }];
        const desc = scenario === "buy-over"
          ? `매수금액 ₩${Math.round(amount).toLocaleString()}이 예수금(₩${Math.round(curCash).toLocaleString()})보다 큽니다.`
          : scenario === "sell"
            ? `매도금액 ₩${Math.round(amount).toLocaleString()}`
            : `매수금액 ₩${Math.round(amount).toLocaleString()}`;
        const choose = (cash) => {
          const final = cash === null ? updated : { ...updated, cashByAccount: setCashFor(portfolio, account, cash) };
          setCashPrompt(null);
          apply(final);
        };
        return (
          <div style={{ position:"fixed", inset:0, zIndex:9999, background:"rgba(0,0,0,0.85)", display:"flex", alignItems:"center", justifyContent:"center", padding:18 }}>
            <div style={{ width:"100%", maxWidth:360, background:"#0f0f18", border:"1px solid #1e293b", borderRadius:16, padding:20 }}>
              <div style={{ fontSize:15, fontWeight:800, color:"#e2e8f0", marginBottom:6 }}>예수금 처리</div>
              <div style={{ fontSize:13, color:"#94a3b8", marginBottom:4 }}>{account}</div>
              <div style={{ fontSize:13, color:"#cbd5e1", marginBottom:16, lineHeight:1.5 }}>{desc}<br/>예수금을 어떻게 할까요?</div>
              <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                {opts.map((o, i) => (
                  <button key={i} onClick={()=>choose(o.cash)} style={{
                    width:"100%", padding:"13px", borderRadius:10, border:"none", fontSize:14, fontWeight:700, cursor:"pointer",
                    background: o.primary ? "#22d3a0" : "#16162a", color: o.primary ? "#0a0a14" : "#94a3b8",
                  }}>{o.label}</button>
                ))}
              </div>
            </div>
          </div>
        );
      })()}
      {showTradeModal && (
        <TradeModal
          mode={showTradeModal}
          holdings={portfolio?.holdings || []}
          accounts={portfolio ? [...new Set(portfolio.holdings.map(h=>h.account).filter(Boolean))] : []}
          defaultAccount={viewMode !== "all" ? viewMode : ""}
          currentCash={getCashFor(portfolio, viewMode !== "all" ? viewMode : "")}
          onClose={() => setShowTradeModal(null)}
          onConfirm={(trade) => {
            const amount = (trade.shares || 0) * (trade.price || 0);
            const acct = trade.account;
            const curCash = getCashFor(portfolio, acct);
            // 1. 보유내역 변경 계산 (현금은 아직 손대지 않음)
            let updated, isNew = false, baseMsg = "";
            if (trade.type === "buy") {
              const idx = portfolio.holdings.findIndex(h => h.name === trade.name && h.account === acct);
              let newHoldings;
              if (idx >= 0) {
                const h = portfolio.holdings[idx];
                const totalShares = (h.shares||0) + trade.shares;
                const newAvg = ((h.shares||0)*(h.avg_price||0) + trade.shares*trade.price) / totalShares;
                newHoldings = portfolio.holdings.map((h2, i) => i===idx ? {...h2, shares:totalShares, avg_price:newAvg} : h2);
              } else {
                isNew = true;
                newHoldings = [...portfolio.holdings, { name:trade.name, ticker:"", shares:trade.shares, avg_price:trade.price, currency:"KRW", sector:"기타", account:acct }];
              }
              updated = { ...portfolio, holdings: newHoldings, updatedAt: new Date().toISOString() };
              baseMsg = `✅ 매수 반영: ${trade.name} ${trade.shares}주`;
            } else {
              const idx = portfolio.holdings.findIndex(h => h.name === trade.name && h.account === acct);
              if (idx < 0) { setShowTradeModal(null); return; }
              const h = portfolio.holdings[idx];
              const remain = (h.shares||0) - trade.shares;
              const newHoldings = remain <= 0 ? portfolio.holdings.filter((_, i) => i !== idx) : portfolio.holdings.map((h2, i) => i===idx ? {...h2, shares:remain} : h2);
              updated = { ...portfolio, holdings: newHoldings, updatedAt: new Date().toISOString() };
              baseMsg = remain<=0 ? `✅ 전량매도: ${trade.name} 삭제됨` : `✅ 매도 반영: ${trade.name} 잔여 ${remain}주`;
            }
            setShowTradeModal(null);
            // 2. 적용 함수
            const apply = (finalUpdated) => {
              savePortfolio(finalUpdated); setPortfolio(finalUpdated);
              setUploadMsg(baseMsg);
              if (isNew) setTimeout(() => updatePrices(finalUpdated, true), 300); // 신규 종목만 시세 조회
              setTimeout(() => setUploadMsg(""), 3000);
            };
            // 3. 예수금 처리 선택지 - 매도는 항상, 매수는 예수금>0일 때만
            if (amount > 0 && (trade.type === "sell" || curCash > 0)) {
              const scenario = trade.type === "sell" ? "sell" : (amount > curCash ? "buy-over" : "buy-normal");
              setCashPrompt({ scenario, account: acct, amount, curCash, updated, apply });
            } else {
              apply(updated);
            }
          }}
        />
      )}

      {/* 포폴 없음 > 초기 등록 */}
      {!portfolio ? (
        <div>
          <div style={{ textAlign: "center", marginBottom: 20 }}>
            <div style={{ fontSize: 40, marginBottom: 8 }}>📊</div>
            <div style={{ fontSize: 16, fontWeight: 700, color: "#e2e8f0", marginBottom: 4 }}>포트폴리오 등록</div>
            <div style={{ fontSize: 14, color: "#94a3b8" }}>스크린샷, 엑셀, 직접입력 중 편한 방법으로 추가하세요</div>
          </div>
          {renderUploadPanel(false)}
        </div>
      ) : (
        <div>
          {/* 계좌 탭 + 편집 버튼 */}
          <div className="hscroll" style={{ display: "flex", gap: 4, marginBottom: 12, overflowX: "auto", paddingBottom: 6, borderBottom: "1px solid #12121f" }}>
            <button onClick={() => setViewMode("all")} style={{
              padding: "7px 12px", border: "none", background: "transparent",
              color: viewMode === "all" ? "#e8eaf0" : "#94a3b8",
              fontSize: 13, fontWeight: viewMode === "all" ? 700 : 500, cursor: "pointer",
              whiteSpace: "nowrap", flexShrink: 0,
              borderBottom: viewMode === "all" ? "2px solid #4f6ef7" : "2px solid transparent",
              transition: "all 0.15s",
            }}>전체</button>
            {accounts.map(acc => (
              <div key={acc} style={{ display: "flex", alignItems: "center", flexShrink: 0 }}>
                <button onClick={() => setViewMode(acc)} style={{
                  padding: "7px 10px", border: "none", background: "transparent",
                  color: viewMode === acc ? "#e8eaf0" : "#94a3b8",
                  fontSize: 13, fontWeight: viewMode === acc ? 700 : 500, cursor: "pointer",
                  whiteSpace: "nowrap",
                  borderBottom: viewMode === acc ? "2px solid #22d3a0" : "2px solid transparent",
                  transition: "all 0.15s",
                }}>{acc}</button>
                <button onClick={() => {
                  const newName = prompt("계좌 탭 이름 변경:", acc);
                  if (!newName || newName.trim() === acc) return;
                  const trimmed = newName.trim();
                  const updated = { ...portfolio, holdings: portfolio.holdings.map(h => h.account === acc ? { ...h, account: trimmed } : h) };
                  savePortfolio(updated); setPortfolio(updated);
                  if (viewMode === acc) setViewMode(trimmed);
                }} style={{ background: "none", border: "none", color: "#475569", fontSize: 10, cursor: "pointer", padding: "0 2px", marginBottom: 2 }}>✎</button>
              </div>
            ))}
          </div>

          {/* 요약 카드 */}
          <div style={{
            background: "#0f0f18",
            border: "1px solid #16162a",
            borderRadius: 18, padding: "20px 18px 16px", marginBottom: 12,
          }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 16 }}>
              <div>
                <div style={{ fontSize: 10, color: "#3a3a6a", fontWeight: 700, letterSpacing: 2.5, marginBottom: 4, textTransform:"uppercase" }}>
                  {viewMode === "all" ? "전체 포트폴리오" : viewMode}
                </div>
                <div style={{ fontSize: 10, color: "#475569" }}>{new Date(portfolio.updatedAt).toLocaleString("ko-KR")}</div>
              </div>
              <div style={{ display: "flex", gap: 6 }}>
                <button onClick={() => updatePrices()} disabled={updating} style={{
                  background: "#0f0f18", color: updating ? "#2a2a48" : "#22d3ee",
                  border: "1px solid #1a3050", borderRadius: 8, padding: "6px 11px",
                  cursor: updating ? "not-allowed" : "pointer", fontSize: 12, fontWeight: 600,
                  display: "flex", alignItems: "center", gap: 4,
                }}>
                  {updating ? <Spinner size={11} /> : "🔄"} 가격
                </button>
                <button onClick={() => setShowDeleteModal(true)} style={{
                  background: "#0f0f18", color: "#f87171",
                  border: "1px solid #5a2530", borderRadius: 8, padding: "6px 11px",
                  cursor: "pointer", fontSize: 13,
                }}>🗑</button>
              </div>
            </div>

            {/* 계좌 삭제 모달 */}
            {showDeleteModal && (() => {
              const accs = [...new Set(portfolio.holdings.map(h=>h.account).filter(Boolean))];
              const targetAcc = viewMode !== "all" ? viewMode : null;
              return (
                <div style={{ position:"fixed", inset:0, background:"#00000088", zIndex:999, display:"flex", alignItems:"center", justifyContent:"center", padding:24 }}>
                  <div style={{ background:"#16162a", borderRadius:16, padding:24, width:"100%", maxWidth:340, border:"1px solid #334155" }}>
                    <div style={{ fontSize:16, fontWeight:700, color:"#e2e8f0", marginBottom:16 }}>계좌 삭제</div>
                    {targetAcc ? (
                      <>
                        <div style={{ fontSize:15, color:"#94a3b8", marginBottom:20 }}>
                          <span style={{ color:"#ef4444", fontWeight:700 }}>{targetAcc}</span> 계좌를 삭제하시겠습니까?
                        </div>
                        <div style={{ display:"flex", gap:8 }}>

const ADV_CACHE_KEY = "investiq_advisor_chat_v1";

function Advisor() {
  const [loading, setLoading]       = useState(false);
  const [question, setQuestion]     = useState("");
  // localStorage 캐시 초기 로드 ('내용 삭제' 전까진 유지, 토큰 절약)
  const [chatHistory, setChatHistory] = useState(() => {
    try { return JSON.parse(localStorage.getItem(ADV_CACHE_KEY) || "[]"); } catch { return []; }
  });
  const portfolio = loadPortfolio();

  // chatHistory 변경 시 localStorage 저장 (스트리밍 도중 응답도 보존)
  React.useEffect(() => {
    try {
      if (chatHistory.length) localStorage.setItem(ADV_CACHE_KEY, JSON.stringify(chatHistory));
      else localStorage.removeItem(ADV_CACHE_KEY);
    } catch(e) {}
  }, [chatHistory]);

  const clearChat = () => {
    if (window.confirm("AI 조언 대화 내용을 모두 지울까요?")) setChatHistory([]);
  };

  const getAdvice = async (q, isRetry = false) => {
    if (!q) return;
    setLoading(true);
    const portfolioStr = portfolio
      ? portfolio.holdings.map(h => `${h.name}(${h.ticker}) ${h.shares}주 평단${h.avg_price}`).join(", ")

    const insightCtx = getMarketInsightContext(1500); // 앱 내 시장 인사이트 재사용
    const insightDateStr = fmtInsightDate(getMarketInsightDate());
    if (!isRetry) {
      setChatHistory(prev => [...prev, { role: "user", content: q }, { role: "ai", content: "" }]);
      setQuestion("");
    } else {
      // 재시도 시 마지막 AI 응답만 초기화
      setChatHistory(prev => { const u = [...prev]; u[u.length-1] = { role: "ai", content: "" }; return u; });
    }
    try {
      await callGeminiStream({
        maxTokens: 8000,
        useSearch: false,
        system: `당신은 실전 투자 어드바이저입니다. 아래 제공된 [시장 인사이트]와 포트폴리오를 근거로 답변하세요. 별도 웹 검색은 하지 말고, 인사이트에 없는 내용은 일반 투자 원칙으로 답하되 필요하면 '최신 확인 필요'로 표기하세요.

규칙:

    - 해당 채권형/혼합형의 채권 수익률 전망이 부정적인 경우 (예: 금리 인상 전망으로 채권가격 하락 예상)

${SOURCE_RULES}

[!] 참고용. 투자 손실 책임은 투자자 본인.`,

        onChunk: (text) => {

function Settings() {
  const restoreInputRef = useRef(null);
  const [userEmail, setUserEmail] = useState("");
  useEffect(() => {
    supabaseClient.auth.getUser().then(({ data }) => setUserEmail(data?.user?.email || ""));
  }, []);

  // 백업/복원 대상 = 영구 데이터만 (캐시류 제외)
  const isBackupKey = (k) =>
    k === "portfolio_v1" ||
    k.startsWith("portfolio_history") ||
    k === "investiq_rebalance_targets_v1" ||
    k === "history_period";

  const handleBackup = () => {
    const dump = {};
    Object.keys(localStorage).filter(isBackupKey).forEach(k => { dump[k] = localStorage.getItem(k); });
    if (Object.keys(dump).length === 0) { alert("백업할 데이터가 없습니다."); return; }
    const payload = { _app: "InvestIQ", _exportedAt: new Date().toISOString(), data: dump };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `investiq-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const handleRestoreFile = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let data;
      try {
        const parsed = JSON.parse(reader.result);
        data = parsed.data || parsed; // 구형식 호환
        if (!data || typeof data !== "object") throw new Error();
      } catch (e) {
        alert("복원 실패: 올바른 InvestIQ 백업 파일이 아닙니다.");
        return;
      }
      if (!window.confirm("백업 파일로 복원할까요?\n이 기기의 포트폴리오·히스토리·리밸런싱 설정이 덮어쓰기됩니다.")) return;
      Object.keys(data).forEach(k => { if (isBackupKey(k) && data[k] != null) localStorage.setItem(k, data[k]); });
      alert("복원이 완료되었습니다. 앱을 새로고침합니다.");
      window.location.reload();
    };
    reader.readAsText(file);
  };

  const handleLogout = async () => {
    if (!window.confirm("로그아웃할까요?")) return;
    await supabaseClient.auth.signOut();
    window.location.reload();
  };

  return (
    <div style={{ padding: "0 4px" }}>

      {/* 계정 */}

        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:10 }}>
          <div style={{ fontSize:14, color:"#94a3b8", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
            {userEmail || "—"}
          </div>
          <button onClick={handleLogout} style={{ flexShrink:0, padding:"8px 14px", borderRadius:9, background:"none", border:"1px solid #334155", color:"#94a3b8", fontSize:13, fontWeight:600, cursor:"pointer" }}>
            로그아웃
          </button>
        </div>
      </div>

      {/* 히스토리 주기 설정 */}
      <div style={{ background:"#0f0f18", border:"1px solid #1e293b", borderRadius:14, padding:20, marginBottom:16 }}>
        <div style={{ fontSize:13, color:"#10b981", fontWeight:700, letterSpacing:2, marginBottom:4 }}>수익률 기록 주기</div>
        <div style={{ fontSize:13, color:"#64748b", marginBottom:14 }}>가격 새로고침 시 히스토리 저장 주기</div>

            const cur = localStorage.getItem("history_period")||"daily";
            return (
              <button key={p.id} onClick={() => { localStorage.setItem("history_period",p.id); window.location.reload(); }} style={{
                flex:1, padding:"10px 4px", borderRadius:10,
                border:`1px solid ${cur===p.id?"#10b981":"#2a2a48"}`,
