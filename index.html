// ---------- 안전한 JSON 파싱 ----------
function safeParseJSON(text) {
  // 마크다운 코드블록 제거
  let cleaned = text.replace(/```json\s*/gi, "").replace(/```\s*/g, "").trim();
  // JSON 블록 추출 시도
  const match = cleaned.match(/\{[\s\S]*\}/);
  if (match) cleaned = match[0];
  try {
    return JSON.parse(cleaned);
  } catch (e) {
    // 끊긴 JSON 복구 시도: 열린 괄호/따옴표 닫기
    let fixed = cleaned;
    // 문자열이 끊긴 경우 따옴표 닫기
    const quoteCount = (fixed.match(/(?<!\\)"/g) || []).length;
    if (quoteCount % 2 !== 0) fixed += '"';
    // 배열/오브젝트 닫기
    const opens = (fixed.match(/\[|\{/g) || []).length;
    const closes = (fixed.match(/\]|\}/g) || []).length;
    for (let i = 0; i < opens - closes; i++) fixed += i % 2 === 0 ? "]" : "}";
    try {
      return JSON.parse(fixed);
    } catch (e2) {
      throw new Error("JSON 파싱 실패. AI 응답이 올바르지 않습니다.");
    }
  }
}

// ---------- Gemini API 스트리밍 호출 ----------
async function callGeminiStream({ system, user, maxTokens = 2000, useSearch = false, onChunk, _retry = 0 }) {
  const apiKey = getApiKey();
  if (!apiKey) throw new Error("API 키가 설정되지 않았습니다. 설정 탭에서 Gemini API 키를 입력해주세요.");

  // 검색+JSON(시장인사이트): flash 필수 / 순수텍스트(AI조언): flash-lite
  const model = useSearch ? GEMINI_MODEL : GEMINI_MODEL_FAST;
  const contents = [];
  if (system) contents.push({ role: "user", parts: [{ text: `[시스템 지시]\n${system}\n\n[사용자 질문]\n${user}` }] });
  else contents.push({ role: "user", parts: [{ text: user }] });

  const body = { contents, generationConfig: { maxOutputTokens: maxTokens, temperature: 0.7, ...(useSearch ? {} : { thinkingConfig: { thinkingBudget: 0 } }) } };
  if (useSearch) body.tools = [{ googleSearch: {} }];

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse&key=${apiKey}`;
  let res;
  try {
    res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
  } catch (netErr) {
    // network error (Failed to fetch) 재시도
    if (_retry < 2) {
      await new Promise(r => setTimeout(r, 2000 * (_retry + 1)));
      return callGeminiStream({ system, user, maxTokens, useSearch, onChunk, _retry: _retry + 1 });
    }
    throw new Error("network error");
  }
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    const msg = err.error?.message || `HTTP ${res.status}`;
    // 과부하(429/503) 시 최대 3회 재시도
    if ((res.status === 429 || res.status === 503) && _retry < 3) {
      const delay = (res.status === 429 ? 5000 : 2000) * (_retry + 1);
      onChunk && onChunk(`[재시도 중... ${_retry + 1}/3]`);
      await new Promise(r => setTimeout(r, delay));
      return callGeminiStream({ system, user, maxTokens, useSearch, onChunk, _retry: _retry + 1 });
    }
    throw new Error(msg);
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let fullText = "";
  let buf = "";

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const lines = buf.split("\n");
    buf = lines.pop();
    for (const line of lines) {
      if (!line.startsWith("data: ")) continue;
      const json = line.slice(6).trim();
      if (json === "[DONE]") continue;
      try {
        const parsed = JSON.parse(json);
        if (parsed.error) {
          const errMsg = parsed.error.message || "";
          // 스트리밍 중 과부하 에러도 재시도
          if ((parsed.error.code === 429 || parsed.error.code === 503) && _retry < 3) {
            await new Promise(r => setTimeout(r, 2000 * (_retry + 1)));
            return callGeminiStream({ system, user, maxTokens, useSearch, onChunk, _retry: _retry + 1 });
          }
          throw new Error(errMsg);
        }
        const chunk = parsed.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("") || "";
        if (chunk) { fullText += chunk; onChunk && onChunk(fullText); }
      } catch (e) { if (e.message && !e.message.includes("JSON")) throw e; }
    }
  }
  return fullText;
}

// ---------- Gemini API 일반 호출 (이미지 등 스트리밍 불필요한 경우) ----------
async function callGemini({ system, user, maxTokens = 2000, useSearch = false }) {
  const apiKey = getApiKey();
  if (!apiKey) throw new Error("API 키가 설정되지 않았습니다. 설정 탭에서 Gemini API 키를 입력해주세요.");

  const model = useSearch ? GEMINI_MODEL : GEMINI_MODEL_FAST;
  const contents = [];
  if (system) contents.push({ role: "user", parts: [{ text: `[시스템 지시]\n${system}\n\n[사용자 질문]\n${user}` }] });
  else contents.push({ role: "user", parts: [{ text: user }] });

  const body = { contents, generationConfig: { maxOutputTokens: maxTokens, temperature: 0.7, ...(useSearch ? {} : { thinkingConfig: { thinkingBudget: 0 } }) } };
  if (useSearch) body.tools = [{ googleSearch: {} }];

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("") || "";
}

async function callGeminiWithImage({ system, user, imageBase64, mediaType, maxTokens = 2000 }) {
  const apiKey = getApiKey();
  if (!apiKey) throw new Error("API 키가 설정되지 않았습니다. 설정 탭에서 Gemini API 키를 입력해주세요.");

  const parts = [];
  if (system) parts.push({ text: `[시스템 지시]\n${system}\n\n` });
  parts.push({ inlineData: { mimeType: mediaType, data: imageBase64 } });
  parts.push({ text: user });

  const body = {
    contents: [{ role: "user", parts }],
    generationConfig: { maxOutputTokens: maxTokens, temperature: 0.3, thinkingConfig: { thinkingBudget: 0 } },
  };

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.candidates?.[0]?.content?.parts?.map(p => p.text || "").join("") || "";
}

// 기존 함수명 호환성 유지
async function callClaude({ system, user, maxTokens = 1000 }) {
  return callGemini({ system, user, maxTokens, useSearch: false });
}
async function callClaudeWithSearch({ system, user, maxTokens = 2000 }) {
  return callGemini({ system, user, maxTokens, useSearch: true });
}
async function callClaudeWithImage({ system, user, imageBase64, mediaType, maxTokens = 1500 }) {
  return callGeminiWithImage({ system, user, imageBase64, mediaType, maxTokens });
}

function loadPortfolio() {
  try {
    const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    return stored || PRESET_PORTFOLIO;
  } catch { return PRESET_PORTFOLIO; }
}
function savePortfolio(p) {
  if (p === null) localStorage.removeItem(STORAGE_KEY);
  else localStorage.setItem(STORAGE_KEY, JSON.stringify(p));
}


// ---------- UI 공통 ----------
function Spinner({ size = 20 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" style={{ animation: "spin 1s linear infinite", display: "block" }}>
      <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" strokeWidth="3" strokeDasharray="31.4" strokeDashoffset="10" />
    </svg>
  );
}

function Badge({ children, color }) {
  return (
    <span style={{
      background: color + "22", color, border: `1px solid ${color}44`,
      borderRadius: 4, padding: "2px 8px", fontSize: 13, fontWeight: 700, letterSpacing: 1,
    }}>
      {children}
    </span>
  );
}

function MarketInsight({ onRefreshAll }) {
  // localStorage 캐시 초기 로드
  const loadCachedResults = () => {
    const cached = {};
    const cachedTimes = {};
    const tabs = ["summary","kr","us","asia","europe","commodities","crypto","ipo"];
    tabs.forEach(tabId => {
      try {
        const item = localStorage.getItem(`market_cache_${tabId}`);
        if (item) {
          const { data, time } = JSON.parse(item);
          cached[tabId] = data;
          cachedTimes[tabId] = new Date(time);
        }
      } catch(e) {}
    });
    return { cached, cachedTimes };
  };

  const { cached: initCache, cachedTimes: initTimes } = loadCachedResults();
  const [activeTab, setActiveTab] = useState("summary");
  const [results, setResults]     = useState(initCache);
  const [loading, setLoading]     = useState(new Set()); // 탭별 독립 로딩
  const [errors, setErrors]       = useState({});
  const [updatedAt, setUpdatedAt] = useState(initTimes);

  const isLoading = (tabId) => loading.has(tabId);
  const setTabLoading = (tabId, val) => setLoading(prev => {
    const next = new Set(prev);
    val ? next.add(tabId) : next.delete(tabId);
    return next;
  });

  const fetchTab = async (tabId, retryCount = 0) => {
    setTabLoading(tabId, true);
    setErrors(e => ({ ...e, [tabId]: "" }));
    try {
      const today = new Date().toLocaleDateString("ko-KR");
      const timeoutMs = (tabId === "summary" || tabId === "commodities") ? 90000 : 60000;
      const timeoutPromise = new Promise((_, rej) => setTimeout(() => rej(new Error(`타임아웃 (${timeoutMs/1000}초)`)), timeoutMs));
      const text = await Promise.race([
        callGeminiStream({
          maxTokens: 6000,
          useSearch: true,
          system: `You are a global investment analyst with real-time market data access. CRITICAL RULES:
1. Search the web for TODAY's or YESTERDAY's market data ONLY. Never use data older than 2 days.
2. For index values (KOSPI, NASDAQ etc), find the most recent actual price from today's trading session.
3. Your ENTIRE response must be ONLY a valid JSON object
4. Start your response IMMEDIATELY with { and end with }
5. ABSOLUTELY NO text before or after the JSON
6. NO markdown, NO code blocks, NO backticks
7. NO citations like [1] [2] or [cite:...] anywhere
8. All string values must be in Korean (한국어)
9. Keep each string value concise`,
          user: MARKET_PROMPTS[tabId](today),
        }),
        timeoutPromise,
      ]);
      let parsed;
      try {
        let clean = text
          .replace(/```json\s*/gi, "").replace(/```\s*/g, "")
          .replace(/\[cite[^\]]*\]/g, "").replace(/\[source[^\]]*\]/g, "")
          .replace(/\[\d+\]/g, "").replace(/\[\d+,\s*\d+[^\]]*\]/g, "")
          .replace(/\.\s*\[cite/g, ". ").trim();
        const firstBrace = clean.indexOf("{");
        const lastBrace = clean.lastIndexOf("}");
        if (firstBrace === -1 || lastBrace === -1) throw new Error("No JSON");
        clean = clean.slice(firstBrace, lastBrace + 1);
        try { parsed = JSON.parse(clean); }
        catch {
          const suffixes = ["}", "]}", "}]}", "}]}}"];
          for (const s of suffixes) { try { parsed = JSON.parse(clean + s); break; } catch {} }
          if (!parsed) {
            const lc = clean.lastIndexOf(",");
            if (lc > 0) {
              const t2 = clean.slice(0, lc);
              for (const s of suffixes) { try { parsed = JSON.parse(t2 + s); break; } catch {} }
            }
          }
          if (!parsed) {
            if (retryCount < 2) {
              setTabLoading(tabId, false);
              setTimeout(() => fetchTab(tabId, retryCount + 1), 2000);
              return;
            }
            parsed = { summary: "분석 결과를 파싱하지 못했습니다. 다시 시도해주세요.", _raw: true };
          }
        }
      } catch {
        if (retryCount < 2) {
          setTabLoading(tabId, false);
          setTimeout(() => fetchTab(tabId, retryCount + 1), 2000);
          return;
        }
        parsed = { summary: "분석 중 오류가 발생했습니다. 다시 시도해주세요.", _raw: true };
      }
      setResults(r => ({ ...r, [tabId]: parsed }));
      setUpdatedAt(u => ({ ...u, [tabId]: new Date() }));
      try { localStorage.setItem(`market_cache_${tabId}`, JSON.stringify({ data: parsed, time: new Date().toISOString() })); } catch(e) {}
    } catch(e) {
      if (retryCount < 2) {
        setTabLoading(tabId, false);
        setTimeout(() => fetchTab(tabId, retryCount + 1), 3000);
        return;
      }
      setErrors(er => ({ ...er, [tabId]: "분석 실패: "+e.message }));
    } finally {
      setTabLoading(tabId, false);
    }
  };

const PIE_COLORS = ["#0ea5e9","#7c3aed","#f59e0b","#10b981","#ef4444","#ec4899","#f97316","#06b6d4","#84cc16","#6b7280","#8b78f5","#22d3a0","#fb923c","#fbbf24"];

function guessRegion(name) {
  if (!name) return "기타";
  const n = name.toUpperCase();
  if (n.includes("미국")||n.includes("S&P")||n.includes("나스닥")||n.includes("빅테크")||n.includes("우주테크")||n.includes("배당다우")||n.includes("테크TOP")||n.includes("서학개미")) return "미국";
  if (n.includes("차이나")||n.includes("중국")) return "중국 중국";
  if (n.includes("인도")||n.includes("빌리언")) return "인도 인도";
  if (n.includes("글로벌")||n.includes("TOP4")||n.includes("원자력")||n.includes("K방산")||n.includes("조선")) return "글로벌";
  return "한국";
}

function getSectorLabel(sector, name) {
  const n = (name||"").toUpperCase();
  if (n.includes("삼성전자")) return "반도체";
  if (n.includes("TDF")||n.includes("타겟데이트")||n.includes("로자산배분")||n.includes("자산배분")) return "배당·채권";
  if (n.includes("AI")||n.includes("인공지능")||n.includes("로보")) return "AI·로보틱스";
  if (n.includes("반도체")) return "반도체";
  if (n.includes("빅테크")||n.includes("테크TOP")) return "미국빅테크";
  if (n.includes("S&P")||n.includes("나스닥")) return "미국지수";
  if (n.includes("전력")||n.includes("인프라")) return "전력인프라";
  if (n.includes("원자력")) return "원자력";
  if (n.includes("방산")||n.includes("조선")) return "방산·조선";
  if (n.includes("2차전지")) return "2차전지";
  if (n.includes("금현물")||n.includes("구리실물")) return "금·원자재";
  if (n.includes("채권")||n.includes("배당")) return "배당·채권";
  if (n.includes("차이나")||n.includes("인도빌리언")) return "신흥국";
  if (n.includes("코스닥")||n.includes("코스피")||n.includes("밸류업")||n.includes("증권")) return "국내지수";
  if (sector && sector !== "기타") return sector;
  return "기타";
}

function SvgPieChart({ data, colors, totalValue }) {
  const [hov, setHov] = useState(null);
  const cx=110, cy=100, r=78, ri=44, W=220, H=200;
  const total = data.reduce((s,d)=>s+d.value,0);
  if (!total) return null;
  let angle = -Math.PI/2;
  const slices = data.map((d,i)=>{
    const pct = d.value/total;
    // 100% 단일 슬라이스면 거의 완전한 원으로 처리 (SVG 호 제한 우회)
    const safePct = pct >= 1 ? 0.9999 : pct;
    const a0=angle, a1=angle+safePct*2*Math.PI;
    angle=a1;
    const x1=cx+r*Math.cos(a0),y1=cy+r*Math.sin(a0);
    const x2=cx+r*Math.cos(a1),y2=cy+r*Math.sin(a1);
    const ix1=cx+ri*Math.cos(a0),iy1=cy+ri*Math.sin(a0);
    const ix2=cx+ri*Math.cos(a1),iy2=cy+ri*Math.sin(a1);
    const lg=safePct>0.5?1:0;
    const path=`M${ix1},${iy1} L${x1},${y1} A${r},${r} 0 ${lg} 1 ${x2},${y2} L${ix2},${iy2} A${ri},${ri} 0 ${lg} 0 ${ix1},${iy1}Z`;
    return {...d,path,color:colors[i%colors.length],pct:(pct*100).toFixed(1)};
  });
  const h = hov!==null?slices[hov]:null;
  const handleTouch = (i) => setHov(prev => prev===i ? null : i);
  return (
    <svg width={W} height={H} style={{display:"block",margin:"0 auto"}}>
      {slices.map((s,i)=>(
        <path key={i} d={s.path} fill={s.color}
          opacity={hov===null||hov===i?1:0.45}
          onClick={()=>handleTouch(i)}
          onTouchStart={(e)=>{e.preventDefault();handleTouch(i);}}
          style={{cursor:"pointer",transition:"opacity 0.15s"}}/>
      ))}
      {h ? <>
        <text x={cx} y={cy-14} textAnchor="middle" fill="#e2e8f0" fontSize="12" fontWeight="700">{h.name.length>8?h.name.slice(0,8)+"..":h.name}</text>
        <text x={cx} y={cy+6} textAnchor="middle" fill={h.color} fontSize="18" fontWeight="800">{h.pct}%</text>
        <text x={cx} y={cy+22} textAnchor="middle" fill="#364875" fontSize="11">{Math.round(h.value/10000).toLocaleString()}만원</text>
      </> : <>
        <text x={cx} y={cy-8} textAnchor="middle" fill="#2a3a60" fontSize="12">총 자산</text>
        <text x={cx} y={cy+10} textAnchor="middle" fill="#94a3b8" fontSize="13" fontWeight="700">{totalValue?Math.round(totalValue/10000).toLocaleString()+"만":""}</text>
      </>}
    </svg>
  );
}

function PieLegend({data, colors, grand}) {
  return (
    <div style={{display:"flex",flexWrap:"wrap",gap:"6px 10px",marginTop:10}}>

}

function PortfolioPieCharts({ portfolio, filterAccount }) {
  if (!portfolio) return null;
  const holdings = filterAccount && filterAccount !== "all"
    ? portfolio.holdings.filter(h => h.account === filterAccount)
    : portfolio.holdings;

  // 동일 계좌+동일 종목명 합산 (RSA 등 구분 없이)
  const mergedMap = new Map();
  holdings.forEach(h => {
    const key = `${h.account||""}::${h.name||h.ticker||""}`;
    if (mergedMap.has(key)) {
      const ex = mergedMap.get(key);
      const totalShares = (ex.shares||0) + (h.shares||0);
      const totalCost = (ex.shares||0)*(ex.avg_price||0) + (h.shares||0)*(h.avg_price||0);
      mergedMap.set(key, { ...ex, shares: totalShares, avg_price: totalShares>0?totalCost/totalShares:ex.avg_price, current_price: h.current_price||ex.current_price });
    } else {
      mergedMap.set(key, {...h});
    }
  });
  const merged = Array.from(mergedMap.values());

  const cash = portfolio.cash || 0;
  const totalValue = merged.reduce((s,h)=>s+(h.shares||0)*(h.current_price||h.avg_price||0),0);
  const grand = totalValue + cash;

  const sectorMap={}, regionMap={};
  merged.forEach(h=>{
    const sv=(h.shares||0)*(h.current_price||h.avg_price||0);
    const sk=getSectorLabel(h.sector,h.name);
    sectorMap[sk]=(sectorMap[sk]||0)+sv;
    const rk=guessRegion(h.name);
    regionMap[rk]=(regionMap[rk]||0)+sv;
  });
  if(cash>0){sectorMap["₩ 현금"]=cash; regionMap["₩ 현금"]=cash;}

  const toArr=(m)=>Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([name,value])=>({name,value:Math.round(value)}));
  const sectorData=toArr(sectorMap), regionData=toArr(regionMap);

  return (
    <>
      <div style={{background:"#0f0f18",border:"1px solid #1e293b",borderRadius:12,padding:16,marginBottom:14}}>
        <div style={{fontSize:13,color:"#f59e0b",fontWeight:700,marginBottom:14,letterSpacing:2}}>섹터별 구성</div>
        <SvgPieChart data={sectorData} colors={PIE_COLORS} totalValue={grand}/>
        <PieLegend data={sectorData} colors={PIE_COLORS} grand={grand}/>
      </div>
      <div style={{background:"#0f0f18",border:"1px solid #1e293b",borderRadius:12,padding:16,marginBottom:14}}>
        <div style={{fontSize:13,color:"#0ea5e9",fontWeight:700,marginBottom:14,letterSpacing:2}}>지역별 구성</div>
        <SvgPieChart data={regionData} colors={PIE_COLORS} totalValue={grand}/>
        <PieLegend data={regionData} colors={PIE_COLORS} grand={grand}/>
      </div>
    </>
  );
}

function addHistoryPoint(portfolio) {
  try {
    // current_price가 있는 종목만 계산 (미조회 종목은 avg_price로 대체하지 않음)
    const pricedHoldings = portfolio.holdings.filter(h => h.current_price && h.current_price > 0);
    if (pricedHoldings.length === 0) return; // 현재가 없으면 기록 안 함
    const tc = pricedHoldings.reduce((s,h) => s+(h.shares||0)*(h.avg_price||0), 0);
    const tv = pricedHoldings.reduce((s,h) => s+(h.shares||0)*h.current_price, 0);
    if (tc <= 0 || tv <= 0) return;
    const ret = ((tv-tc)/tc*100);
    // 비정상 수익률 방어 (±1000% 초과면 기록 안 함)
    if (Math.abs(ret) > 1000) { console.warn("비정상 수익률, 히스토리 미기록:", ret.toFixed(1)+"%"); return; }
    const now = new Date();
    const point = { date:now.toISOString().slice(0,10), timestamp:now.getTime(), total_value:Math.round(tv), total_cost:Math.round(tc), return_pct:parseFloat(ret.toFixed(2)) };
    const history = JSON.parse(localStorage.getItem("portfolio_history_v1")||"[]");
    const filtered = history.filter(h => h.date !== point.date);
    localStorage.setItem("portfolio_history_v1", JSON.stringify([...filtered, point].sort((a,b)=>a.timestamp-b.timestamp).slice(-365)));
  } catch(e) { console.error(e); }
}

function ReturnHistoryChart({ portfolio }) {
  const [period, setPeriod] = useState(localStorage.getItem("history_period")||"daily");
  if (!portfolio) return null;

  const rawHistory = (() => { try { return JSON.parse(localStorage.getItem("portfolio_history_v1")||"[]"); } catch { return []; } })();
  const grouped={};
  rawHistory.forEach(h=>{
    const d=new Date(h.timestamp);
    let key;
    if(period==="daily") key=h.date;
    else if(period==="weekly") key=`${d.getFullYear()}-W${Math.ceil((d.getDate())/7)}`;
    else if(period==="monthly") key=h.date.slice(0,7);
    else key=h.date.slice(0,4);
    if(!grouped[key]||h.timestamp>grouped[key].timestamp) grouped[key]=h;
  });
  const history=Object.values(grouped).sort((a,b)=>a.timestamp-b.timestamp);

  const tc=portfolio.holdings.reduce((s,h)=>s+(h.shares||0)*(h.avg_price||0),0);
  const tv=portfolio.holdings.reduce((s,h)=>s+(h.shares||0)*(h.current_price||h.avg_price||0),0);
  const curRet=tc>0?((tv-tc)/tc*100).toFixed(2):0;

  const periods=[{id:"daily",label:"일별"},{id:"weekly",label:"주별"},{id:"monthly",label:"월별"},{id:"yearly",label:"연별"}];

  const maxAbs = history.length ? Math.max(...history.map(h=>Math.abs(h.return_pct)),1) : 1;
  const BAR_H = 100;

  return (
    <div style={{background:"#0f0f18",border:"1px solid #1e293b",borderRadius:12,padding:16,marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div style={{fontSize:13,color:"#7c3aed",fontWeight:700,letterSpacing:2}}>수익률 히스토리</div>
        <div style={{display:"flex",gap:4}}>
          {periods.map(p=>(
            <button key={p.id} onClick={()=>{setPeriod(p.id);localStorage.setItem("history_period",p.id);}} style={{
              padding:"4px 8px",borderRadius:10,border:`1px solid ${period===p.id?"#7c3aed":"#2a2a48"}`,
              background:period===p.id?"#7c3aed22":"transparent",
              color:period===p.id?"#8b78f5":"#364875",fontSize:11,cursor:"pointer",fontWeight:period===p.id?700:400,
            }}>{p.label}</button>
          ))}
        </div>
      </div>

      {history.length===0?(
        <div style={{textAlign:"center",padding:"24px 0",color:"#2a3a60",fontSize:13}}>
          가격 새로고침 후 히스토리가 쌓입니다
        </div>
      ):(
        <div>
          <div style={{display:"flex",alignItems:"flex-end",gap:4,height:BAR_H+30,overflowX:"auto",paddingBottom:4}}>
            {history.map((h,i)=>{
              const barH=Math.max(4,Math.abs(h.return_pct)/maxAbs*BAR_H);
              const isPos=h.return_pct>=0;
              const isCur=i===history.length-1;
              return(
                <div key={i} style={{display:"flex",flexDirection:"column",alignItems:"center",minWidth:36,flexShrink:0}}>
                  <div style={{fontSize:10,color:isPos?"#10b981":"#ef4444",fontWeight:700,marginBottom:2}}>
                    {h.return_pct>=0?"+":""}{h.return_pct}%
                  </div>
                  <div style={{
                    width:28,height:barH,borderRadius:"4px 4px 0 0",
                    background:isCur?(isPos?"#0ea5e9":"#ef4444"):(isPos?"#10b981":"#ef4444"),
                    opacity:isCur?1:0.6,
                    border:isCur?"2px solid #fff":"none",
                  }}/>
                  <div style={{fontSize:9,color:"#2a3a60",marginTop:3,textAlign:"center",lineHeight:1.2}}>
                    {period==="daily"?h.date.slice(5):period==="monthly"?h.date.slice(0,7):h.date.slice(0,period==="yearly"?4:7)}
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{textAlign:"center",marginTop:8,fontSize:13,color:"#364875"}}>
            현재 수익률: <span style={{color:parseFloat(curRet)>=0?"#10b981":"#ef4444",fontWeight:700}}>{parseFloat(curRet)>=0?"+":""}{curRet}%</span>
            <span style={{fontSize:11,color:"#2a2a48",marginLeft:8}}>(파란 막대 = 현재)</span>
          </div>
        </div>
      )}
    </div>
  );
}

function EditHoldingModal({ holding, onClose, onSave }) {
  const [mode, setMode] = useState("edit");

  const handleSave = () => {
    if (mode === "edit") {
      onSave({ ...holding, shares: parseFloat(shares)||0, avg_price: parseFloat(String(avgPrice).replace(/,/g,""))||0 });
    } else if (mode === "buy") {
      const addSh = parseFloat(addShares)||0;
      const addPr = parseFloat(String(addPrice).replace(/,/g,""))||0;
      const newShares = (holding.shares||0) + addSh;
      const newAvg = newShares>0 ? Math.round(((holding.shares||0)*(holding.avg_price||0)+addSh*addPr)/newShares) : (holding.avg_price||0);
      onSave({ ...holding, shares: newShares, avg_price: newAvg });
    } else if (mode === "sell") {
      const sellSh = parseFloat(sellShares)||0;
      const newShares = (holding.shares||0) - sellSh;
      if (newShares <= 0) { onSave(null); return; }
      onSave({ ...holding, shares: newShares });

  const newSharesCalc = (holding.shares||0)+(parseFloat(addShares)||0);

function ManualInputModal({ onClose, onAdd, existingAccounts = [] }) {
  const [account, setAccount]         = useState(existingAccounts[0] || "");
  const [newAccountName, setNewAccountName] = useState("");
  const [showNewAccount, setShowNewAccount] = useState(existingAccounts.length === 0);
  const [country, setCountry]         = useState("KR");
  const [searchQ, setSearchQ]         = useState("");
  const [searchResults, setSearchResults] = useState([]);
  const [searching, setSearching]     = useState(false);
  const [selected, setSelected]       = useState(null);
  const [avgPrice, setAvgPrice]       = useState("");
  const [shares, setShares]           = useState("");
  const [currency, setCurrency]       = useState("KRW");
  const [sector, setSector]           = useState("기타");
  const searchTimer = React.useRef(null);

  const COUNTRIES = [
    { id:"KR", label:"🇰🇷 한국" },
    { id:"US", label:"🇺🇸 미국" },
    { id:"JP", label:"🇯🇵 일본" },
    { id:"CN", label:"🇨🇳 중국" },
    { id:"ALL", label:"🌐 전체" },
  ];

  const finalAccount = showNewAccount ? newAccountName : account;

  const doSearch = async (q, ctry) => {
    if (!q || q.length < 2) { setSearchResults([]); return; }
    setSearching(true);
    const base = `https://query1.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(q)}&quotesCount=10&newsCount=0&enableFuzzyQuery=false`;
    const urls = [
      `https://api.allorigins.win/raw?url=${encodeURIComponent(base)}`,
      `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(base)}`,
      base,
    ];
    let results = [];
    for (const url of urls) {
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 8000);
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timer);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        const data = typeof text === "string" ? JSON.parse(text) : text;
        results = (data.quotes||[]).filter(q=>["ETF","EQUITY","MUTUALFUND"].includes(q.quoteType));
        break;
      } catch(e) { console.warn("검색 실패:", e.message); }
    }
    // 국가 필터
    if (ctry==="KR") results = results.filter(q=>q.symbol?.endsWith(".KS")||q.symbol?.endsWith(".KQ"));
    else if (ctry==="US") results = results.filter(q=>!q.symbol?.includes(".")||["NMS","NYQ","NGM","PCX"].includes(q.exchange));
    else if (ctry==="JP") results = results.filter(q=>q.symbol?.endsWith(".T"));
    else if (ctry==="CN") results = results.filter(q=>q.symbol?.endsWith(".SS")||q.symbol?.endsWith(".SZ"));
    setSearchResults(results.slice(0,6));
    setSearching(false);
  };

  const handleSearchChange = (v) => {
    setSearchQ(v); setSelected(null);
    clearTimeout(searchTimer.current);
    searchTimer.current = setTimeout(() => doSearch(v, country), 500);
  };

  const handleAdd = () => {
    if (!selected && !searchQ.trim()) { alert("종목을 검색해서 선택해주세요."); return; }
    if (!avgPrice || !shares) { alert("평균단가와 수량을 입력해주세요."); return; }
    if (!finalAccount) { alert("계좌를 선택하거나 신규 계좌명을 입력해주세요."); return; }
    onAdd({
      ticker: selected?.ticker || searchQ.trim(),
      yahoo_ticker: selected?.ticker || null,
      name: selected?.name || searchQ.trim(),
      avg_price: parseFloat(String(avgPrice).replace(/,/g,"")) || 0,
      shares: parseFloat(shares) || 0,
      currency, sector,
      account: finalAccount,
      current_price: null,
    });
  };

  const SECTORS = ["기타","국내지수","미국지수","반도체","AI·로보틱스","미국빅테크","전력인프라","원자력","방산·조선","2차전지","금·원자재","배당·채권","신흥국"];

  return (
    <div style={{ position:"fixed", inset:0, background:"#00000088", zIndex:500, display:"flex", alignItems:"flex-end" }} onClick={onClose}>
      <div style={{ background:"#0f0f18", borderRadius:"20px 20px 0 0", padding:"20px 18px 36px", width:"100%", maxWidth:480, margin:"0 auto", maxHeight:"90vh", overflowY:"auto" }} onClick={e=>e.stopPropagation()}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:18 }}>
          <div style={{ fontSize:16, fontWeight:800, color:"#a8b4f8" }}>✏️ 종목 추가</div>
          <button onClick={onClose} style={{ background:"none", border:"none", color:"#2a2a48", fontSize:22, cursor:"pointer" }}>×</button>
        </div>

        {/* 계좌 선택 */}
        <div style={{ marginBottom:14 }}>
          <div style={{ fontSize:12, color:"#2a2a48", marginBottom:6, fontWeight:600 }}>계좌</div>
          {!showNewAccount && existingAccounts.length > 0 ? (
            <div style={{ display:"flex", gap:8 }}>
              <select value={account} onChange={e=>setAccount(e.target.value)}
                style={{ flex:1, background:"#16162a", border:"1px solid #1e1e35", borderRadius:8, padding:"11px 12px", color:"#e8eaf0", fontSize:14, outline:"none" }}>
                {existingAccounts.map(a => <option key={a} value={a}>{a}</option>)}
              </select>
              <button onClick={()=>setShowNewAccount(true)} style={{ padding:"0 12px", borderRadius:8, background:"#16162a", border:"1px solid #1e1e35", color:"#2a2a48", fontSize:12, cursor:"pointer", whiteSpace:"nowrap" }}>+ 신규</button>
            </div>
          ) : (
            <div style={{ display:"flex", gap:8 }}>
              <input value={newAccountName} onChange={e=>setNewAccountName(e.target.value)} placeholder="새 계좌명 입력"
                style={{ flex:1, background:"#16162a", border:"1px solid #1e1e35", borderRadius:8, padding:"11px 12px", color:"#e8eaf0", fontSize:14, outline:"none" }} />
              {existingAccounts.length>0 && <button onClick={()=>setShowNewAccount(false)} style={{ padding:"0 12px", borderRadius:8, background:"#16162a", border:"1px solid #1e1e35", color:"#2a2a48", fontSize:12, cursor:"pointer" }}>기존</button>}
            </div>

        {/* 국가 선택 */}
        <div style={{ marginBottom:10 }}>
          <div style={{ fontSize:12, color:"#2a2a48", marginBottom:6, fontWeight:600 }}>국가</div>
          <div style={{ display:"flex", gap:4, overflowX:"auto" }}>
            {COUNTRIES.map(c => (

                padding:"6px 10px", borderRadius:8, border:"none", cursor:"pointer", whiteSpace:"nowrap", flexShrink:0,
                background:country===c.id?"#a8b4f822":"#16162a",

                fontSize:11, fontWeight:700,
              }}>{c.label}</button>
            ))}
          </div>
        </div>

        {/* 종목 검색 */}
        <div style={{ marginBottom:14 }}>
          <div style={{ fontSize:12, color:"#2a2a48", marginBottom:6, fontWeight:600 }}>종목 검색</div>
          <input value={searchQ} onChange={e=>handleSearchChange(e.target.value)}
            placeholder="종목명 또는 티커 검색..."
            style={{ width:"100%", background:"#16162a", border:`1px solid ${selected?"#a8b4f8":"#1e1e35"}`, borderRadius:8, padding:"11px 12px", color:"#e8eaf0", fontSize:14, outline:"none", marginBottom:4 }} />
          {selected && <div style={{ fontSize:11, color:"#a8b4f8", marginBottom:4 }}>✓ {selected.name} ({selected.ticker}) · {selected.exchange}</div>}
          {searching && <div style={{ fontSize:12, color:"#2a2a48", padding:"6px 0" }}>검색 중...</div>}
          {searchResults.length>0 && !selected && (
            <div style={{ background:"#22223a", borderRadius:8, overflow:"hidden", border:"1px solid #3a3a6a" }}>
              {searchResults.map((q,i) => (
                <button key={i} onClick={()=>{
                  setSelected({name:q.longname||q.shortname||q.symbol, ticker:q.symbol, exchange:q.exchDisp||q.exchange||""});

function Portfolio() {
  const [portfolio, setPortfolio] = useState(loadPortfolio);
  const [uploading, setUploading]   = useState(false);
  const [uploadMsg, setUploadMsg]   = useState("");
  const [updating, setUpdating]     = useState(false);
  const [dragOver, setDragOver]     = useState(false);
  const [showManual, setShowManual] = useState(false);
  const [showAddPanel, setShowAddPanel] = useState(false);
  const [editTarget, setEditTarget] = useState(null);
  const [autoUpdated, setAutoUpdated] = useState(false);
  const [showTradeModal, setShowTradeModal] = useState(null); // "buy" | "sell" | null

  const imgInputRef      = useRef(null);
  const xlsInputRef      = useRef(null);
  const orderImgInputRef = useRef(null);

  // 이미지 > Claude Vision
  const analyzeImage = async (file) => {
    setUploadMsg("AI가 계좌 이미지 분석 중...");
    const base64 = await new Promise((res, rej) => {
      const r = new FileReader(); r.onload = () => res(r.result.split(",")[1]); r.onerror = rej; r.readAsDataURL(file);
    });
    const text = await callClaudeWithImage({
      maxTokens: 2000,
      system: `주식 계좌 스크린샷에서 종목 정보를 추출하여 순수 JSON만 반환. 마크다운 없이.
{"holdings":[{"ticker":"코드","name":"종목명","shares":수량,"avg_price":평균단가,"currency":"KRW또는USD","sector":"섹터"}],"account_type":"국내/해외/혼합","broker":"증권사"}`,
      imageBase64: base64, mediaType: file.type,
      user: "이 계좌 스크린샷에서 모든 보유 종목(코드, 종목명, 수량, 평균단가)을 추출해줘. JSON만.",
    });
    return safeParseJSON(text);
  };

  // 주문체결/실현손익 캡처 분석
  const analyzeOrderCapture = async (file) => {
    setUploadMsg("주문체결 내역 분석 중...");
    const base64 = await new Promise((res,rej) => {
      const r = new FileReader(); r.onload = ()=>res(r.result.split(",")[1]); r.onerror=rej; r.readAsDataURL(file);
    });
    const text = await callGeminiWithImage({
      maxTokens:2000,
      system:`주문체결 또는 실현손익 캡처에서 거래 내역을 추출해 순수 JSON만 반환.
{"trades":[{"name":"종목명","ticker":"코드","type":"buy/sell","shares":수량,"price":단가,"date":"날짜"}]}`,
      imageBase64:base64, mediaType:file.type,
      user:"이 주문체결/실현손익 화면에서 모든 거래 내역(종목명, 수량, 단가, 매수/매도)을 추출해줘. JSON만.",
    });
    const parsed = safeParseJSON(text);
    return parsed.trades || [];
  };

  // 주문체결 캡처로 포폴 업데이트
  const processOrderCapture = async (file) => {
    setUploading(true);
    setUploadMsg("주문체결 분석 중...");
    try {
      const trades = await analyzeOrderCapture(file);
      if (!trades.length) { alert("거래 내역을 찾을 수 없어요."); setUploading(false); return; }
      
      let holdings = [...(portfolio?.holdings||[])];
      trades.forEach(trade => {
        const idx = holdings.findIndex(h => h.ticker===trade.ticker || h.name===trade.name);
        if (trade.type === "buy") {
          if (idx >= 0) {
            // 기존 종목 추가매수 > 평단 재계산
            const h = holdings[idx];
            const newShares = (h.shares||0) + trade.shares;
            const newAvg = newShares>0 ? Math.round(((h.shares||0)*(h.avg_price||0)+trade.shares*trade.price)/newShares) : trade.price;
            holdings[idx] = { ...h, shares:newShares, avg_price:newAvg };
          } else {
            holdings.push({ name:trade.name, ticker:trade.ticker||trade.name, shares:trade.shares, avg_price:trade.price, currency:"KRW", sector:"기타", current_price:null });
          }
        } else if (trade.type === "sell") {
          if (idx >= 0) {
            const remaining = (holdings[idx].shares||0) - trade.shares;
            if (remaining <= 0) holdings.splice(idx, 1);
            else holdings[idx] = { ...holdings[idx], shares:remaining };
          }
        }
      });

      const updated = { ...(portfolio||{holdings:[],uploadedAt:new Date().toISOString()}), holdings, updatedAt:new Date().toISOString() };
      savePortfolio(updated); setPortfolio(updated);
      alert(`${trades.length}건 거래 반영 완료!`);
    } catch(e) { alert("분석 실패: "+e.message); }
    setUploading(false); setUploadMsg("");
  };

  // 엑셀/CSV > Claude
  const analyzeSpreadsheet = async (file) => {
    setUploadMsg("스프레드시트 파싱 중...");
    let textContent = "";
    if (file.name.endsWith(".csv")) {
      textContent = await file.text();
    } else {
      const ab = await file.arrayBuffer();
      const bytes = new Uint8Array(ab);
      let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
      const b64 = btoa(bin);
      textContent = await callClaude({
        maxTokens: 2000,
        system: "엑셀 파일 파서. base64 xlsx를 CSV 텍스트로만 변환 반환.",
        user: `이 base64 xlsx를 CSV로 변환:\n${b64.slice(0, 8000)}`,
      });
    }
    setUploadMsg("종목 데이터 인식 중...");
    const text = await callClaude({
      maxTokens: 2000,
      system: `포트폴리오 CSV/텍스트에서 종목 추출 후 순수 JSON만.

[레이아웃 패턴별 처리]
1. 종목명/평가금액+매수금액+보유수량 → avg_price = 매수금액÷수량

[중요 규칙]
- 브랜드명(KODEX/TIGER/ACE/RISE/PLUS/TIME 등)은 종목명 앞에 포함 (예: "TIGER 미국우주테크")
- current_price: 화면에 현재가/현재값이 보이면 숫자로 추출. 없으면 null
- change_pct: 화면에 등락률(%)이 보이면 숫자로 추출 (예: +2.34 또는 -1.5). 없으면 null
- TDF/MMF 등 현재가 조회가 어려운 종목도 화면에 표시된 값 그대로 추출
- yahoo_ticker: 한국 코스피는 숫자코드.KS, 코스닥은 숫자코드.KQ (모르면 null)
- account: 아래 규칙을 반드시 따를 것
  * 계좌명이 있으면 → 계좌명만 사용 (계좌번호, 계좌주 이름 모두 제외)
  * 계좌명이 없으면 → 계좌번호만 사용 (잘려도 OK, 계좌주 이름 제외)
  * 계좌주 성명(한글 이름)은 절대 포함하지 말 것
  * 예: "[Super365] 3026-1683-01 김응용" → "Super365" 또는 "[Super365]"
  * 예: "270-82-452759 [01] 종합계좌 김응용" → "종합계좌"
  * 예: "3026-1683-01" (계좌명 없음) → "3026-1683-01"
- cash: 예수금/현금 잔고 (없으면 0)
- 인식 불가능한 종목은 partial_fail 배열에 기록

{"holdings":[{"ticker":"종목코드","yahoo_ticker":"133690.KQ","name":"브랜드포함종목명","shares":수량,"avg_price":평균단가,"current_price":현재가또는null,"change_pct":당일등락률숫자또는null,"currency":"KRW","sector":"섹터","account":"화면에보이는계좌명또는번호"}],"account_type":"국내/해외/혼합","account":"화면에보이는계좌명또는번호","cash":예수금,"partial_fail":[]}`,

      } else if (isSpreadsheet) {

      if (!parsed?.holdings?.length) throw new Error("종목을 찾을 수 없어요. 다른 이미지를 시도해보세요.");

      // 계좌명 결정 - 보이는 텍스트 그대로, 중복 시 구분자 추가
      const rawAccount = (parsed.account || "신규계좌").trim();
      const existingAccounts = portfolio ? [...new Set(portfolio.holdings.map(h=>h.account).filter(Boolean))] : [];
      let detectedAccount = rawAccount;
      if (existingAccounts.includes(rawAccount)) {
        const dupCount = existingAccounts.filter(n => n === rawAccount || n.startsWith(rawAccount + " ")).length;
        detectedAccount = rawAccount + ` -${dupCount + 1}`;
      }

      const newHoldings = parsed.holdings.map(h => ({
        ...h,
        yahoo_ticker: h.yahoo_ticker || null,
        // 스샷에서 읽은 현재가/수익률 보존 (Yahoo 조회 성공 시 덮어씀)
        current_price: (h.current_price && h.current_price > 0) ? h.current_price : null,

      // 기존 같은 계좌가 있는지 확인 → 교체 or 추가
      const sameAccount = existingAccounts.find(a => a === detectedAccount);
      let latestPortfolio;
      if (sameAccount && portfolio) {
        // 같은 계좌 → 교체 (합산 아님)

        console.log(`계좌 "${sameAccount}" 교체 완료`);
      } else if (portfolio) {

      } else {

  // 파일 change 핸들러
  const onFileChange = (e, addToExisting) => {

  // 직접 입력 추가
  const addManualHolding = (h) => {

      : { holdings: [h], account_type: "혼합", broker: h.account || "", uploadedAt: new Date().toISOString(), updatedAt: new Date().toISOString() };

  // 종목 삭제
  const removeHolding = (idx) => {

    savePortfolio(updated);
    setPortfolio(updated);
  };

  // 종목 수정/삭제
  const updateHolding = (idx, updated) => {
    let newHoldings;
    if (updated === null) {
      newHoldings = portfolio.holdings.filter((_, i) => i !== idx);
    } else {
      newHoldings = portfolio.holdings.map((h, i) => i === idx ? updated : h);
    }
    const p = { ...portfolio, holdings: newHoldings, updatedAt: new Date().toISOString() };
    savePortfolio(p);
    setPortfolio(p);

  // Yahoo Finance로 단일 종목 현재가 조회
  const fetchYahooPrice = async (ticker) => {
    if (!ticker) return null;
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1d&range=1d`;
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 8000);
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(timer);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const meta = data.chart?.result?.[0]?.meta;
      if (!meta) return null;
      const price = meta.regularMarketPrice || meta.previousClose;
      const prev  = meta.chartPreviousClose || meta.previousClose;
      const changePct = prev ? ((price - prev) / prev * 100) : 0;
      return { current_price: price, change_pct: changePct };
    } catch(e) { return null; }
  };

  // Yahoo Finance 검색 API로 티커 자동 조회 (하드코딩 불필요)
  const resolveTickerCodes = async (holdings, apiKey) => {
    const needTicker = holdings.filter(h => !h.yahoo_ticker);
    if (needTicker.length === 0) return holdings;

    // Yahoo Finance 검색 API로 종목명 → 티커 자동 매핑
    const tickerMap = {};
    await Promise.allSettled(needTicker.map(async h => {
      try {
        const q = encodeURIComponent(h.name);
        const url = `https://query1.finance.yahoo.com/v1/finance/search?q=${q}&lang=ko-KR&region=KR&quotesCount=1&newsCount=0`;
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 5000);
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timer);
        if (!res.ok) return;
        const data = await res.json();
        const quote = data.quotes?.find(q => q.exchange === "KSC" || q.exchange === "KOE" || q.quoteType === "ETF" || q.quoteType === "EQUITY");
        if (quote?.symbol) tickerMap[h.name] = quote.symbol;
      } catch(e) {}
    }));

    // Yahoo 검색 실패한 종목만 Gemini로 보완
    const stillMissing = needTicker.filter(h => !tickerMap[h.name]);
    if (stillMissing.length > 0 && apiKey) {
      try {
        const names = stillMissing.map(h => h.name).join(", ");
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${apiKey}`;
        const body = {
          contents: [{ role: "user", parts: [{ text: `다음 한국 ETF/주식 종목들의 Yahoo Finance 티커 코드를 JSON으로만 반환. 마크다운 없이.
한국 코스피 종목은 숫자코드.KS, 코스닥은 숫자코드.KQ 형식.
예시: {"tickers":[{"name":"TIGER 미국S&P500","yahoo_ticker":"360750.KS"},{"name":"삼성전자","yahoo_ticker":"005930.KS"}]}
대상: ${names}` }] }],
          generationConfig: { maxOutputTokens: 800, temperature: 0, thinkingConfig: { thinkingBudget: 0 } },
        };
        const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        if (res.ok) {
          const data = await res.json();
          const text = data.candidates?.[0]?.content?.parts?.map(p => p.text||"").join("") || "";
          const match = text.replace(/```json|```/g,"").trim().match(/\{[\s\S]*\}/);
          if (match) {
            const parsed = JSON.parse(match[0]);
            parsed.tickers?.forEach(t => { if (t.name && t.yahoo_ticker) tickerMap[t.name] = t.yahoo_ticker; });
          }
        }
      } catch(e) { console.warn("Gemini 티커 보완 실패:", e.message); }
    }

    return holdings.map(h => ({ ...h, yahoo_ticker: h.yahoo_ticker || tickerMap[h.name] || null }));
  };

  // Gemini fallback (Yahoo 실패 종목 재시도)
  const updatePricesGeminiFallback = async (pf, apiKey, onlyMissing = false) => {
    try {
      const targets = onlyMissing ? pf.holdings.filter(h => !h.current_price) : pf.holdings;
      const chunks = [];
      for (let i = 0; i < targets.length; i += 10) chunks.push(targets.slice(i, i+10));
      let allPrices = [];
      for (const chunk of chunks) {
        const names = chunk.map(h => h.name).join(", ");
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${apiKey}`;
        const body = {
          contents: [{ role: "user", parts: [{ text: `다음 한국 ETF/주식의 오늘 현재가를 검색해서 JSON으로만 반환. 마크다운 없이.
{"prices":[{"name":"종목명","current_price":숫자,"change_pct":숫자}]}
대상: ${names}` }] }],
          tools: [{ googleSearch: {} }],
          generationConfig: { maxOutputTokens: 800, temperature: 0, thinkingConfig: { thinkingBudget: 0 } },
        };
        try {

          if (!res.ok) continue;
          const data = await res.json();

          const match = text.replace(/```json|```/g,"").trim().match(/\{[\s\S]*\}/);
          if (match) { const p = JSON.parse(match[0]); if (p.prices) allPrices = [...allPrices, ...p.prices]; }
        } catch(e) { continue; }
      }
      if (allPrices.length === 0) throw new Error("Gemini fallback 실패");
      const updated = { ...pf, updatedAt: new Date().toISOString(),
        holdings: pf.holdings.map(h => {
          const p = allPrices.find(x => x.name === h.name);
          return p ? { ...h, current_price: Number(p.current_price)||h.current_price, change_pct: Number(p.change_pct)||0 } : h;
        }),
      };
      savePortfolio(updated); setPortfolio(updated); addHistoryPoint(updated);
      setUploadMsg(`✅ ${allPrices.length}개 종목 현재가 업데이트 완료 (AI)`);

  const updatePrices = async (targetPortfolio) => {
    const pf = targetPortfolio || portfolio;
    if (!pf) return;
    setUpdating(true);
    setUploadMsg("📡 현재가 조회 중...");
    try {

      const holdingsWithTickers = await resolveTickerCodes(pf.holdings, apiKey);
      // 2단계: Yahoo Finance 병렬 조회
      const results = await Promise.allSettled(

          if (h.yahoo_ticker) {
            const price = await fetchYahooPrice(h.yahoo_ticker);
            if (price) return { ...h, current_price: price.current_price, change_pct: price.change_pct };
          }
          // Yahoo 실패 or 티커 없음 → 스샷에서 읽은 값 유지
          return { ...h };
        })
      );
      const updatedHoldings = results.map((r, i) => r.status === "fulfilled" ? r.value : holdingsWithTickers[i]);
      const successCount = updatedHoldings.filter((h, i) => h.current_price && h.current_price !== holdingsWithTickers[i]?.current_price).length;
      const failCount = updatedHoldings.filter(h => !h.current_price).length;
      const updated = { ...pf, updatedAt: new Date().toISOString(), holdings: updatedHoldings };
      savePortfolio(updated); setPortfolio(updated); addHistoryPoint(updated);

      } else if (successCount > 0 && failCount > 0 && apiKey) {

        if (apiKey) { setUploadMsg("📡 AI로 현재가 조회 중..."); await updatePricesGeminiFallback(updated, apiKey, false); }
        else { setUploadMsg("❌ 현재가 조회 실패"); setTimeout(() => setUploadMsg(""), 4000); setUpdating(false); }
      } else {
        setUploadMsg(`✅ ${successCount}개 종목 현재가 업데이트 완료`);

        setUpdating(false);

    } catch(e) {
      setUploadMsg(`❌ 가격 업데이트 실패: ${e.message}`);
      setTimeout(() => setUploadMsg(""), 5000);
      setUpdating(false);

  const [showDeleteModal, setShowDeleteModal] = useState(false);
  const [viewMode, setViewMode] = useState("all");
  const [sortBy, setSortBy] = useState("name");
  const [sortDir, setSortDir] = useState("desc");

  // 포트폴리오 탭 첫 진입 시 미조회 종목 자동 갱신
  useEffect(() => {
    if (!autoUpdated && portfolio && getApiKey()) {
      const hasUnpriced = portfolio.holdings.some(h => !h.current_price);
      if (hasUnpriced) { setAutoUpdated(true); setTimeout(() => updatePrices(), 500); }

  // 계좌 목록
  const accounts = portfolio ? [...new Set(portfolio.holdings.map(h => h.account).filter(Boolean))] : [];

  // 현재 뷰에 따른 종목 필터 + 동일 종목 합산 (전체/계좌별 모두)
  const rawHoldings = (() => {
    if (!portfolio) return [];
    const holdings = viewMode === "all" ? portfolio.holdings : portfolio.holdings.filter(h => h.account === viewMode);
    // 동일 종목명 합산 (RSA 등 구분 없이)
    const map = new Map();
    holdings.forEach(h => {
      const key = (viewMode === "all" ? "" : h.account + "::") + (h.name || h.ticker || "");
      if (map.has(key)) {
        const ex = map.get(key);
        const totalShares = (ex.shares||0) + (h.shares||0);
        const totalCost = (ex.shares||0)*(ex.avg_price||0) + (h.shares||0)*(h.avg_price||0);
        map.set(key, {
          ...ex,
          shares: totalShares,
          avg_price: totalShares > 0 ? totalCost / totalShares : ex.avg_price,
          current_price: h.current_price || ex.current_price,
          _accounts: [...(ex._accounts||[ex.account]), h.account].filter(Boolean),
        });
      } else {
        map.set(key, { ...h, _accounts: [h.account].filter(Boolean) });
      }
    });
    return Array.from(map.values());
  })();

  const visibleHoldings = [...rawHoldings].sort((a, b) => {
    let av, bv;
    if (sortBy === "value") {
      av = (a.shares||0)*(a.current_price||a.avg_price||0);
      bv = (b.shares||0)*(b.current_price||b.avg_price||0);
      return sortDir === "asc" ? av-bv : bv-av;
    } else if (sortBy === "profit") {
      const ac=(a.shares||0)*(a.avg_price||0), bc=(b.shares||0)*(b.avg_price||0);
      av = ac>0?((a.shares||0)*(a.current_price||a.avg_price||0)-ac)/ac*100:0;
      bv = bc>0?((b.shares||0)*(b.current_price||b.avg_price||0)-bc)/bc*100:0;
      return sortDir === "asc" ? av-bv : bv-av;
    } else {
      av = a.name||""; bv = b.name||"";
      return sortDir === "asc" ? av.localeCompare(bv,"ko") : bv.localeCompare(av,"ko");
    }
  });

  const cash = portfolio?.cash || 0;
  const totalCost  = visibleHoldings.reduce((s, h) => s + (h.shares||0)*(h.avg_price||0), 0);
  const totalValue = visibleHoldings.reduce((s, h) => s + (h.shares||0)*(h.current_price||h.avg_price||0), 0) + cash;
  const totalReturn = totalCost > 0 ? ((totalValue - totalCost) / totalCost) * 100 : 0;

  // 업로드 패널 - label+input을 항상 DOM에 렌더링 (모바일 sandbox 대응)
  const renderUploadPanel = (addToExisting = false) => {
    const imgId  = addToExisting ? "file-img-add"  : "file-img-new";
    const xlsId  = addToExisting ? "file-xls-add"  : "file-xls-new";
    return (
      <div>
        {/* 숨김 input - label과 id로 연결, 항상 DOM에 존재 */}
        <input
          id={imgId} type="file" accept="image/*"
          style={{ position: "absolute", width: 1, height: 1, opacity: 0, overflow: "hidden" }}
          onChange={e => onFileChange(e, addToExisting)}
        />
        <input
          id={xlsId} type="file" accept=".xlsx,.xls,.csv"
          style={{ position: "absolute", width: 1, height: 1, opacity: 0, overflow: "hidden" }}
          onChange={e => onFileChange(e, addToExisting)}
        />

        {uploading ? (
          <div style={{ textAlign: "center", padding: "36px 20px", background: "#0a0f1a", borderRadius: 14, border: "1px solid #1e293b" }}>
            <Spinner size={34} />
            <div style={{ marginTop: 14, color: "#0ea5e9", fontWeight: 700, fontSize: 16 }}>{uploadMsg}</div>
          </div>
        ) : (
          <div>
            {/* 드래그앤드롭 - PC용 */}
            <div
              onDragOver={e => { e.preventDefault(); setDragOver(true); }}
              onDragLeave={() => setDragOver(false)}
              onDrop={e => { e.preventDefault(); setDragOver(false); processFile(e.dataTransfer.files[0], addToExisting); }}
              style={{
                border: `2px dashed ${dragOver ? "#0ea5e9" : "#16162a"}`,
                borderRadius: 12, padding: "20px 16px", textAlign: "center",
                background: dragOver ? "#0ea5e911" : "#0a0f1a", marginBottom: 12, transition: "all 0.2s",
              }}
            >
              <div style={{ fontSize: 26, marginBottom: 5 }}></div>
              <div style={{ fontSize: 14, color: "#2a3a60" }}>PC: 파일을 여기로 드래그</div>
              <div style={{ fontSize: 13, color: "#2a2a48", marginTop: 2 }}>이미지 · xlsx · csv</div>
            </div>

            {/* label 버튼 - htmlFor로 input 직접 연결 (모바일에서 가장 확실) */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 10 }}>
              <label
                htmlFor={imgId}
                style={{
                  padding: "14px 8px", borderRadius: 12, cursor: "pointer",
                  background: "linear-gradient(135deg,#0ea5e9,#0369a1)", color: "#fff",
                  fontWeight: 700, fontSize: 15, display: "flex", flexDirection: "column",
                  alignItems: "center", gap: 6, userSelect: "none",
                }}
              >
                <span style={{ fontSize: 24 }}></span>
                <span>갤러리 / 스크린샷</span>
              </label>
              <label
                htmlFor={xlsId}
                style={{
                  padding: "14px 8px", borderRadius: 12, cursor: "pointer",
                  background: "linear-gradient(135deg,#10b981,#059669)", color: "#fff",
                  fontWeight: 700, fontSize: 15, display: "flex", flexDirection: "column",
                  alignItems: "center", gap: 6, userSelect: "none",
                }}
              >
                <span style={{ fontSize: 24 }}></span>
                <span>엑셀 / CSV</span>
              </label>
            </div>

            <button
              onClick={() => { setShowManual(true); setShowAddPanel(false); }}
              style={{
                width: "100%", padding: "13px", borderRadius: 12, cursor: "pointer",
                background: "#16162a", color: "#e2e8f0", border: "1px solid #334155",
                fontWeight: 700, fontSize: 15, display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
              }}
            >
              ✎ 직접 입력
            </button>
            {addToExisting && (
              <button onClick={() => setShowAddPanel(false)} style={{ width: "100%", marginTop: 8, padding: "10px", background: "none", border: "none", color: "#364875", fontSize: 15, cursor: "pointer" }}>
                취소
              </button>
            )}
          </div>
        )}
      </div>
    );
  };

  return (
    <div style={{ padding: "0 4px" }}>
      {/* 업로드/갱신 진행 토스트 */}
      {(uploading || updating || uploadMsg) && (
        <div style={{
          position: "fixed", bottom: 70, left: "50%", transform: "translateX(-50%)",
          zIndex: 999, maxWidth: 380, width: "90%",
          background: (uploading || updating) ? "linear-gradient(135deg,#0d2040,#1a0d35)" : uploadMsg.startsWith("❌") ? "linear-gradient(135deg,#2a0a0a,#1a0505)" : "linear-gradient(135deg,#0a2a1a,#051510)",
          border: `1px solid ${(uploading||updating) ? "#1a3a5a" : uploadMsg.startsWith("❌") ? "#3a1a1a" : "#1a3a28"}`,
          borderRadius: 16, padding: "14px 20px",
          display: "flex", alignItems: "center", gap: 12,
          boxShadow: "0 8px 32px #00000066",
        }}>
          {(uploading || updating) && <Spinner size={18} />}
          <div style={{ color: (uploading||updating) ? "#22d3ee" : uploadMsg.startsWith("❌") ? "#f87171" : "#22d3a0", fontWeight: 700, fontSize: 14, flex: 1 }}>
            {uploadMsg || (uploading ? "분석 중..." : "현재가 조회 중...")}
          </div>
        </div>
      )}

      {editTarget && (
        <EditHoldingModal
          holding={editTarget.holding}
          onClose={() => setEditTarget(null)}
          onSave={(updated) => { updateHolding(editTarget.index, updated); setEditTarget(null); }}
        />
      )}
      {showManual && (
        <ManualInputModal
          onClose={() => setShowManual(false)}
          onAdd={h => { addManualHolding(h); setShowManual(false); }}
          existingAccounts={portfolio ? [...new Set(portfolio.holdings.map(h=>h.account).filter(Boolean))] : []}
        />
      )}
      {showTradeModal && (
        <TradeModal
          mode={showTradeModal}
          holdings={portfolio?.holdings || []}
          accounts={portfolio ? [...new Set(portfolio.holdings.map(h=>h.account).filter(Boolean))] : []}
          onClose={() => setShowTradeModal(null)}
          onConfirm={(trade) => {
            if (trade.type === "buy") {
              // 기존 종목 있으면 평단 재계산, 없으면 추가
              const idx = portfolio.holdings.findIndex(h => h.name === trade.name && h.account === trade.account);
              let newHoldings;
              if (idx >= 0) {
                const h = portfolio.holdings[idx];
                const totalShares = (h.shares||0) + trade.shares;
                const newAvg = ((h.shares||0)*(h.avg_price||0) + trade.shares*trade.price) / totalShares;
                newHoldings = portfolio.holdings.map((h2, i) => i===idx ? {...h2, shares:totalShares, avg_price:newAvg} : h2);
              } else {
                newHoldings = [...portfolio.holdings, { name:trade.name, ticker:"", shares:trade.shares, avg_price:trade.price, currency:"KRW", sector:"기타", account:trade.account }];
              }
              const updated = { ...portfolio, holdings: newHoldings, updatedAt: new Date().toISOString() };
              savePortfolio(updated); setPortfolio(updated);
              setUploadMsg(`✅ 매수 반영: ${trade.name} ${trade.shares}주`);
            } else {
              // 매도: 수량 차감, 전량이면 삭제
              const idx = portfolio.holdings.findIndex(h => h.name === trade.name && h.account === trade.account);
              if (idx < 0) return;
              const h = portfolio.holdings[idx];
              const remain = (h.shares||0) - trade.shares;
              let newHoldings;
              if (remain <= 0) {
                newHoldings = portfolio.holdings.filter((_, i) => i !== idx);
              } else {
                newHoldings = portfolio.holdings.map((h2, i) => i===idx ? {...h2, shares:remain} : h2);
              }
              const updated = { ...portfolio, holdings: newHoldings, updatedAt: new Date().toISOString() };
              savePortfolio(updated); setPortfolio(updated);
              setUploadMsg(remain<=0 ? `✅ 전량매도: ${trade.name} 삭제됨` : `✅ 매도 반영: ${trade.name} 잔여 ${remain}주`);
            }
            setTimeout(() => setUploadMsg(""), 3000);
            setShowTradeModal(null);
          }}
        />
      )}

      {/* 포폴 없음 > 초기 등록 */}
      {!portfolio ? (
        <div>
          <div style={{ textAlign: "center", marginBottom: 20 }}>
            <div style={{ fontSize: 40, marginBottom: 8 }}>📊</div>
            <div style={{ fontSize: 16, fontWeight: 700, color: "#e2e8f0", marginBottom: 4 }}>포트폴리오 등록</div>
            <div style={{ fontSize: 14, color: "#364875" }}>스크린샷, 엑셀, 직접입력 중 편한 방법으로 추가하세요</div>
          </div>
          {renderUploadPanel(false)}
        </div>
      ) : (
        <div>
          {/* 계좌 탭 + 편집 버튼 */}
          <div style={{ display: "flex", gap: 4, marginBottom: 12, overflowX: "auto", paddingBottom: 2, borderBottom: "1px solid #12121f" }}>
            <button onClick={() => setViewMode("all")} style={{
              padding: "7px 12px", border: "none", background: "transparent",
              color: viewMode === "all" ? "#e8eaf0" : "#2a2a48",
              fontSize: 13, fontWeight: viewMode === "all" ? 700 : 400, cursor: "pointer",
              whiteSpace: "nowrap", flexShrink: 0,
              borderBottom: viewMode === "all" ? "2px solid #4f6ef7" : "2px solid transparent",
              transition: "all 0.15s",
            }}>전체</button>
            {accounts.map(acc => (
              <div key={acc} style={{ display: "flex", alignItems: "center", flexShrink: 0 }}>
                <button onClick={() => setViewMode(acc)} style={{
                  padding: "7px 10px", border: "none", background: "transparent",
                  color: viewMode === acc ? "#e8eaf0" : "#2a2a48",
                  fontSize: 13, fontWeight: viewMode === acc ? 700 : 400, cursor: "pointer",
                  whiteSpace: "nowrap",
                  borderBottom: viewMode === acc ? "2px solid #22d3a0" : "2px solid transparent",
                  transition: "all 0.15s",
                }}>{acc}</button>
                <button onClick={() => {
                  const newName = prompt("계좌 탭 이름 변경:", acc);
                  if (!newName || newName.trim() === acc) return;
                  const trimmed = newName.trim();
                  const updated = { ...portfolio, holdings: portfolio.holdings.map(h => h.account === acc ? { ...h, account: trimmed } : h) };
                  savePortfolio(updated); setPortfolio(updated);
                  if (viewMode === acc) setViewMode(trimmed);
                }} style={{ background: "none", border: "none", color: "#1a1a2e", fontSize: 10, cursor: "pointer", padding: "0 2px", marginBottom: 2 }}>✎</button>
              </div>
            ))}
          </div>

          {/* 요약 카드 */}
          <div style={{
            background: "#0f0f18",
            border: "1px solid #16162a",
            borderRadius: 18, padding: "20px 18px 16px", marginBottom: 12,
          }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 16 }}>
              <div>
                <div style={{ fontSize: 10, color: "#3a3a6a", fontWeight: 700, letterSpacing: 2.5, marginBottom: 4, textTransform:"uppercase" }}>
                  {viewMode === "all" ? "전체 포트폴리오" : viewMode}
                </div>
                <div style={{ fontSize: 10, color: "#16162a" }}>{new Date(portfolio.updatedAt).toLocaleString("ko-KR")}</div>
              </div>
              <div style={{ display: "flex", gap: 6 }}>
                <button onClick={updatePrices} disabled={updating} style={{
                  background: "#0f0f18", color: updating ? "#2a2a48" : "#22d3ee",
                  border: "1px solid #1a3050", borderRadius: 8, padding: "6px 11px",
                  cursor: updating ? "not-allowed" : "pointer", fontSize: 12, fontWeight: 600,
                  display: "flex", alignItems: "center", gap: 4,
                }}>
                  {updating ? <Spinner size={11} /> : "🔄"} 가격
                </button>
                <button onClick={() => setShowDeleteModal(true)} style={{
                  background: "#0f0f18", color: "#4a1a1a",
                  border: "1px solid #2a1010", borderRadius: 8, padding: "6px 11px",
                  cursor: "pointer", fontSize: 12,
                }}>🗑</button>
              </div>
            </div>

            {/* 계좌 삭제 모달 */}
            {showDeleteModal && (() => {
              const accs = [...new Set(portfolio.holdings.map(h=>h.account).filter(Boolean))];
              const targetAcc = viewMode !== "all" ? viewMode : null;
              return (
                <div style={{ position:"fixed", inset:0, background:"#00000088", zIndex:999, display:"flex", alignItems:"center", justifyContent:"center", padding:24 }}>
                  <div style={{ background:"#16162a", borderRadius:16, padding:24, width:"100%", maxWidth:340, border:"1px solid #334155" }}>
                    <div style={{ fontSize:16, fontWeight:700, color:"#e2e8f0", marginBottom:16 }}>계좌 삭제</div>
                    {targetAcc ? (
                      <>
                        <div style={{ fontSize:15, color:"#94a3b8", marginBottom:20 }}>
                          <span style={{ color:"#ef4444", fontWeight:700 }}>{targetAcc}</span> 계좌를 삭제하시겠습니까?
                        </div>
                        <div style={{ display:"flex", gap:8 }}>
                          <button onClick={() => setShowDeleteModal(false)} style={{ flex:1, padding:"10px", borderRadius:8, background:"#0f0f18", border:"1px solid #334155", color:"#94a3b8", cursor:"pointer", fontWeight:700 }}>취소</button>
                          <button onClick={() => {
                            const updated = { ...portfolio, holdings: portfolio.holdings.filter(h=>h.account!==targetAcc), updatedAt:new Date().toISOString() };
                            if (updated.holdings.length === 0) { savePortfolio(null); setPortfolio(null); }
                            else { savePortfolio(updated); setPortfolio(updated); }
                            setViewMode("all");
                            setShowDeleteModal(false);
                          }} style={{ flex:1, padding:"10px", borderRadius:8, background:"#ef444422", border:"1px solid #ef4444", color:"#ef4444", cursor:"pointer", fontWeight:700 }}>삭제</button>
                        </div>
                      </>
                    ) : (
                      <>
                        <div style={{ fontSize:14, color:"#94a3b8", marginBottom:12 }}>삭제할 계좌를 선택하세요</div>
                        <div style={{ display:"flex", flexDirection:"column", gap:8, marginBottom:16 }}>
                          {accs.map(acc => (
                            <button key={acc} onClick={() => {
                              const updated = { ...portfolio, holdings: portfolio.holdings.filter(h=>h.account!==acc), updatedAt:new Date().toISOString() };
                              if (updated.holdings.length === 0) { savePortfolio(null); setPortfolio(null); }
                              else { savePortfolio(updated); setPortfolio(updated); }
                              setViewMode("all");
                              setShowDeleteModal(false);
                            }} style={{ padding:"10px 14px", borderRadius:8, background:"#ef444411", border:"1px solid #ef444433", color:"#fca5a5", cursor:"pointer", textAlign:"left", fontSize:14, fontWeight:600 }}>
                              {acc}
                            </button>
                          ))}
                          <button onClick={() => { savePortfolio(null); setPortfolio(null); setShowDeleteModal(false); }} style={{ padding:"10px 14px", borderRadius:8, background:"#7f1d1d33", border:"1px solid #ef444466", color:"#ef4444", cursor:"pointer", textAlign:"left", fontSize:14, fontWeight:700 }}>
                            전체 삭제
                          </button>
                        </div>
                        <button onClick={() => setShowDeleteModal(false)} style={{ width:"100%", padding:"10px", borderRadius:8, background:"#0f0f18", border:"1px solid #334155", color:"#94a3b8", cursor:"pointer", fontWeight:700 }}>취소</button>
                      </>
                    )}
                  </div>
                </div>
              );
            })()}
            <div>
              <div style={{ marginBottom: 10 }}>
                <div style={{ fontSize: 10, color: "#3a3a6a", fontWeight: 700, letterSpacing: 2, marginBottom: 6, textTransform:"uppercase" }}>총 평가액</div>
                <div style={{ fontSize: 34, fontWeight: 900, color: "#f1f5f9", letterSpacing: -1.5, lineHeight: 1.1 }}>
                  {totalValue >= 100000000 ? `₩${(totalValue/100000000).toFixed(2)}억` : `₩${Math.round(totalValue/10000).toLocaleString()}만`}
                </div>
                <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:6 }}>
                  <span style={{ fontSize: 20, fontWeight: 800, color: totalReturn >= 0 ? "#22d3a0" : "#f87171" }}>
                    {totalReturn >= 0 ? "+" : ""}{totalReturn.toFixed(2)}%
                  </span>
                  <span style={{
                    fontSize: 12, fontWeight: 600, padding: "2px 8px", borderRadius: 20,
                    background: totalReturn >= 0 ? "#34d39918" : "#f8717118",
                    color: totalReturn >= 0 ? "#34d399aa" : "#f87171aa",
                  }}>
                    {totalReturn >= 0 ? "+" : ""}₩{Math.round((totalValue-totalCost)/10000).toLocaleString()}만
                  </span>
                </div>
              </div>
              <div style={{ fontSize: 11, color: "#16162a", paddingTop: 8, borderTop: "1px solid #13183a" }}>
                총 매입 {totalCost >= 100000000 ? `₩${(totalCost/100000000).toFixed(2)}억` : `₩${Math.round(totalCost/10000).toLocaleString()}만`}
              </div>
            </div>
          </div>

          {/* 종목 추가 버튼 */}
          <div style={{ marginBottom: 12 }}>
            <input ref={imgInputRef} id="input-img-upload" type="file" accept="image/*" multiple
              style={{display:"none"}}
              onChange={e=>{ const files = Array.from(e.target.files || []); e.target.value = ""; files.forEach((file, idx) => { setTimeout(() => processFile(file, true), idx * 800); }); }}/>
            <input ref={xlsInputRef} id="input-xls-upload" type="file" accept=".xlsx,.xls,.csv"
              style={{display:"none"}}
              onChange={e=>{ const f=e.target.files?.[0]; e.target.value=""; if(f) processFile(f, true); }}/>
            <input ref={orderImgInputRef} id="input-order-upload" type="file" accept="image/*"
              style={{display:"none"}}
              onChange={e=>{ const f=e.target.files?.[0]; e.target.value=""; if(f) processOrderCapture(f); }}/>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:7, marginBottom:7 }}>
              <label htmlFor="input-img-upload" style={{ padding:"11px 6px", borderRadius:12, background:"#0f0f18", border:"1px solid #16162a", color:"#22d3a0", fontWeight:700, fontSize:12, cursor:"pointer", textAlign:"center", userSelect:"none", display:"block" }}>📷<br/>스크린샷</label>
              <label htmlFor="input-xls-upload" style={{ padding:"11px 6px", borderRadius:12, background:"#0f0f18", border:"1px solid #16162a", color:"#a8b4f8", fontWeight:700, fontSize:12, cursor:"pointer", textAlign:"center", display:"block" }}>📊<br/>엑셀/CSV</label>
              <button onClick={()=>setShowManual(true)} style={{ padding:"11px 6px", borderRadius:12, background:"#0f0f18", border:"1px solid #16162a", color:"#6b7280", fontWeight:700, fontSize:12, cursor:"pointer" }}>✏️<br/>종목추가</button>
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:7, marginBottom:7 }}>
              <button onClick={()=>setShowTradeModal("buy")} style={{ padding:"11px 6px", borderRadius:12, background:"#0a1a0f", border:"1px solid #1a3a28", color:"#22d3a0", fontWeight:700, fontSize:13, cursor:"pointer" }}>▲ 매수</button>
              <button onClick={()=>setShowTradeModal("sell")} style={{ padding:"11px 6px", borderRadius:12, background:"#1a0a0a", border:"1px solid #3a1a1a", color:"#f87171", fontWeight:700, fontSize:13, cursor:"pointer" }}>▼ 매도</button>
            </div>
            <label htmlFor="input-order-upload" style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,width:"100%",padding:"11px",borderRadius:10,cursor:"pointer",background:"#16162a",border:"1px solid #334155",color:"#e2e8f0",fontWeight:700,fontSize:13,boxSizing:"border-box"}}>주문체결/실현손익 캡처</label>
          </div>

          {/* 원형 그래프 */}
          <PortfolioPieCharts portfolio={portfolio} filterAccount={viewMode} />

          {/* 수익률 히스토리 */}
          <ReturnHistoryChart portfolio={portfolio} />

          {/* 정렬 버튼 */}
          <div style={{ display:"flex", gap:6, marginBottom:10, alignItems:"center" }}>
            <span style={{ fontSize:12, color:"#2a3a60" }}>정렬:</span>
            {[{id:"name",label:"종목명"},{id:"value",label:"평가액"},{id:"profit",label:"수익률"}].map(s => (
              <button key={s.id} onClick={() => {
                if (sortBy===s.id) setSortDir(d=>d==="asc"?"desc":"asc");
                else { setSortBy(s.id); setSortDir("desc"); }
              }} style={{
                padding:"5px 10px", borderRadius:8, fontSize:12, cursor:"pointer",
                border:`1px solid ${sortBy===s.id?"#0ea5e9":"#2a2a48"}`,
                background:sortBy===s.id?"#0ea5e922":"transparent",
                color:sortBy===s.id?"#0ea5e9":"#364875", fontWeight:sortBy===s.id?700:400,
              }}>
                {s.label}{sortBy===s.id?(sortDir==="desc"?" ▼":" ▲"):""}
              </button>
            ))}
          </div>

          {/* 종목 목록 */}
          <div style={{ background: "#0f0f18", border: "1px solid #16162a", borderRadius: 16, overflow: "hidden", marginBottom: 14 }}>
            <div style={{ padding: "12px 16px", borderBottom: "1px solid #13183a", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <span style={{ fontSize: 10, color: "#3a4a6a", fontWeight: 700, letterSpacing: 2, textTransform:"uppercase" }}>보유 종목 ({visibleHoldings.length}{cash > 0 ? " + 현금" : ""})</span>
            </div>

            {/* 현금 행 */}

// ---------- AI 조언 탭 ----------
function Advisor() {
  const [loading, setLoading]       = useState(false);
  const [question, setQuestion]     = useState("");
  const [chatHistory, setChatHistory] = useState([]);
  const portfolio = loadPortfolio();

  const getAdvice = async (q, isRetry = false) => {
    if (!q) return;
    setLoading(true);
    const portfolioStr = portfolio
      ? portfolio.holdings.map(h => `${h.name}(${h.ticker}) ${h.shares}주 평단${h.avg_price}`).join(", ")
      : "포트폴리오 정보 없음";
    if (!isRetry) {
      setChatHistory(prev => [...prev, { role: "user", content: q }, { role: "ai", content: "" }]);
      setQuestion("");
    } else {
      // 재시도 시 마지막 AI 응답만 초기화
      setChatHistory(prev => { const u = [...prev]; u[u.length-1] = { role: "ai", content: "" }; return u; });
    }
    try {
      await callGeminiStream({
        maxTokens: 8000,
        useSearch: true,
        system: `당신은 실전 투자 어드바이저입니다. 웹 검색으로 최신 2~3일 시장 정보를 수집한 뒤 답변하세요.

규칙:
- 마크다운(###, **, -) 절대 사용 금지. 일반 텍스트로만 작성
- 핵심만 간결하게. 불필요한 인사말 없이 바로 본론
- 질문에 딱 맞는 답변만
- 종목 추천 시: [보유중] 또는 [신규] 표시 후 종목명 + 이유 + ETF(시총 3000억^ 우선)
- ETF 시총 1000억v 추천 불가. 1000~3000억이면 "(소규모 주의)" 명시
- 수치 기반 근거 제시
- 답변 길이: 핵심만 간결하게
[!] 참고용. 투자 손실 책임은 투자자 본인.`,
        user: `[포트폴리오] ${portfolioStr}\n\n[질문] ${q}`,
        onChunk: (text) => {
          setChatHistory(prev => {
            const updated = [...prev];
            updated[updated.length - 1] = { role: "ai", content: text };
            return updated;
          });
        },
      });
    } catch (e) {
      // 자동 1회 재시도 (network error 등)
      if (!isRetry) {
        console.warn("AI 조언 실패, 재시도:", e.message);
        await new Promise(r => setTimeout(r, 1500));
        return getAdvice(q, true);
      }
      setChatHistory(prev => {
        const updated = [...prev];
        updated[updated.length - 1] = { role: "ai", content: `오류: ${e.message}`, retryQ: q };
        return updated;
      });
    }
    setLoading(false);
  };

  const chatBottomRef = useRef(null);

  // 스트리밍 중 자동 스크롤
  React.useEffect(() => {
    if (loading) chatBottomRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [chatHistory, loading]);

  const quickActions = ["내 포폴 리밸런싱 방향 조언해줘", "현재 모멘텀 섹터에 내 포폴 노출도가 충분한가?", "지금 추가 매수하기 좋은 종목 추천해줘", "내 포폴의 리스크 분석해줘"];

  return (
    <div style={{ padding: "0 4px" }}>
      {!portfolio && (
        <div style={{ background: "#1a0a0a", border: "1px solid #ef444433", borderRadius: 12, padding: 14, marginBottom: 16, fontSize: 15, color: "#fca5a5" }}>
          [!] 포트폴리오 탭에서 계좌를 등록하면 더 정확한 맞춤 조언을 받을 수 있어요
        </div>
      )}

      <div style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 12, color: "#364875", marginBottom: 8, fontWeight: 700, letterSpacing: 1 }}>빠른 질문</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
          {quickActions.map((q, i) => (
            <button key={i} onClick={() => getAdvice(q)} disabled={loading} style={{ background: "#16162a", color: "#94a3b8", border: "1px solid #334155", borderRadius: 20, padding: "6px 14px", cursor: "pointer", fontSize: 14 }}>
              {q}
            </button>
          ))}
        </div>
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        <input
          value={question}
          onChange={e => setQuestion(e.target.value)}
          onKeyDown={e => e.key === "Enter" && !e.shiftKey && getAdvice(question)}
          placeholder="투자 관련 질문을 입력하세요..."
          style={{ flex: 1, background: "#0f0f18", border: "1px solid #334155", borderRadius: 10, padding: "11px 14px", color: "#e2e8f0", fontSize: 16, outline: "none" }}
        />
        <button onClick={() => getAdvice(question)} disabled={loading || !question} style={{ background: "#7c3aed", color: "#fff", border: "none", borderRadius: 10, padding: "11px 18px", cursor: "pointer", fontWeight: 700, opacity: loading || !question ? 0.5 : 1 }}>
          {loading ? <Spinner size={16} /> : "전송"}
        </button>
      </div>

      {chatHistory.length === 0 && !loading && (
        <div style={{ textAlign: "center", padding: "50px 20px", color: "#2a3a60" }}>
          <div style={{ fontSize: 44, marginBottom: 12 }}></div>
          <div style={{ fontSize: 16 }}>AI 투자 어드바이저에게 질문해보세요</div>
          <div style={{ fontSize: 14, marginTop: 6 }}>실시간 웹 검색으로 최신 시장 정보를 반영합니다</div>
        </div>
      )}

      {loading && (
        <div style={{ textAlign: "center", padding: "20px", color: "#364875", fontSize: 15 }}>
          <Spinner size={22} />
          <div style={{ marginTop: 10 }}>시장 정보 검색 중...</div>
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
        {chatHistory.map((msg, i) => (
          <div key={i} style={{
            background: msg.role === "user" ? "#16162a" : "#0f0f18",
            border: `1px solid ${msg.role === "user" ? "#2a2a48" : "#16162a"}`,
            borderRadius: 12, padding: 16,
            borderLeft: msg.role === "ai" ? "3px solid #7c3aed" : "none",
          }}>
            <div style={{ fontSize: 12, color: msg.role === "user" ? "#364875" : "#7c3aed", fontWeight: 700, marginBottom: 7, letterSpacing: 1 }}>
              {msg.role === "user" ? "나의 질문" : "AI 어드바이저"}
            </div>
            <div style={{ color: msg.retryQ ? "#ef4444" : "#cbd5e1", fontSize: 15, lineHeight: 1.8, whiteSpace: "pre-wrap" }}>{msg.content}</div>
            {msg.retryQ && (
              <button onClick={() => getAdvice(msg.retryQ, true)} style={{
                marginTop: 10, background: "#7c3aed22", border: "1px solid #7c3aed44",
                borderRadius: 8, color: "#8b78f5", fontSize: 13, fontWeight: 700,
                cursor: "pointer", padding: "6px 14px",
              }}>↺ 다시 시도</button>
            )}
          </div>
        ))}
        <div ref={chatBottomRef} />
      </div>
    </div>
  );
}
